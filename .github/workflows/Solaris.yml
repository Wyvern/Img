name: Solaris

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Solaris
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      NETBSD_VERSION: "11.0"
      OPENBSD_VERSION: "7.9"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout rust-cross-toolchain
        uses: actions/checkout@v7
        with:
          repository: taiki-e/rust-cross-toolchain
          path: rust-cross-toolchain

      - name: Patch rust-cross-toolchain
        working-directory: rust-cross-toolchain
        run: |
            sed -i 's/\[1-8\]\.\*) ext=tgz ;;/[1-9].*|1[0-9].*) ext=tgz ;;/g' \
            docker/base/netbsd.Dockerfile

            df=(netbsd openbsd linux-gnu)
            for file in "${df[@]}"; do
              dockerfile="docker/$file.Dockerfile"
              if [[ "$file" == "linux-gnu" ]]; then
                sed -i '/^FROM ghcr.io\/taiki-e\/build-base:"${DISTRO}-${DISTRO_VERSION}" AS test-base$/,/^FROM "${DISTRO}":"${DISTRO_VERSION}" AS final$/{
                  /^FROM "${DISTRO}":"${DISTRO_VERSION}" AS final$/!d
                }' "$dockerfile"

                sed -i 's/COPY --from=test \//COPY --from=builder \//' "$dockerfile"
              fi
              sed -i '/RUN \/test\/test.sh/d' "$dockerfile"
              sed -i '/^RUN apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev clang ca-certificates && rm -rf \/var\/lib\/apt\/lists\/\*$/d' "$dockerfile"

              sed -i '/^FROM \(ubuntu:"${UBUNTU_VERSION}"\|"${DISTRO}":"${DISTRO_VERSION}"\) AS final$/a\
              RUN apt-get update \&\& apt-get install -y --no-install-recommends gcc libc6-dev clang ca-certificates \&\& rm -rf /var/lib/apt/lists/*
              ' "$dockerfile"
            done

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker cross-toolchain images
        working-directory: rust-cross-toolchain
        run: |
          IMAGE="${IMAGE,,}"

          if docker manifest inspect "$IMAGE:haiku-cross" &>/dev/null; then
              # docker pull "$IMAGE:haiku-cross" &>/dev/null &
              :
          else
              mkdir -p haiku

              curl -fsSL -o haiku/Dockerfile https://github.com/haiku/haiku/raw/refs/heads/master/3rdparty/docker/cross-compiler/Dockerfile \
              -o haiku/build-toolchain.sh https://github.com/haiku/haiku/raw/refs/heads/master/3rdparty/docker/cross-compiler/build-toolchain.sh

              file="haiku/Dockerfile"
              if ! grep -qF 'ENV CARGO_TARGET_X86_64_UNKNOWN_HAIKU_LINKER=x86_64-unknown-haiku-gcc' "$file"; then
                  sed -i '/RUN \/tmp\/build-toolchain\.sh/a\
              \
              ENV CARGO_TARGET_X86_64_UNKNOWN_HAIKU_LINKER=x86_64-unknown-haiku-gcc\
              ENV CC_x86_64_unknown_haiku=x86_64-unknown-haiku-gcc\
              ENV CXX_x86_64_unknown_haiku=x86_64-unknown-haiku-g++\
              ENV AR_x86_64_unknown_haiku=x86_64-unknown-haiku-ar' \
                      "$file"
                  echo "patched: $file"
              fi

              file="haiku/build-toolchain.sh"
              if grep -q 'Patch RPattern.cpp' "$file"; then
                  echo "already patched: $file"
              else
                  sed -i '/^git clone --depth=1 --branch \$BUILDTOOLS_REV https:\/\/review.haiku-os.org\/buildtools$/a\
              \
              # Patch RPattern.cpp: offsetof() requires <cstddef>.\
              RPattern=$HAIKU/src/kits/storage/sniffer/RPattern.cpp\
              sed -i '\''/^#include "Data.h"$/a #include <cstddef>'\'' "$RPattern"\
              ' "$file"
                  echo "patched: $file"
              fi

              docker buildx build --tag "$IMAGE:haiku-cross" \
                --platform linux/amd64 \
                --provenance=false \
                --progress=quiet \
                --load ./haiku

              docker push "$IMAGE:haiku-cross" &
          fi

          sudo mkdir -p /tools /system
          sudo chown "$USER:" /tools /system
          {
          cid=$(docker create "ghcr.io/wyvern/img:haiku-cross")
          docker cp "$cid:/tools/cross-tools-x86_64" /tools/
          docker cp "$cid:/system/." /system/
          docker rm "$cid"
          touch ~/haiku.finish
          } &>/dev/null &

          targets=(
            csky-unknown-linux-gnuabiv2
            csky-unknown-linux-gnuabiv2hf
          )

          for target in "${targets[@]}"; do
            if docker manifest inspect "$IMAGE:$target" &>/dev/null; then
              docker pull "$IMAGE:$target" &>/dev/null &
            else
              docker buildx build \
                --platform linux/amd64 \
                --provenance=false \
                --load \
                --file docker/linux-gnu.Dockerfile \
                --build-arg RUST_TARGET="$target" \
                --build-arg HOST_ARCH=amd64 \
                --build-arg DISTRO_VERSION=24.04 \
                --progress=quiet \
                --tag "$IMAGE:$target" \
                docker
              docker push "$IMAGE:$target" &>/dev/null &
            fi
          done

          docker pull ghcr.io/apache/nuttx/apache-nuttx-ci-linux:latest &>/dev/null &

          targets=(
            x86_64-unknown-illumos
            sparcv9-sun-solaris
            x86_64-pc-solaris
          )

          for target in ${targets[@]}; do
            CROSS_IMAGE=ghcr.io/cross-rs/${target}:main
            docker pull $CROSS_IMAGE &>/dev/null &
          done

          if docker manifest inspect "$IMAGE:sparc64-unknown-netbsd${NETBSD_VERSION}" &>/dev/null; then
              docker pull "$IMAGE:sparc64-unknown-netbsd${NETBSD_VERSION}" &>/dev/null &
          else
              # NetBSD base image required by docker/netbsd.Dockerfile
              docker buildx build \
                --platform linux/amd64 \
                --provenance=false \
                --load \
                --progress=quiet \
                --file docker/base/netbsd.Dockerfile \
                --build-arg RUST_TARGET=sparc64-unknown-netbsd \
                --build-arg HOST_ARCH=amd64 \
                --build-arg UBUNTU_VERSION=24.04 \
                --build-arg NETBSD_VERSION="$NETBSD_VERSION" \
                --tag ghcr.io/taiki-e/rust-cross-toolchain:sparc64-unknown-netbsd${NETBSD_VERSION}-base-dev-amd64 \
                docker/base

              # NetBSD final image
              docker buildx build \
                --platform linux/amd64 \
                --provenance=false \
                --load \
                --progress=quiet \
                --file docker/netbsd.Dockerfile \
                --build-arg RUST_TARGET=sparc64-unknown-netbsd \
                --build-arg HOST_ARCH=amd64 \
                --build-arg UBUNTU_VERSION=24.04 \
                --build-arg NETBSD_VERSION="$NETBSD_VERSION" \
                --tag "$IMAGE:sparc64-unknown-netbsd${NETBSD_VERSION}" \
                docker
              docker push "$IMAGE:sparc64-unknown-netbsd${NETBSD_VERSION}" &>/dev/null &
          fi

          if docker manifest inspect "$IMAGE:sparc64-unknown-openbsd${OPENBSD_VERSION}" &>/dev/null; then
              docker pull "$IMAGE:sparc64-unknown-openbsd${OPENBSD_VERSION}" &>/dev/null &
          else
              # OpenBSD final image
              docker buildx build \
                --platform linux/amd64 \
                --provenance=false \
                --load \
                --progress=quiet \
                --file docker/openbsd.Dockerfile \
                --build-arg RUST_TARGET=sparc64-unknown-openbsd \
                --build-arg HOST_ARCH=amd64 \
                --build-arg UBUNTU_VERSION=24.04 \
                --build-arg OPENBSD_VERSION="$OPENBSD_VERSION" \
                --tag "$IMAGE:sparc64-unknown-openbsd${OPENBSD_VERSION}" \
                docker
              docker push "$IMAGE:sparc64-unknown-openbsd${OPENBSD_VERSION}" &>/dev/null &
          fi

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Sccache Action
        uses: Mozilla-Actions/sccache-action@main

      - name: C/C++ sccache wrappers
        run: |
          set -euo pipefail

          mkdir -p "sccache-bin"

          for compiler in clang clang++ gcc g++; do
            cat > "sccache-bin/$compiler" <<EOF
          #!/bin/bash
          exec sccache /usr/bin/$compiler "\$@"
          EOF
            chmod +x "sccache-bin/$compiler"
          done

          echo "$PWD/sccache-bin" >> "$GITHUB_PATH"

      - name: Cache cross-rs
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross
          restore-keys: ${{ runner.os }}-cross

      - name: Cross-rs
        run: |
          if [ ! -f ~/.cargo/bin/cross ]; then
            cargo install cross --git https://github.com/cross-rs/cross --branch main -q --force &>/dev/null
          fi
          # cross --version

      - name: Build Release
        run: |
          cargo update
          set +e -x

          time {
              # set +x
              while [[ ! -f ~/haiku.finish ]]; do
                  sleep 1
              done
          }
          exit
          ln -s /tools/cross-tools-x86_64 haiku
          time cargo s x86_64-unknown-haiku &

          cb=(cross build -q --profile src -Zbuild-std=std,panic_abort --target)

          targets=(
            aarch64-unknown-nuttx
            riscv64gc-unknown-nuttx-elf
          )
          for target in ${targets[@]}; do
            time "${cb[@]}" $target
          done

          targets=(
            csky-unknown-linux-gnuabiv2
            csky-unknown-linux-gnuabiv2hf
            sparc64-unknown-netbsd
            sparc64-unknown-openbsd
            x86_64-unknown-illumos
            sparcv9-sun-solaris
            x86_64-pc-solaris
          )

          for target in ${targets[@]}; do
            time "${cb[@]}" $target &
          done

          wait

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
            sparc64-unknown-netbsd
            sparc64-unknown-openbsd
            x86_64-unknown-illumos
            sparcv9-sun-solaris
            x86_64-pc-solaris
            x86_64-unknown-haiku
            csky-unknown-linux-gnuabiv2
            csky-unknown-linux-gnuabiv2hf
          )
          for target in "${targets[@]}"; do
            IFS='-' read -r arch vendor os abi <<< "$target"
            if [[ -n "$abi" ]]; then
                name="${os^}-${arch}-${abi}"
            else
                name="${os^}-${arch}"
            fi
            echo "Uploading $name..."
            mv target/$target/src/{img,$name} || true
            gh release upload Nightly --clobber target/$target/src/$name || true
          done
