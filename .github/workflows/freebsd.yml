name: FreeBSD

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: FreeBSD
    runs-on: ubuntu-24.04-arm

    steps:
      # - name: Purge Ubuntu
      #   run: |
      #     sudo apt purge -y ufw rsyslog logrotate sysstat python3-problem-report sosreport apport
      #     sudo apt autoremove -y && sudo apt clean
      #     sudo systemctl disable --now systemd-journald

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Ubuntu apt update and install
        run: |
          sudo apt update -q && sudo apt install qemu-user-static -qy

      - name: Build Release
        run: |
          cargo update
          set +e -x

          export CFLAGS_x86_64_unknown_freebsd="-isystem /opt/freebsd-x86_64/usr/include"
          curl -O https://download.freebsd.org/ftp/releases/amd64/14.3-RELEASE/base.txz
          curl -O https://download.freebsd.org/ftp/releases/amd64/14.3-RELEASE/lib.txz
          sudo mkdir -p /opt/freebsd-x86_64
          sudo tar -xJf base.txz -C /opt/freebsd-x86_64
          sudo tar -xJf lib.txz -C /opt/freebsd-x86_64

          export CFLAGS_aarch64_unknown_freebsd="-isystem /opt/freebsd-arm64/usr/include"
          curl -O https://download.freebsd.org/ftp/releases/arm64/14.3-RELEASE/base.txz
          curl -O https://download.freebsd.org/ftp/releases/arm64/14.3-RELEASE/lib.txz
          sudo mkdir -p /opt/freebsd-arm64
          sudo tar -xJf base.txz -C /opt/freebsd-arm64
          sudo tar -xJf lib.txz -C /opt/freebsd-arm64

          targets=(
            x86_64-unknown-freebsd
            aarch64-unknown-freebsd
          )

          for target in ${targets[@]}; do
            time cargo s --target $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "x86_64-unknown-freebsd FreeBSD-x86_64"
                  "aarch64-unknown-freebsd FreeBSD-aarch64"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/src/Img target/$arch/src/$name || true
            gh release upload Nightly target/$arch/src/$name --clobber || true
          done
