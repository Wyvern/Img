name: FreeBSD

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: FreeBSD
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Ubuntu apt update and install
        run: |
          # wget https://apt.llvm.org/llvm-snapshot.gpg.key
          # sudo apt-key add llvm-snapshot.gpg.key

          # sudo apt-add-repository "deb http://apt.llvm.org/$(lsb_release -sc)/ llvm-toolchain-$(lsb_release -sc)-21 main"

          sudo apt update -q && sudo apt install qemu-user-static -qy

      - name: Build Release
        run: |
          cargo update
          set +e -x

          curl -O https://download.freebsd.org/ftp/releases/amd64/14.3-RELEASE/base.txz
          sudo mkdir -p /opt/freebsd/amd64
          sudo tar -xJf base.txz -C /opt/freebsd/amd64

          curl -O https://download.freebsd.org/ftp/releases/arm64/14.3-RELEASE/base.txz
          sudo mkdir -p /opt/freebsd/arm64
          sudo tar -xJf base.txz -C /opt/freebsd/arm64

          curl -O https://download.freebsd.org/ftp/releases/riscv/14.3-RELEASE/base.txz
          sudo mkdir -p /opt/freebsd/riscv
          sudo tar -xJf base.txz -C /opt/freebsd/riscv

          curl -O https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/evbarm-aarch64/binary/sets/base.tar.xz
          curl -O https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/evbarm-aarch64/binary/sets/comp.tar.xz
          curl -O https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/evbarm-aarch64/binary/sets/etc.tar.xz
          sudo mkdir -p /opt/netbsd/arm64
          sudo tar -C /opt/netbsd/arm64 -xJf base.tar.xz
          sudo tar -C /opt/netbsd/arm64 -xJf comp.tar.xz
          sudo tar -C /opt/netbsd/arm64 -xJf etc.tar.xz

          curl -O https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/amd64/binary/sets/base.tar.xz
          curl -O https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/amd64/binary/sets/comp.tar.xz
          curl -O https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/amd64/binary/sets/etc.tar.xz
          sudo mkdir -p /opt/netbsd/amd64
          sudo tar -C /opt/netbsd/amd64 -xJf base.tar.xz
          sudo tar -C /opt/netbsd/amd64 -xJf comp.tar.xz
          sudo tar -C /opt/netbsd/amd64 -xJf etc.tar.xz

          targets=(
            x86_64-unknown-freebsd
            aarch64-unknown-freebsd
            riscv64gc-unknown-freebsd
            x86_64-unknown-netbsd
            aarch64-unknown-netbsd
          )

          for target in ${targets[@]}; do
            time cargo s --target $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "x86_64-unknown-freebsd FreeBSD-x86_64"
                  "aarch64-unknown-freebsd FreeBSD-aarch64"
                  "riscv64gc-unknown-freebsd FreeBSD-riscv64"
                  "x86_64-unknown-netbsd NetBSD-x86_64"
                  "aarch64-unknown-netbsd NetBSD-aarch64"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/src/Img target/$arch/src/$name || true
            gh release upload Nightly target/$arch/src/$name --clobber || true
          done
