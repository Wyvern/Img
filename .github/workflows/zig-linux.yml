name: Zig-Linux

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  macOS:
    name: Zig-Linux
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ubuntu apt update and install
        run: |
          sudo apt install gcc-i686-linux-gnu gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf musl-tools -qy &>/dev/null &

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: C/C++ sccache wrappers
        run: |
          set -euo pipefail

          mkdir -p "sccache-bin"

          for compiler in clang clang++ gcc g++; do
            cat > "sccache-bin/$compiler" <<EOF
          #!/bin/bash
          exec sccache /usr/bin/$compiler "\$@"
          EOF
            chmod +x "sccache-bin/$compiler"
          done

          echo "$PWD/sccache-bin" >> "$GITHUB_PATH"

      - name: Zig toolchain install
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
            i586-unknown-linux-gnu
            i586-unknown-linux-musl
            i686-unknown-linux-gnu
            i686-unknown-linux-musl
            armv7-unknown-linux-musleabi
            armv7-unknown-linux-musleabihf
            armv7-unknown-linux-gnueabi
            armv7-unknown-linux-gnueabihf
            armv7-unknown-linux-uclibceabi
            armv7-unknown-linux-uclibceabihf
            armv5te-unknown-linux-uclibceabi
            armv5te-unknown-linux-gnueabi
            armv5te-unknown-linux-musleabi
            arm-unknown-linux-gnueabi
            arm-unknown-linux-gnueabihf
            arm-unknown-linux-musleabi
            arm-unknown-linux-musleabihf
            armeb-unknown-linux-gnueabi
          )

          for target in ${targets[@]}; do
            time cargo s $target &
          done
          wait
          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
            i586-unknown-linux-gnu
            i586-unknown-linux-musl
            i686-unknown-linux-gnu
            i686-unknown-linux-musl
            armv7-unknown-linux-musleabi
            armv7-unknown-linux-musleabihf
            armv7-unknown-linux-gnueabi
            armv7-unknown-linux-gnueabihf
            armv7-unknown-linux-uclibceabi
            armv7-unknown-linux-uclibceabihf
            armv5te-unknown-linux-uclibceabi
            armv5te-unknown-linux-gnueabi
            armv5te-unknown-linux-musleabi
            arm-unknown-linux-gnueabi
            arm-unknown-linux-gnueabihf
            arm-unknown-linux-musleabi
            arm-unknown-linux-musleabihf
            armeb-unknown-linux-gnueabi
          )

          for target in "${targets[@]}"; do
            IFS='-' read -r arch vendor os abi <<< "$target"
            if [[ "$vendor" == "win7" ]]; then
                name="${os^}-${arch}-${abi}-${vendor}"
            elif [[ -n "$abi" ]]; then
                name="${os^}-${arch}-${abi}"
            else
                name="${os^}-${arch}"
            fi

            echo "Uploading $name..."
            if [[ "$os" == "windows" ]]; then
              mv target/$target/src/{img.exe,$name.exe}|| true
              gh release upload Nightly --clobber target/$target/src/$name.exe || true
            else
              mv target/$target/src/{img,$name}|| true
              gh release upload Nightly --clobber target/$target/src/$name || true
            fi
          done
