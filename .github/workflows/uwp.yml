name: uwp

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  macOS:
    name: uwp
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ubuntu apt update and install
        run: |
          # sudo apt install crosshurd -qy &>/dev/null

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: C/C++ sccache wrappers
        run: |
          set -euo pipefail

          mkdir -p "sccache-bin"

          for compiler in clang clang++ gcc g++; do
            cat > "sccache-bin/$compiler" <<EOF
          #!/bin/bash
          exec sccache /usr/bin/$compiler "\$@"
          EOF
            chmod +x "sccache-bin/$compiler"
          done

          echo "$PWD/sccache-bin" >> "$GITHUB_PATH"

      # - name: Zig toolchain install
      #   uses: mlugg/setup-zig@v2
      #   with:
      #     version: master

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Release
        run: |
          cargo update
          set +e -x

          # time {
          #     set +x
          #     while [[ ! -e freebsd/armv7 ]]; do
          #         sleep 1
          #     done
          # }

          make hurd
          cd hurd

          cat > Dockerfile <<'EOF'
          FROM ubuntu:24.04

          ENV DEBIAN_FRONTEND=noninteractive
          ENV PATH="/cross-tools-i686/bin:${PATH}"

          RUN apt-get update && apt-get install -y --no-install-recommends \
              git sudo ca-certificates curl wget \
              build-essential make gcc g++ perl \
              texinfo autopoint pkg-config libtool \
              autotools-dev automake autoconf gettext \
              libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev \
              flex bison gawk m4 patch xz-utils bzip2 \
              file python3 \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /src/cross-hurd

          RUN git clone --depth=1 https://github.com/flavioc/cross-hurd.git . \
              && CPU=i686 bash download.sh \
              && CPU=i686 bash bootstrap.sh \
              && test -x /cross-tools-i686/bin/i686-gnu-gcc \
              && /cross-tools-i686/bin/i686-gnu-gcc -dumpmachine

          ENTRYPOINT ["/cross-tools-i686/bin/i686-gnu-gcc"]
          EOF

          docker build --platform linux/amd64 \
              --provenance=false \
              --load \
              -t ghcr.io/wyvern/img:hurd-i686 .

          docker push ghcr.io/wyvern/img:hurd-i686
          exit
          targets=(
            i686-unknown-hurd-gnu
          )
          for target in ${targets[@]}; do
            time cargo s $target
          done

          exit

          find ./target -iname img.exe -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(

          )

          for target in "${targets[@]}"; do
            IFS='-' read -r arch vendor os abi <<< "$target"
            if [[ "$vendor" == "win7" ]]; then
                name="${os^}-${arch}-${abi}-${vendor}"
            elif [[ -n "$abi" ]]; then
                name="${os^}-${arch}-${abi}"
            else
                name="${os^}-${arch}"
            fi
            name="${name}.exe"
            echo "Uploading $name..."
            mv target/$target/src/{img.exe,$name}|| true
            gh release upload Nightly --clobber target/$target/src/$name || true
          done
