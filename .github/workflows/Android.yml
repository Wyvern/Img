name: Android

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"
  IMAGE: ghcr.io/${{ github.repository }}
  ndk: "r30"

jobs:
  Linux:
    name: Ubuntu-26.04
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: C/C++ sccache wrappers
        run: |
          set -euo pipefail

          mkdir -p "sccache-bin"

          for compiler in clang clang++ gcc g++; do
            cat > "sccache-bin/$compiler" <<EOF
          #!/bin/bash
          exec sccache /usr/bin/$compiler "\$@"
          EOF
            chmod +x "sccache-bin/$compiler"
          done

          echo "$PWD/sccache-bin" >> "$GITHUB_PATH"

      - name: setup-oras
        uses: oras-project/setup-oras@v2

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Android and OHOS NDK
        run: |
          IMAGE="${IMAGE,,}"

          if oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:android-ndk-${ndk}" >/dev/null 2>&1; then
            oras pull --allow-path-traversal "${IMAGE}:android-ndk-${ndk}" -o ~/
            unzip -q ~/android-ndk-${ndk}-linux.zip -d ~/ &
          else
            echo "Downloading & UnZipping Android NDK ${ndk} ..."
            curl -fsSLO https://dl.google.com/android/repository/android-ndk-${ndk}-linux.zip
            unzip -q android-ndk-${ndk}-linux.zip -d ~/ &
            echo "Push android-ndk-${ndk}-linux.zip to GHCR..."
            oras push --disable-path-validation "${IMAGE}:android-ndk-${ndk}" "android-ndk-${ndk}-linux.zip:application/zip" &
          fi

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@main
        with:
          version: "6.1"

      - name: Build Release
        run: |
          cargo update
          set +e -x

          export ANDROID_NDK_HOME="~/android-ndk-$ndk"
          ln -sf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64" ndk

          ln -sf $OHOS_SDK_NATIVE/llvm ohos
          ln -sf $OHOS_SDK_NATIVE/sysroot ohos-root

          targets=(
            aarch64-unknown-linux-ohos
            armv7-unknown-linux-ohos
            x86_64-unknown-linux-ohos
            riscv64-linux-android
            aarch64-linux-android
            armv7-linux-androideabi
            thumbv7neon-linux-androideabi
            x86_64-linux-android
          )

          for target in ${targets[@]}; do
            time cargo s $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  riscv64-linux-android
                  aarch64-linux-android
                  armv7-linux-androideabi
                  thumbv7neon-linux-androideabi
                  x86_64-linux-android
                  aarch64-unknown-linux-ohos
                  armv7-unknown-linux-ohos
                  x86_64-unknown-linux-ohos
          )
          for target in "${targets[@]}"; do
            IFS='-' read -r arch vendor os abi rest <<< "$target"
            if [[ -n "$abi" ]]; then
                if [[ "$vendor" == "openwrt" ]]; then
                    name="${vendor^}-${arch}-${abi}"
                else
                    if [[ "$abi" == "ohos" ]]; then
                        name="Android-${arch}-${abi}"
                    else
                        name="${os^}-${arch}-${abi}"
                    fi
                fi
            else
                if [[ "$os" == "androideabi" ]]; then
                    name="Android-${arch}"
                else
                    name="${os^}-${arch}"
                fi
            fi

            echo "Uploading $name..."
            mv target/$target/src/{img,$name}|| true
            gh release upload Nightly --clobber target/$target/src/$name || true
          done
