name: macOS

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"
  mingw: "20260908"

jobs:
  macOS:
    name: macOS-26
    runs-on: macos-26

    permissions:
      contents: write
      packages: write

    steps:
      - name: Disable macos spotlight index
        run: |
          sudo mdutil -a -i off &
          sudo mdutil -a -d &
          sudo pmset -a powernap 0 &
          sudo pmset -a sleep 0 &

      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip2,wasm32-wasip3
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: C/C++ sccache wrappers
        run: |
          set -euo pipefail

          mkdir -p "sccache-bin"

          for compiler in clang clang++ gcc g++; do
            cat > "sccache-bin/$compiler" <<EOF
          #!/bin/bash
          exec sccache /usr/bin/$compiler "\$@"
          EOF
            chmod +x "sccache-bin/$compiler"
          done

          echo "$PWD/sccache-bin" >> "$GITHUB_PATH"

      - name: Cache llvm-mingw
        uses: actions/cache@v6
        with:
          path: llvm-mingw
          key: ${{ runner.os }}-${{env.mingw}}
          restore-keys: ${{ runner.os }}-llvm-${{env.mingw}}

      - name: llvm-mingw
        run: |
          if [ ! -d llvm-mingw ]; then
            mkdir llvm-mingw
            curl -LsSf https://github.com/mstorsjo/llvm-mingw/releases/download/${mingw}/llvm-mingw-${mingw}-ucrt-macos-universal.tar.xz | tar -xJf - -C llvm-mingw --strip-components=1 &
          fi
          echo "$PWD/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
            aarch64-apple-ios
            arm64e-apple-ios
            aarch64-apple-tvos
            arm64e-apple-tvos
            aarch64-apple-watchos
            arm64_32-apple-watchos
            armv7k-apple-watchos
            aarch64-apple-visionos
            aarch64-apple-darwin
            arm64e-apple-darwin
            x86_64h-apple-darwin
            wasm32-wasip2
            wasm32-wasip3
            aarch64-pc-windows-gnullvm
            x86_64-pc-windows-gnullvm
          )

          for target in ${targets[@]}; do
            time cargo s $target &
          done
          wait
          lipo -create target/arm64e-apple-darwin/src/img target/x86_64h-apple-darwin/src/img -output Img-Universal

          find ./target \( -iname img -o -iname img.exe -o -iname img.wasm -o -iname Img-Universal \) -type f | xargs ls -hl
          sw_vers
          hostinfo
          sysctl -n machdep.cpu.brand_string

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
              x86_64h-apple-darwin
              aarch64-apple-darwin
              arm64e-apple-darwin
              aarch64-apple-ios
              arm64e-apple-ios
              aarch64-apple-tvos
              arm64e-apple-tvos
              aarch64-apple-watchos
              arm64_32-apple-watchos
              armv7k-apple-watchos
              aarch64-apple-visionos
              aarch64-pc-windows-gnullvm
              x86_64-pc-windows-gnullvm
              wasm32-wasip2
              wasm32-wasip3
          )

          for target in "${targets[@]}"; do
              IFS='-' read -r arch vendor os abi <<< "$target"
              if [[ -z "$os" ]]; then
                  os="$arch"
                  arch="$vendor"
              fi
              first=$(printf '%s' "$os" | cut -c1 | tr '[:lower:]' '[:upper:]')
              rest=$(printf '%s' "$os" | cut -c2-)
              os_cap="${first}${rest}"

              if [[ -n "$abi" ]]; then
                  name="${os_cap}-${arch}-${abi}"
              elif [[ "$vendor" == "apple" ]]; then
                  if [[ "$os" == "darwin" ]]; then
                    os="macOS"
                  elif [[ "$os" == *os ]]; then
                    os="${os%os}OS"
                  fi
                  name=Apple-${os}-${arch}
              else
                  name="${os_cap}-${arch}"
              fi

              src="target/$target/src/img"
              ext=""
              if [[ -f "$src" ]]; then
                  echo "Uploading $name..."
                  mv target/$target/src/{img,$name} || true
                  gh release upload Nightly "target/$target/src/$name" --clobber || true
              else
                  for f in "${src}".*; do
                      if [[ -f "$f" ]]; then
                          ext=".${f##*.}"
                          [[ "$ext" == ".d" ]] && continue
                          name="${name}${ext}"
                          echo "Uploading $name..."
                          mv target/$target/src/{img${ext},$name} || true
                          gh release upload Nightly "target/$target/src/$name" --clobber || true
                          break
                      fi
                  done
              fi
          done

          echo "Uploading Apple-macOS-universal..."
          gh release upload Nightly Img-Universal#Apple-macOS-universal --clobber || true
