name: macOS

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  macOS:
    name: Building on macOS.
    runs-on: macos-15

    steps:
      - name: Disable macos spotlight index
        run: |
          sudo mdutil -a -i off
          sudo mdutil -a -d
          sudo pmset -a powernap 0
          sudo pmset -a sleep 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          target: wasm32-wasip2
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Build Release
        run: |
          cargo update
          set +e -x
          time cargo s --target arm64e-apple-ios
          time cargo s --target arm64e-apple-tvos
          time cargo s --target aarch64-apple-watchos
          time cargo s --target aarch64-apple-visionos
          time cargo s --target arm64e-apple-darwin
          time cargo s --target x86_64h-apple-darwin
          time cargo s --target wasm32-wasip2

          lipo -create target/arm64e-apple-darwin/src/Img target/x86_64h-apple-darwin/src/Img -output Img-Universal

          find . \( -iname img -o -iname img.wasm -o -iname Img-Universal \) -type f | xargs ls -hl
          sw_vers
          hostinfo
          sysctl -a | grep brand

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload macOS x86-64h to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64h-apple-darwin/src/Img
          asset_name: Apple-macOS-x86_64h
          tag: Nightly
          overwrite: true
          body: "macOS x86-64h binary executable."

      - name: Upload macOS-arm64e to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/arm64e-apple-darwin/src/Img
          asset_name: Apple-macOS-arm64e
          tag: Nightly
          overwrite: true
          body: "macOS arm64e binary executable."

      - name: Upload macOS-universal to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Img-Universal
          asset_name: Apple-macOS-universal
          tag: Nightly
          overwrite: true
          body: "macOS universal binary executable."

      - name: Upload iOS to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/arm64e-apple-ios/src/Img
          asset_name: Apple-iOS
          tag: Nightly
          overwrite: true
          body: "iOS binary executable."

      - name: Upload tvOS to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/arm64e-apple-tvos/src/Img
          asset_name: Apple-tvOS
          tag: Nightly
          overwrite: true
          body: "tvOS binary executable."

      - name: Upload visionOS to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-apple-visionos/src/Img
          asset_name: Apple-visionOS
          tag: Nightly
          overwrite: true
          body: "visionOS binary executable."

      - name: Upload watchosOS to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-apple-watchos/src/Img
          asset_name: Apple-watchOS
          tag: Nightly
          overwrite: true
          body: "watchOS binary executable."

      - name: Upload Wasm32-wasip2 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/wasm32-wasip2/src/Img.wasm
          asset_name: wasm32-wasip2.wasm
          tag: Nightly
          overwrite: true
          body: "Wasm32-wasip2"
