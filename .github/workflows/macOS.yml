name: macOS

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  macOS:
    name: Building on macOS.
    runs-on: macos-15

    steps:
      - name: Disable macos spotlight index
        run: |
          sudo mdutil -a -i off
          sudo mdutil -a -d
          sudo pmset -a powernap 0
          sudo pmset -a sleep 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          target: wasm32-wasip2
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
            aarch64-apple-ios
            aarch64-apple-tvos
            aarch64-apple-watchos
            aarch64-apple-visionos
            aarch64-apple-darwin
            x86_64h-apple-darwin
            wasm32-wasip2
          )

          for target in "${targets[@]}"; do
            echo "Building for target: $target"
            time cargo s --target $target
          done

          lipo -create target/aarch64-apple-darwin/src/Img target/x86_64h-apple-darwin/src/Img -output Img-Universal

          find . \( -iname img -o -iname img.wasm -o -iname Img-Universal \) -type f | xargs ls -hl
          sw_vers
          hostinfo
          sysctl -a | grep brand

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload binaries to a GitHub release
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for arch in "x86_64h-apple-darwin Apple-macOS-x86_64h 'macOS x86-64h'" \
                      "aarch64-apple-darwin Apple-macOS-aarch64 'macOS aarch64'"\
                      "aarch64-apple-ios iOS-aarch64 'iOS aarch64'"\
                      "aarch64-apple-tvos tvOS-aarch64 'tvOS aarch64'"\
                      "aarch64-apple-watchos watchOS-aarch64 'watchOS aarch64'"\
                      "aarch64-apple-visionos visionOS-aarch64 'visionOS aarch64'"\
                      "wasm32-wasip2 wasm32-wasip2.wasm 'wasm32-wasip2'"; do
            set -- $arch
            echo "Uploading $2..."
            gh release upload Nightly target/$1/src/Img --clobber --name "$2" --body "$3 binary executable." || true
          done

      - name: Upload macOS-universal to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Img-Universal
          asset_name: Apple-macOS-universal
          tag: Nightly
          overwrite: true
          body: "macOS universal binary executable."
