name: Linux

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Building on Ubuntu.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - {
              arch: "powerpc64-unknown-linux-gnu",
              name: "Linux-powerpc64-gnu",
              desc: "Linux-powerpc64-gnu",
            }
          - {
              arch: "powerpc64-unknown-linux-musl",
              name: "Linux-powerpc64-musl",
              desc: "Linux-powerpc64-musl",
            }

    steps:
      - name: Purge Ubuntu
        run: |
          sudo apt purge -y ufw rsyslog logrotate sysstat python3-problem-report sosreport apport
          sudo apt autoremove -y && sudo apt clean
          sudo systemctl disable --now systemd-journald

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Ubuntu apt update and install
        run: |
          sudo apt update -q && sudo apt install -q gcc-powerpc64-linux-gnu musl-tools -y

      - name: Build Release
        run: |
          # sudo snap install zig --classic --beta
          # pipx install cargo-zigbuild

          cargo update
          set +e -x

          targets=(
            powerpc64-unknown-linux-gnu
            powerpc64-unknown-linux-musl
          )

          for target in "${targets[@]}"; do
            echo "Building for target: $target"
            time cargo s --target $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload ${{ matrix.target.name }} to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target.arch }}/src/Img
          asset_name: ${{ matrix.target.name }}
          tag: Nightly
          overwrite: true
          body: ${{ matrix.target.desc }} binary executable.
