name: Linux

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Android NDK cache
        uses: actions/cache@v5
        with:
          path: /home/runner/android-ndk-r29
          key: android-ndk-r29
          restore-keys: android-ndk-r29

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@main
        with:
          version: "6.1"

      - name: Cache openwrt
        uses: actions/cache@v5
        with:
          path: /home/runner/openwrt
          key: openwrt-25.12.2
          restore-keys: openwrt-25.12.2

      - name: Cache uclibc
        uses: actions/cache@v5
        with:
          path: /home/runner/armv7-eabihf--uclibc
          key: uclibc-2025.08-1
          restore-keys: uclibc-2025.08-1

      - name: Cache hexagon
        uses: actions/cache@v5
        with:
          path: /home/runner/hexagon
          key: hexagon-22.1.4
          restore-keys: hexagon-22.1.4

      - name: Ubuntu apt update and install
        run: sudo apt install gcc-powerpc64-linux-gnu musl-tools -qy

      - name: Install LLVM
        run: |
          sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" -- 22
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 200
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-22 200

      - name: Android and OHOS NDK
        run: |
          ver=r29
          export ANDROID_NDK_HOME=~/android-ndk-$ver
          ln -sf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64" ndk

          if [ ! -d ~/android-ndk-${ver} ]; then
            mkdir -p ~/android-ndk-${ver}
            echo "Downloading Android NDK..."
            curl -fsSLO https://dl.google.com/android/repository/android-ndk-${ver}-linux.zip
            echo "Unzipping Android NDK..."
            unzip -q android-ndk-${ver}-linux.zip -d ~/
          fi

          ln -sf $OHOS_SDK_NATIVE/llvm ohos
          ln -sf $OHOS_SDK_NATIVE/sysroot ohos-root

      - name: Toolchain downloads
        run: |
          if [ ! -d /home/runner/openwrt ]; then
            mkdir -p /home/runner/openwrt
            curl -LsSf https://downloads.openwrt.org/releases/25.12.2/targets/octeon/generic/openwrt-toolchain-25.12.2-octeon-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst | tar --zstd -xf - -C /home/runner/openwrt
          fi
          ln -sf /home/runner/openwrt/openwrt-toolchain-25.12.2-octeon-generic_gcc-14.3.0_musl.Linux-x86_64/toolchain-mips64_octeonplus_64_gcc-14.3.0_musl wrt

          if [ ! -d /home/runner/armv7-eabihf--uclibc ]; then
            mkdir -p /home/runner/armv7-eabihf--uclibc
            curl -LsSf https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--uclibc--bleeding-edge-2025.08-1.tar.xz | tar -xJ -C /home/runner/armv7-eabihf--uclibc
          fi
          ln -sf /home/runner/armv7-eabihf--uclibc/armv7-eabihf--uclibc--bleeding-edge-2025.08-1 uclibc

          if [ ! -d /home/runner/hexagon ]; then
            mkdir -p /home/runner/hexagon
            curl -LsSf https://artifacts.codelinaro.org/artifactory/codelinaro-toolchain-for-hexagon/22.1.4_/clang+llvm-22.1.4-cross-hexagon-unknown-linux-musl_x86_64-linux-musl.tar.zst | tar --zstd -xf - -C /home/runner/hexagon
          fi
          ln -sf /home/runner/hexagon/clang+llvm-22.1.4-cross-hexagon-unknown-linux-musl/x86_64-linux-musl hexagon

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
            hexagon-unknown-linux-musl
            armv7-unknown-linux-uclibceabihf
            mips64-openwrt-linux-musl
            aarch64-unknown-linux-ohos
            armv7-unknown-linux-ohos
            x86_64-unknown-linux-ohos
            riscv64-linux-android
            aarch64-linux-android
            armv7-linux-androideabi
            thumbv7neon-linux-androideabi
            x86_64-linux-android
            powerpc64-unknown-linux-gnu
            ./powerpc64-unknown-linux-musl-elfv1.json
          )

          for target in ${targets[@]}; do
            time cargo s $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  hexagon-unknown-linux-musl
                  armv7-unknown-linux-uclibceabihf
                  riscv64-linux-android
                  aarch64-linux-android
                  armv7-linux-androideabi
                  thumbv7neon-linux-androideabi
                  x86_64-linux-android
                  powerpc64-unknown-linux-gnu
                  powerpc64-unknown-linux-musl-elfv1
                  aarch64-unknown-linux-ohos
                  armv7-unknown-linux-ohos
                  x86_64-unknown-linux-ohos
                  mips64-openwrt-linux-musl
          )
          for target in "${targets[@]}"; do
            IFS='-' read -r arch vendor os abi rest <<< "$target"
            if [[ -n "$abi" ]]; then
                if [[ "$vendor" == "openwrt" ]]; then
                    name="${vendor^}-${arch}-${abi}"
                else
                    if [[ "$abi" == "ohos" ]]; then
                        name="Android-${arch}-${abi}"
                    else
                        name="${os^}-${arch}-${abi}"
                    fi
                fi
            else
                if [[ "$os" == "androideabi" ]]; then
                    name="Android-${arch}"
                else
                    name="${os^}-${arch}"
                fi
            fi

            echo "Uploading $name..."
            mv target/$target/src/img target/$target/src/$name || true
            gh release upload Nightly --clobber target/$target/src/$name || true
          done
