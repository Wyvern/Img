name: Linux

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"
  IMAGE: ghcr.io/${{ github.repository }}
  openwrt: "25.12.5"
  aarch64be: "2026.08-1"
  hexagon: "22.1.8"

jobs:
  Linux:
    name: Ubuntu-24.04
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nix Quick Install
        uses: nixbuild/nix-quick-install-action@v35

      - name: Ubuntu apt update and install
        run: |
          sudo apt install gcc-powerpc64-linux-gnu gcc-powerpc64le-linux-gnu gcc-powerpc-linux-gnu gcc-mips-linux-gnu gcc-mipsel-linux-gnu gcc-sparc64-linux-gnu libc6-dev-sparc-sparc64-cross gcc-multilib-sparc64-linux-gnu musl-tools libc++1 libc++abi1 -qy &>/dev/null && touch ~/apt.finish &
          nix build --quiet -o ppc64-gnu nixpkgs#pkgsCross.ppc64-elfv2.stdenv.cc &
          nix build --quiet -o ppc64-musl nixpkgs#pkgsCross.ppc64-musl.stdenv.cc &
          # mkdir -p l4re && curl -fsSL https://l4re.org/download/snapshots/toolchain/toolchain-l4re-arm64-gcc-15.tar.xz | tar -xJf - -C l4re --strip-components=1 &

      - name: setup-oras
        uses: oras-project/setup-oras@v2

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Cache aarch64be
        run: |
          IMAGE="${IMAGE,,}"

          path=/home/runner/aarch64be
          mkdir -p $path

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:aarch64be-${aarch64be}"); then
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C $path &
            ln -sfn $path/glibc aarch64be-gnu
            ln -sfn $path/musl aarch64be-musl
          else
            for abi in glibc musl; do
              url=https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64be/tarballs/aarch64be--${abi}--stable-${aarch64be}.tar.xz
              mkdir -p "$path/$abi" && curl -LsSf $url | tar -xJ -C "$path/$abi" --strip-components=1 &
            done
              ln -sfn $path/glibc aarch64be-gnu
              ln -sfn $path/musl aarch64be-musl
            wait
            tar --zstd -C $path -cf /tmp/aarch64be-${aarch64be}.tar.zst .
            oras push --disable-path-validation "${IMAGE}:aarch64be-${aarch64be}" "/tmp/aarch64be-${aarch64be}.tar.zst:application/vnd.wyvern.aarch64be.tar.zstd" &
          fi

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: C/C++ sccache wrappers
        run: |
          set -euo pipefail

          mkdir -p "sccache-bin"

          for compiler in clang clang++ gcc g++; do
            cat > "sccache-bin/$compiler" <<EOF
          #!/bin/bash
          exec sccache /usr/bin/$compiler "\$@"
          EOF
            chmod +x "sccache-bin/$compiler"
          done

          echo "$PWD/sccache-bin" >> "$GITHUB_PATH"

      - name: Cache openwrt
        uses: actions/cache@v6
        with:
          path: /home/runner/openwrt
          key: openwrt-${{env.openwrt}}
          restore-keys: openwrt-${{env.openwrt}}

      - name: Cache hexagon
        uses: actions/cache@v6
        with:
          path: /home/runner/hexagon
          key: hexagon-${{env.hexagon}}
          restore-keys: hexagon-${{env.hexagon}}

      - name: Toolchain downloads
        run: |
          if [ ! -d /home/runner/openwrt ]; then
            mkdir -p /home/runner/openwrt
            curl -LsSf https://downloads.openwrt.org/releases/${openwrt}/targets/octeon/generic/openwrt-toolchain-${openwrt}-octeon-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst | tar --zstd -xf - -C /home/runner/openwrt &
          fi
          ln -sf /home/runner/openwrt/openwrt-toolchain-${openwrt}-octeon-generic_gcc-14.3.0_musl.Linux-x86_64/toolchain-mips64_octeonplus_64_gcc-14.3.0_musl wrt

          if [ ! -d /home/runner/hexagon ]; then
            mkdir -p /home/runner/hexagon
            curl -LsSf https://artifacts.codelinaro.org/artifactory/codelinaro-toolchain-for-hexagon/${hexagon}________/clang+llvm-${hexagon}-cross-hexagon-unknown-linux-musl.tar.zst | tar --zstd -xf - -C /home/runner/hexagon &
          fi
          ln -sf /home/runner/hexagon/clang+llvm-${hexagon}-cross-hexagon-unknown-linux-musl/x86_64-ubuntu-22.04 hexagon

      # - name: Install Nix
      #   uses: DeterminateSystems/nix-installer-action@main

      # - name: Install Nix
      #   uses: cachix/install-nix-action@31

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
            powerpc64-unknown-linux-musl
            powerpc64-unknown-linux-gnuelfv2
            )
          for target in ${targets[@]}; do
            time cargo s $target
          done
          exit
          time {
              set +x
              while [[ ! -f ~/apt.finish ]]; do
                  sleep 1
              done
          }

          targets=(
            powerpc-unknown-linux-gnu
            powerpc-unknown-linux-musl
            powerpc64le-unknown-linux-gnu
            powerpc64le-unknown-linux-musl
            powerpc64-unknown-linux-gnu
            aarch64_be-unknown-linux-gnu
            aarch64_be-unknown-linux-musl
            sparc64-unknown-linux-gnu
            sparc-unknown-linux-gnu
            mipsel-unknown-linux-musl
            mipsel-unknown-linux-gnu
            mips-unknown-linux-musl
            mips-unknown-linux-gnu
            mips-unknown-linux-uclibc
            mipsel-unknown-linux-uclibc
            # aarch64-unknown-l4re-uclibc
            # x86_64-unknown-l4re-uclibc
            hexagon-unknown-linux-musl
            mips64-openwrt-linux-musl
          )

          for target in ${targets[@]}; do
            time cargo s $target &
          done
          wait
          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  aarch64_be-unknown-linux-gnu
                  aarch64_be-unknown-linux-musl
                  hexagon-unknown-linux-musl
                  mips-unknown-linux-uclibc
                  mipsel-unknown-linux-uclibc
                  # aarch64-unknown-l4re-uclibc
                  # x86_64-unknown-l4re-uclibc
                  mipsel-unknown-linux-musl
                  mips-unknown-linux-musl
                  mipsel-unknown-linux-gnu
                  mips-unknown-linux-gnu
                  sparc64-unknown-linux-gnu
                  sparc-unknown-linux-gnu
                  powerpc64-unknown-linux-gnu
                  powerpc64-unknown-linux-gnuelfv2
                  powerpc64-unknown-linux-musl
                  powerpc64le-unknown-linux-gnu
                  powerpc64le-unknown-linux-musl
                  powerpc-unknown-linux-gnu
                  powerpc-unknown-linux-musl
                  mips64-openwrt-linux-musl
          )
          for target in "${targets[@]}"; do
            IFS='-' read -r arch vendor os abi rest <<< "$target"
            if [[ -n "$abi" ]]; then
                if [[ "$vendor" == "openwrt" ]]; then
                    name="${vendor^}-${arch}-${abi}"
                else
                    if [[ "$abi" == "ohos" ]]; then
                        name="Android-${arch}-${abi}"
                    else
                        name="${os^}-${arch}-${abi}"
                    fi
                fi
            else
                if [[ "$os" == "androideabi" ]]; then
                    name="Android-${arch}"
                else
                    name="${os^}-${arch}"
                fi
            fi

            echo "Uploading $name..."
            mv target/$target/src/{img,$name} || true
            gh release upload Nightly --clobber target/$target/src/$name || true
          done
