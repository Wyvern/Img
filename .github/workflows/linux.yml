name: Linux

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get latest nightly build ID
        id: ver
        run: |
          rust=$(curl -s https://static.rust-lang.org/dist/channel-rust-nightly.toml \
            | sed -n '/^\[pkg.rust\]/,/^\[pkg\./p' \
            | grep '^version' \
            | cut -d'"' -f2)
          echo "rust=$rust" >> $GITHUB_OUTPUT

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: ${{ runner.os }}-${{ runner.arch }}-nightly-${{ steps.ver.outputs.rust}}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nightly-

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Get latest Android NDK version
        id: ndk-ver
        run: |
          latest_ndk=$(curl -fsSL https://developer.android.com/ndk/downloads \
            | sed -n 's/.*Latest Stable Version (\([^)]*\)).*/\1/p')
          echo "NDK_VERSION=$latest_ndk" >> $GITHUB_ENV
          echo "Latest NDK: $latest_ndk"

      - name: Android NDK cache
        uses: actions/cache@v4
        with:
          path: ~/android-ndk
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Ubuntu apt update and install
        run: |
          sudo apt update -q && sudo apt install gcc-powerpc64-linux-gnu musl-tools -qy

      - name: Build Release
        run: |
          # sudo snap install zig --classic --beta
          # pipx install cargo-zigbuild

          ver=${NDK_VERSION}
          export ANDROID_NDK_HOME=~/android-ndk/android-ndk-$ver
          ln -sf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/" sysroot

          if [ ! -d ~/android-ndk ]; then
            mkdir -p ~/android-ndk
            echo "Downloading Android NDK..."
            curl -fsSLO https://dl.google.com/android/repository/android-ndk-$ver-linux.zip
            echo "Unzipping Android NDK..."
            unzip -q android-ndk-$ver-linux.zip -d ~/android-ndk
          fi

          ln -sf $(readlink sysroot)/sysroot $(readlink sysroot)/android

          # mkdir -p $(readlink sysroot)/android
          # sudo mount --bind sysroot/sysroot sysroot/android

          cargo update
          set +e -x

          targets=(
            riscv64-linux-android
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            powerpc64-unknown-linux-gnu
            ./powerpc64-unknown-linux-musl-elfv1.json
            powerpc64-unknown-linux-musl
          )

          for target in ${targets[@]}; do
            time cargo s --target $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "riscv64-linux-android Android-riscv64"
                  "aarch64-linux-android Android-aarch64"
                  "armv7-linux-androideabi Android-armv7"
                  "x86_64-linux-android Android-x86_64"
                  "powerpc64-unknown-linux-gnu Linux-powerpc64-gnu"
                  "powerpc64-unknown-linux-musl Linux-powerpc64-musl"
                  "powerpc64-unknown-linux-musl-elfv1 Linux-powerpc64-musl"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/src/Img target/$arch/src/$name || true
            gh release upload Nightly target/$arch/src/$name --clobber || true
          done
