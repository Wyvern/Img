name: Linux

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Cache openwrt
        uses: actions/cache@v5
        with:
          path: /home/runner/openwrt
          key: openwrt-25.12.3
          restore-keys: openwrt-25.12.3

      - name: Cache uclibc
        uses: actions/cache@v5
        with:
          path: /home/runner/uclibc
          key: uclibc-2025.08-1
          restore-keys: uclibc-2025.08-1

      - name: Cache hexagon
        uses: actions/cache@v5
        with:
          path: /home/runner/hexagon
          key: hexagon-22.1.4
          restore-keys: hexagon-22.1.4

      - name: Ubuntu apt update and install
        run: sudo apt install gcc-powerpc64-linux-gnu gcc-powerpc-linux-gnu gcc-mips-linux-gnu gcc-mipsel-linux-gnu musl-tools libc++1 libc++abi1 -qy

      - name: Toolchain downloads
        run: |
          ver=25.12.3
          if [ ! -d /home/runner/openwrt ]; then
            mkdir -p /home/runner/openwrt
            curl -LsSf https://downloads.openwrt.org/releases/${ver}/targets/octeon/generic/openwrt-toolchain-${ver}-octeon-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst | tar --zstd -xf - -C /home/runner/openwrt
          fi
          ln -sf /home/runner/openwrt/openwrt-toolchain-${ver}-octeon-generic_gcc-14.3.0_musl.Linux-x86_64/toolchain-mips64_octeonplus_64_gcc-14.3.0_musl wrt

          ver=2025.08-1
          if [ ! -d /home/runner/uclibc/armv7 ]; then
            mkdir -p /home/runner/uclibc/armv7
            curl -LsSf https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--uclibc--bleeding-edge-${ver}.tar.xz | tar -xJ -C /home/runner/uclibc/armv7
          fi
          ln -sf /home/runner/uclibc/armv7/armv7-eabihf--uclibc--bleeding-edge-${ver} armv7

          if [ ! -d /home/runner/uclibc/mips32el ]; then
            mkdir -p /home/runner/uclibc/mips32el
            curl -LsSf https://toolchains.bootlin.com/downloads/releases/toolchains/mips32el/tarballs/mips32el--uclibc--bleeding-edge-${ver}.tar.xz | tar -xJ -C /home/runner/uclibc/mips32el
          fi
          ln -sf /home/runner/uclibc/mips32el/mips32el--uclibc--bleeding-edge-${ver} mipsel

          if [ ! -d /home/runner/uclibc/mips32 ]; then
            mkdir -p /home/runner/uclibc/mips32
            curl -LsSf https://toolchains.bootlin.com/downloads/releases/toolchains/mips32/tarballs/mips32--uclibc--bleeding-edge-${ver}.tar.xz | tar -xJ -C /home/runner/uclibc/mips32
          fi
          ln -sf /home/runner/uclibc/mips32/mips32--uclibc--bleeding-edge-${ver} mips

          ver=22.1.4
          if [ ! -d /home/runner/hexagon ]; then
            mkdir -p /home/runner/hexagon
            curl -LsSf https://artifacts.codelinaro.org/artifactory/codelinaro-toolchain-for-hexagon/${ver}_/clang+llvm-${ver}-cross-hexagon-unknown-linux-musl.tar.zst | tar --zstd -xf - -C /home/runner/hexagon
          fi
          ln -sf /home/runner/hexagon/clang+llvm-${ver}-cross-hexagon-unknown-linux-musl/x86_64-linux-gnu hexagon

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
            powerpc-unknown-linux-gnu
            powerpc-unknown-linux-musl
            hexagon-unknown-linux-musl
            mipsel-unknown-linux-musl
            mipsel-unknown-linux-gnu
            mips-unknown-linux-musl
            mips-unknown-linux-gnu
            mips-unknown-linux-uclibc
            mipsel-unknown-linux-uclibc
            armv7-unknown-linux-uclibceabihf
            mips64-openwrt-linux-musl
            powerpc64-unknown-linux-gnu
            ./powerpc64-unknown-linux-musl-elfv1.json
          )

          for target in ${targets[@]}; do
            time cargo s $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  hexagon-unknown-linux-musl
                  mips-unknown-linux-uclibc
                  mipsel-unknown-linux-uclibc
                  mipsel-unknown-linux-musl
                  mips-unknown-linux-musl
                  mipsel-unknown-linux-gnu
                  mips-unknown-linux-gnu
                  armv7-unknown-linux-uclibceabihf
                  powerpc64-unknown-linux-gnu
                  powerpc64-unknown-linux-musl-elfv1
                  powerpc-unknown-linux-gnu
                  powerpc-unknown-linux-musl
                  mips64-openwrt-linux-musl
          )
          for target in "${targets[@]}"; do
            IFS='-' read -r arch vendor os abi rest <<< "$target"
            if [[ -n "$abi" ]]; then
                if [[ "$vendor" == "openwrt" ]]; then
                    name="${vendor^}-${arch}-${abi}"
                else
                    if [[ "$abi" == "ohos" ]]; then
                        name="Android-${arch}-${abi}"
                    else
                        name="${os^}-${arch}-${abi}"
                    fi
                fi
            else
                if [[ "$os" == "androideabi" ]]; then
                    name="Android-${arch}"
                else
                    name="${os^}-${arch}"
                fi
            fi

            echo "Uploading $name..."
            mv target/$target/src/img target/$target/src/$name || true
            gh release upload Nightly --clobber target/$target/src/$name || true
          done
