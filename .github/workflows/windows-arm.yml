name: Windows-11-Arm

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Windows-arm:
    name: Windows-11-arm
    runs-on: windows-11-vs2026-arm

    steps:
      - name: Disable and Stop windows services
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Ignore'

          $pattern = "maint|diag|exper|search|logs|assist|report|logg|defend";
          $services = Get-Service|? DisplayName -match $pattern

          $services | Set-Service -StartMode Disabled -ErrorAction SilentlyContinue
          $services | Stop-Service -Force

          $services | % {$_.DisplayName; $_.Status}

          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AdvertisingInfo" /v Enabled /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f

          Get-ScheduledTask | Disable-ScheduledTask -Confirm:$false
          Get-ScheduledTask | Unregister-ScheduledTask -Confirm:$false
          # schtasks /delete /tn * /f >NUL

      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Install MSYS2 packages
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Syu --noconfirm'
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -S --needed --noconfirm mingw-w64-i686-gcc mingw-w64-x86_64-gcc mingw-w64-x86_64-winstorecompat'
          & 'C:\msys64\usr\bin\bash.exe' -lc '
            curl -fL -o /tmp/winstorecompat.pkg.tar.zst \
              https://mirror.msys2.org/mingw/mingw32/mingw-w64-i686-winstorecompat-14.0.0.r14.g4761eabdd-1-any.pkg.tar.zst &&
            pacman -U --noconfirm /tmp/winstorecompat.pkg.tar.zst
          '

      - name: Build release
        continue-on-error: true
        run: |
          cargo update


          $ErrorActionPreference = 'Stop'

          $TargetSpec = Join-Path $env:GITHUB_WORKSPACE 'i686-uwp-windows-gnu.json'

          # Create the target specification if it does not exist.
          if (-not (Test-Path -LiteralPath $TargetSpec -PathType Leaf)) {
              $TargetJson = @'
          {
            "abi": "uwp",
            "abi-return-struct-as-int": true,
            "arch": "x86",
            "binary-format": "coff",
            "cpu": "pentium4",
            "crt-objects-fallback": "mingw",
            "data-layout": "e-m:x-p:32:32-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:32-n8:16:32-a:0:32-S32",
            "dll-prefix": "",
            "dll-suffix": ".dll",
            "dll-tls-export": false,
            "dynamic-linking": true,
            "eh-frame-header": false,
            "emit-debug-gdb-scripts": false,
            "env": "gnu",
            "exe-suffix": ".exe",
            "frame-pointer": "always",
            "function-sections": false,
            "has-thread-local": true,
            "is-like-windows": true,
            "late-link-args": {
              "gnu": [
                "-lwinstorecompat",
                "-lruntimeobject",
                "-lsynchronization",
                "-lvcruntime140_app",
                "-lucrt",
                "-lwindowsapp",
                "-lmingwex",
                "-lmingw32"
              ],
              "gnu-cc": [
                "-lwinstorecompat",
                "-lruntimeobject",
                "-lsynchronization",
                "-lvcruntime140_app",
                "-lucrt",
                "-lwindowsapp",
                "-lmingwex",
                "-lmingw32"
              ],
              "gnu-lld": [
                "-lwinstorecompat",
                "-lruntimeobject",
                "-lsynchronization",
                "-lvcruntime140_app",
                "-lucrt",
                "-lwindowsapp",
                "-lmingwex",
                "-lmingw32"
              ],
              "gnu-lld-cc": [
                "-lwinstorecompat",
                "-lruntimeobject",
                "-lsynchronization",
                "-lvcruntime140_app",
                "-lucrt",
                "-lwindowsapp",
                "-lmingwex",
                "-lmingw32"
              ]
            },
            "limit-rdylib-exports": false,
            "linker": "gcc",
            "linker-flavor": "gnu-cc",
            "llvm-target": "i686-pc-windows-gnu",
            "max-atomic-width": 64,
            "metadata": {
              "description": null,
              "host_tools": false,
              "std": null,
              "tier": 3
            },
            "os": "windows",
            "pre-link-args": {
              "gnu": [
                "--dynamicbase",
                "--disable-auto-image-base",
                "-m",
                "i386pe",
                "--large-address-aware"
              ],
              "gnu-cc": [
                "-fno-use-linker-plugin",
                "-Wl,--dynamicbase",
                "-Wl,--disable-auto-image-base",
                "-Wl,--large-address-aware"
              ],
              "gnu-lld": [
                "--dynamicbase",
                "--disable-auto-image-base",
                "-m",
                "i386pe",
                "--large-address-aware"
              ],
              "gnu-lld-cc": [
                "-fno-use-linker-plugin",
                "-Wl,--dynamicbase",
                "-Wl,--disable-auto-image-base",
                "-Wl,--large-address-aware"
              ]
            },
            "pre-link-objects-fallback": {
              "dynamic-dylib": ["dllcrt2.o"],
              "dynamic-nopic-exe": ["crt2.o"],
              "dynamic-pic-exe": ["crt2.o"],
              "static-dylib": ["dllcrt2.o"],
              "static-nopic-exe": ["crt2.o"],
              "static-pic-exe": ["crt2.o"]
            },
            "requires-uwtable": true,
            "rustc-abi": "x86-sse2",
            "target-family": ["windows"],
            "target-mcount": "_mcount",
            "target-pointer-width": 32,
            "vendor": "uwp"
          }
          '@

              Set-Content -LiteralPath $TargetSpec -Value $TargetJson -Encoding utf8
              Write-Host "Created target specification: $TargetSpec"
          }

          # Load the target specification.
          $Spec = Get-Content -LiteralPath $TargetSpec -Raw |
              ConvertFrom-Json -AsHashtable

          # Append -lgcc to each linker flavor, avoiding duplicates.
          foreach ($Flavor in @('gnu', 'gnu-cc', 'gnu-lld', 'gnu-lld-cc')) {
              $Args = $Spec['late-link-args'][$Flavor]

              if ($null -eq $Args) {
                  throw "Missing late-link-args entry: $Flavor"
              }

              if ($Args -notcontains '-lgcc') {
                  $Args.Add('-lgcc')
              }
          }

          # Save the patched specification.
          $Spec |
              ConvertTo-Json -Depth 100 |
              Set-Content -LiteralPath $TargetSpec -Encoding utf8

          Write-Host "Patched target specification:"
          Write-Host $TargetSpec

          Write-Host "`nUpdated late-link-args:"
          foreach ($Flavor in @('gnu', 'gnu-cc', 'gnu-lld', 'gnu-lld-cc')) {
              Write-Host "$Flavor`: $($Spec['late-link-args'][$Flavor] -join ' ')"
          }

          # Build using the custom target JSON and your existing cargo s alias.
          cargo s $TargetSpec
          if ($LASTEXITCODE -ne 0) {
              throw "cargo s failed with exit code $LASTEXITCODE"
          }


          # cargo s i686-uwp-windows-gnu

          exit
          $targets = @(
                      "aarch64-pc-windows-msvc",
                      "aarch64-uwp-windows-msvc",
                      "arm64ec-pc-windows-msvc",
                      "x86_64-pc-windows-msvc",
                      "x86_64-uwp-windows-msvc",
                      "x86_64-win7-windows-msvc",
                      "x86_64-uwp-windows-gnu",
                      "i686-pc-windows-msvc",
                      "i686-uwp-windows-msvc",
                      "i686-win7-windows-msvc",
                      "i686-uwp-windows-gnu"
                    )
          foreach ($target in $targets) {
              Write-Host "Building: $target"
              Measure-Command { cargo s $target }
          }

          # cmd /c dir /s target\src\img.exe
          Get-ChildItem -Path target\*\src\img.exe -File
          # systeminfo

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          $targets = @(
              @("aarch64-pc-windows-msvc", "Windows-aarch64.exe"),
              @("aarch64-uwp-windows-msvc", "Windows-aarch64-uwp.exe"),
              @("x86_64-pc-windows-msvc", "Windows-x86_64.exe"),
              @("x86_64-uwp-windows-msvc", "Windows-x86_64-uwp.exe"),
              @("arm64ec-pc-windows-msvc", "Windows-arm64ec.exe"),
              @("i686-pc-windows-msvc", "Windows-i686.exe"),
              @("i686-uwp-windows-msvc", "Windows-i686-uwp.exe"),
              @("i686-win7-windows-msvc", "Windows-i686-win7.exe"),
              @("x86_64-win7-windows-msvc", "Windows-x86_64-win7.exe"),
              @("x86_64-uwp-windows-gnu","Windows-x86_64-uwp-gnu.exe"),
              @("i686-uwp-windows-gnu","Windows-i686-uwp-gnu.exe")
          )

          foreach ($target in $targets) {
              $arch = $target[0]
              $name = $target[1]
              Write-Host "Uploading $name..."
              Move-Item target/$arch/src/img.exe target/$arch/src/$name -Force; $?
              gh release upload Nightly target/$arch/src/$name --clobber; $?
          }
