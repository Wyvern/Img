      - name: Build release
        run: |
          cargo update

          $vcBin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\*\bin\HostX86\arm\link.exe" |
          Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $vcBin) { throw "MSVC ARM32 linker not found" }
          $env:PATH = "$vcBin;$env:PATH"
          "$vcBin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

          where.exe link

          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $armLib = Get-ChildItem "$sdkRoot\*\um\arm\kernel32.lib" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1

          if (-not $armLib) {
            Get-ChildItem "$sdkRoot\*\um\*\kernel32.lib" -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "Windows SDK ARM32 kernel32.lib not found"
          }

          $sdkVersion = $armLib.Directory.Parent.Name
          $env:LIB = "$($armLib.Directory.FullName);$env:LIB"
          "$($armLib.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib\*\um\arm\kernel32.lib" `
            -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          exit

          $targets = @(
                  "thumbv7a-pc-windows-msvc",
                  "thumbv7a-uwp-windows-msvc"
                    )
          foreach ($target in $targets) {
              Write-Host "Building: $target"
              Measure-Command { cargo s $target }
          }

          # cmd /c dir /s target\src\img.exe
          Get-ChildItem -Path target\*\src\img.exe -File
          systeminfo

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          $targets = @(
              @("thumbv7a-pc-windows-msvc","Windows-thumbv7a.exe"),
              @("thumbv7a-uwp-windows-msvc","Windows-thumbv7a-uwp.exe")
          )

          foreach ($target in $targets) {
              $arch = $target[0]
              $name = $target[1]
              Write-Host "Uploading $name..."
              Move-Item target/$arch/src/img.exe target/$arch/src/$name -Force; $?
              gh release upload Nightly target/$arch/src/$name --clobber; $?
          }
