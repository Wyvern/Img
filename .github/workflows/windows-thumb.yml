name: Windows-thumb

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Windows:
    name: Windows-2025
    runs-on: windows-2025

    steps:
      - name: Disable and Stop windows services
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Ignore'

          $pattern = "maint|diag|exper|search|logs|assist|report|logg|defend";
          $services = Get-Service|? DisplayName -match $pattern

          $services | Set-Service -StartMode Disabled -ErrorAction SilentlyContinue
          $services | Stop-Service -Force

          $services | % {$_.DisplayName; $_.Status}

          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AdvertisingInfo" /v Enabled /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f

          Get-ScheduledTask | Disable-ScheduledTask -Confirm:$false
          Get-ScheduledTask | Unregister-ScheduledTask -Confirm:$false
          # schtasks /delete /tn * /f >NUL

      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Install Windows ARM32 SDK libraries
        shell: pwsh
        run: |
          $version = '10.0.22621.3233'
          $root = Join-Path $env:RUNNER_TEMP 'windows-sdk-arm'
          $nupkg = Join-Path $env:RUNNER_TEMP "windows-sdk-arm.$version.zip"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.sdk.cpp.arm/$version/microsoft.windows.sdk.cpp.arm.$version.nupkg"

          Invoke-WebRequest -Uri $url -OutFile $nupkg
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Archive -Path $nupkg -DestinationPath $root -Force

          $kernel32 = Get-ChildItem $root -Filter kernel32.lib -Recurse |
            Where-Object { $_.FullName -match '\\um\\arm\\kernel32\.lib$' } |
            Select-Object -First 1

          if (-not $kernel32) {
            throw "The NuGet package did not contain ARM32 um\arm\kernel32.lib"
          }

          $sdkLibRoot = $kernel32.Directory.Parent.Parent.FullName
          $umArm = $kernel32.Directory.FullName
          $ucrtArm = Join-Path $sdkLibRoot 'ucrt\arm'

          Write-Host "ARM32 Windows SDK libraries: $sdkLibRoot"
          Write-Host "kernel32.lib: $($kernel32.FullName)"

          if (-not (Test-Path $ucrtArm)) {
            throw "ARM32 UCRT libraries not found: $ucrtArm"
          }

          $env:LIB = "$umArm;$ucrtArm;$env:LIB"
          "LIB=$env:LIB" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build release
        run: |
          cargo update

          $vcBin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\*\bin\HostX86\arm\link.exe" |
          Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $vcBin) { throw "MSVC ARM32 linker not found" }
          $env:PATH = "$vcBin;$env:PATH"
          "$vcBin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

          $msvcRoot = "${env:ProgramFiles}\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC"

          $armCrt = Get-ChildItem "$msvcRoot\*\lib\arm\msvcrt.lib" -ErrorAction SilentlyContinue |
              Sort-Object { [version]$_.Directory.Parent.Parent.Name } -Descending |
              Select-Object -First 1

          if (-not $armCrt) {
              throw "MSVC ARM32 CRT libraries not found"
          }

          $armLib = $armCrt.Directory.FullName
          $env:LIB = "$armLib;$env:LIB"
          "LIB=$env:LIB" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Using MSVC ARM32 CRT: $($armCrt.FullName)"

          # exit

          $targets = @(
                  "thumbv7a-pc-windows-msvc",
                  "thumbv7a-uwp-windows-msvc"
                    )
          foreach ($target in $targets) {
              Write-Host "Building: $target"
              Measure-Command { cargo s $target }
          }

          # cmd /c dir /s target\src\img.exe
          Get-ChildItem -Path target\*\src\img.exe -File
          systeminfo

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          $targets = @(
              @("thumbv7a-pc-windows-msvc","Windows-thumbv7a.exe"),
              @("thumbv7a-uwp-windows-msvc","Windows-thumbv7a-uwp.exe")
          )

          foreach ($target in $targets) {
              $arch = $target[0]
              $name = $target[1]
              Write-Host "Uploading $name..."
              Move-Item target/$arch/src/img.exe target/$arch/src/$name -Force; $?
              gh release upload Nightly target/$arch/src/$name --clobber; $?
          }
