name: Unix

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Unix
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Cache sysroot
        uses: actions/cache@v4
        with:
          path: /home/runner/unix
          key: Unix-${{ runner.os }}-${{ runner.arch }}
          restore-keys: Unix-${{ runner.os }}-${{ runner.arch }}

      - name: Build Release
        run: |
          cargo update
          set +e -x

          mkdir -p /home/runner/unix;
          ln -sf /home/runner/unix sysroot

          freebsd=(amd64 arm64 riscv)
          for arch in "${freebsd[@]}"; do
            if [ ! -d sysroot/freebsd/$arch ]; then
                mkdir -p sysroot/freebsd/$arch
                curl -fsSL https://download.freebsd.org/ftp/releases/$arch/15.0-RELEASE/base.txz \
            | tar -xJf - -C sysroot/freebsd/$arch 2>/dev/null &
            fi
          done

          ppc=(powerpc64 powerpc64le)
          for arch in "${ppc[@]}"; do
            if [ ! -d sysroot/freebsd/$arch ]; then
              mkdir -p sysroot/freebsd/$arch
              curl -fsSL https://download.freebsd.org/ftp/releases/powerpc/$arch/15.0-RELEASE/base.txz \
                | tar -xJf - -C sysroot/freebsd/$arch 2>/dev/null &
            fi
          done

          openbsd=(amd64 arm64 riscv64 powerpc64)
          files=(base78 comp78)
          for arch in "${openbsd[@]}"; do
            if [ ! -d sysroot/openbsd/$arch ]; then
              mkdir -p sysroot/openbsd/$arch
              for file in "${files[@]}"; do
                curl -fsSL https://cdn.openbsd.org/pub/OpenBSD/7.8/$arch/$file.tgz | tar -xzf - -C sysroot/openbsd/$arch 2>/dev/null &
              done
            fi
          done

          netbsd=(amd64 evbarm-aarch64 sparc64)
          files=(base comp etc)
          for arch in "${netbsd[@]}"; do
            if [ ! -d sysroot/netbsd/$arch ]; then
              mkdir -p sysroot/netbsd/$arch
              for file in "${files[@]}"; do
                curl -fsSL https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/$arch/binary/sets/$file.tar.xz | tar -xJf - -C sysroot/netbsd/$arch 2>/dev/null &
              done
            fi
          done

          if [ ! -f sysroot/dfly-x86_64-6.4.2_REL.iso ]; then
            curl -fsSL https://mirror-master.dragonflybsd.org/iso-images/dfly-x86_64-6.4.2_REL.iso.bz2 | bunzip2 -c > sysroot/dfly-x86_64-6.4.2_REL.iso &
            mkdir -p sysroot/dfly
          fi

          wait
          chmod -R u+rwX sysroot

          sudo mount -o loop sysroot/dfly-x86_64-6.4.2_REL.iso sysroot/dfly

          targets=(
            sparc64-unknown-netbsd
            x86_64-unknown-dragonfly
            x86_64-unknown-freebsd
            aarch64-unknown-freebsd
            riscv64gc-unknown-freebsd
            powerpc64-unknown-freebsd
            powerpc64le-unknown-freebsd
            x86_64-unknown-openbsd
            aarch64-unknown-openbsd
            riscv64gc-unknown-openbsd
            powerpc64-unknown-openbsd
            x86_64-unknown-netbsd
            aarch64-unknown-netbsd
          )

          for target in ${targets[@]}; do
            time cargo s $target
          done

          sudo umount sysroot/dfly

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "x86_64-unknown-dragonfly DragonFly-x86_64"
                  "x86_64-unknown-freebsd FreeBSD-x86_64"
                  "aarch64-unknown-freebsd FreeBSD-aarch64"
                  "riscv64gc-unknown-freebsd FreeBSD-riscv64"
                  "powerpc64-unknown-freebsd FreeBSD-ppc64"
                  "powerpc64le-unknown-freebsd FreeBSD-ppc64le"
                  "x86_64-unknown-openbsd OpenBSD-x86_64"
                  "aarch64-unknown-openbsd OpenBSD-aarch64"
                  "riscv64gc-unknown-openbsd OpenBSD-riscv64"
                  "powerpc64-unknown-openbsd OpenBSD-ppc64"
                  "x86_64-unknown-netbsd NetBSD-x86_64"
                  "aarch64-unknown-netbsd NetBSD-aarch64"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/src/Img target/$arch/src/$name || true
            gh release upload Nightly target/$arch/src/$name --clobber || true
          done
