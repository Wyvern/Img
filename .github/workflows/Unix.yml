name: Unix

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Unix
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Set up cache directory
        run: mkdir -p $GITHUB_WORKSPACE/.cache/sysroots/freebsd \
          $GITHUB_WORKSPACE/.cache/sysroots/openbsd \
          $GITHUB_WORKSPACE/.cache/sysroots/netbsd

      - name: Cache sysroot
        uses: actions/cache@v4
        id: sysroot-cache
        with:
          path: $GITHUB_WORKSPACE/.cache/sysroots
          key: sysroot-${{ runner.os }}-${{ hashFiles('scripts/sysroot-files.txt') }}
          restore-keys: |
            sysroot-${{ runner.os }}-

      # - name: Ubuntu apt update and install
      #   run: |
      #     # wget https://apt.llvm.org/llvm-snapshot.gpg.key
      #     # sudo apt-key add llvm-snapshot.gpg.key

      #     # sudo apt-add-repository "deb http://apt.llvm.org/$(lsb_release -sc)/ llvm-toolchain-$(lsb_release -sc)-21 main"

      #     sudo apt update -q && sudo apt install xz-utils -qy

      - name: Build Release
        run: |
          cargo update
          set +e -x

          sysroots="$GITHUB_WORKSPACE/.cache/sysroots"

          freebsd=(amd64 arm64 riscv)
          for arch in "${freebsd[@]}"; do
            if [ ! -d $sysroots/freebsd/$arch ]; then
                mkdir -p $sysroots/freebsd/$arch
                curl -fsSL https://download.freebsd.org/ftp/releases/$arch/14.3-RELEASE/base.txz \
            | tar -xJf - -C $sysroots/freebsd/$arch 2>/dev/null &
            else
              echo "FreeBSD $arch already exists in $sysroots/freebsd, skipping download."
            fi
          done

          ppc=(powerpc64 powerpc64le)
          for arch in "${ppc[@]}"; do
            if [ ! -d $sysroots/freebsd/$arch ]; then
              mkdir -p $sysroots/freebsd/$arch
              curl -fsSL https://download.freebsd.org/ftp/releases/powerpc/$arch/14.3-RELEASE/base.txz \
                | tar -xJf - -C $sysroots/freebsd/$arch 2>/dev/null &
            else
              echo "FreeBSD $arch already exists in $sysroots/freebsd, skipping download."
            fi
          done

          # curl -fsSO https://mirror-master.dragonflybsd.org/iso-images/dfly-x86_64-6.4.2_REL.iso.bz2
          # bunzip2 dfly-x86_64-6.4.2_REL.iso.bz2
          # mkdir $sysroots/dfly
          # sudo mount -o loop dfly-x86_64-6.4.2_REL.iso $sysroots/dfly

          openbsd=(amd64 arm64 riscv64)
          files=(base77 comp77)
          for arch in "${openbsd[@]}"; do
            if [ ! -d $sysroots/openbsd/$arch ]; then
              mkdir -p $sysroots/openbsd/$arch
              for file in "${files[@]}"; do
                curl -fsSL https://cdn.openbsd.org/pub/OpenBSD/7.7/$arch/$file.tgz | tar -xzf - -C $sysroots/openbsd/$arch 2>/dev/null &
              done
            else
              echo "OpenBSD $arch already exists in $sysroots/openbsd, skipping download."
            fi
          done

          netbsd=(amd64 evbarm-aarch64)
          files=(base comp etc)
          for arch in "${netbsd[@]}"; do
            if [ ! -d $sysroots/netbsd/$arch ]; then
              mkdir -p $sysroots/netbsd/$arch
              for file in "${files[@]}"; do
                curl -fsSL https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/$arch/binary/sets/$file.tar.xz | tar -xJf - -C $sysroots/netbsd/$arch 2>/dev/null &
              done
            else
              echo "NetBSD $arch already exists in $sysroots/netbsd, skipping download."
            fi
          done

          wait

          targets=(
            x86_64-unknown-freebsd
            aarch64-unknown-freebsd
            riscv64gc-unknown-freebsd
            powerpc64-unknown-freebsd
            powerpc64le-unknown-freebsd
            x86_64-unknown-openbsd
            aarch64-unknown-openbsd
            riscv64gc-unknown-openbsd
            x86_64-unknown-netbsd
            aarch64-unknown-netbsd
          )

          for target in ${targets[@]}; do
            time cargo s --target $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "x86_64-unknown-freebsd FreeBSD-x86_64"
                  "aarch64-unknown-freebsd FreeBSD-aarch64"
                  "riscv64gc-unknown-freebsd FreeBSD-riscv64"
                  "powerpc64-unknown-freebsd FreeBSD-ppc64"
                  "powerpc64le-unknown-freebsd FreeBSD-ppc64le"
                  "x86_64-unknown-openbsd OpenBSD-x86_64"
                  "aarch64-unknown-openbsd OpenBSD-aarch64"
                  "riscv64gc-unknown-openbsd OpenBSD-riscv64"
                  "x86_64-unknown-netbsd NetBSD-x86_64"
                  "aarch64-unknown-netbsd NetBSD-aarch64"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/src/Img target/$arch/src/$name || true
            gh release upload Nightly target/$arch/src/$name --clobber || true
          done
