name: Redox

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Ubuntu apt update and install
        run: sudo apt install crosshurd libfuse3-dev -qy

      - name: Cache Redoxer
        uses: actions/cache@v5
        with:
          path: |
            ~/.redoxer
            ~/.cargo/bin/redoxer
          key: redoxer
          restore-keys: redoxer

      - name: Build Redox
        run: |
          cargo update
          set +e -x

          if [ ! -f ~/.cargo/bin/redoxer ]; then
            cargo install --git https://gitlab.redox-os.org/redox-os/redoxer.git --locked redoxer -q --force
          fi

          mv .cargo/config.toml .cargo/config.toml.bak
          mv .cargo/redox.toml .cargo/config.toml

          targets=(
            aarch64-unknown-redox
            riscv64gc-unknown-redox
            x86_64-unknown-redox
          )
          for target in ${targets[@]}; do
            redoxer env TARGET=$target bash -c "
                if [ ! -d ~/.redoxer/toolchain/$target ]; then
                  redoxer toolchain
                fi
                time redoxer build -- -q --profile redox -Zbuild-std=std,panic_abort -Zbuild-std-features=optimize_for_size --target $target
                "
          done

          mv .cargo/config.toml .cargo/redox.toml
          mv .cargo/config.toml.bak .cargo/config.toml

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Build Hurd+Motor+Xous
        run: |
          cargo update
          set +e -x

          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh

          time cargo s wasm32-unknown-emscripten
          tar -cJf img-wasm32-emscripten.tar.xz -C target/wasm32-unknown-emscripten/src img.wasm img.js img.html
          exit

          targets=(
            x86_64-unknown-motor
            x86_64-unknown-hurd-gnu
            riscv32imac-unknown-xous-elf
          )

          for target in ${targets[@]}; do
            time cargo s $target
          done


          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
              x86_64-unknown-redox
              aarch64-unknown-redox
              riscv64gc-unknown-redox
              x86_64-unknown-motor
              x86_64-unknown-hurd-gnu
              riscv32imac-unknown-xous-elf
          )
          for target in "${targets[@]}"; do
            IFS='-' read -r arch vendor os abi rest <<< "$target"
            if [[ -n "$abi" ]]; then
                name="${os^}-${arch}-${abi}"
            else
                name="${os^}-${arch}"
            fi

            echo "Uploading $name..."
            for d in src redox; do
                if [ -d "target/$target/$d" ]; then
                  mv target/$target/$d/img target/$target/$d/$name || true
                  gh release upload Nightly target/$target/$d/$name --clobber || true
                  break
                fi
            done
          done
