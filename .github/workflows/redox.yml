name: Redox

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"
  IMAGE: ghcr.io/${{ github.repository }}
  OCI: "1"

jobs:
  Linux:
    name: Ubuntu-26.04
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Ubuntu apt update and install
        run: sudo apt install crosshurd libfuse3-dev -qy

      - name: Cache Redoxer
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/redoxer
          key: redoxer
          restore-keys: redoxer

      - name: setup-oras
        uses: oras-project/setup-oras@v2

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Redox
        continue-on-error: true
        run: |
          cargo update
          set +e -x
          IMAGE="${IMAGE,,}"

          if [ ! -f ~/.cargo/bin/redoxer ]; then
            cargo install --git https://gitlab.redox-os.org/redox-os/redoxer.git --locked redoxer -q --force
          fi

          REDOXER_TOOLCHAIN="$HOME/.redoxer"
          mkdir -p $REDOXER_TOOLCHAIN

          if [[ "$OCI" == "1" ]]; then
            oras pull --allow-path-traversal "${IMAGE}:redoxer-toolchain" -o /tmp/
            tar --zstd -xf /tmp/redoxer-toolchain.tar.zst -C "$REDOXER_TOOLCHAIN"
          fi

          targets=(
            aarch64-unknown-redox
            riscv64gc-unknown-redox
            x86_64-unknown-redox
          )

          mv .cargo/config.toml .cargo/config.toml.bak
          mv .cargo/redox.toml .cargo/config.toml
          for target in "${targets[@]}"; do
            redoxer env TARGET="$target" REDOXER_USE_LTO=1 bash -c '
            if [ ! -d $REDOXER_TOOLCHAIN/$TARGET ]; then
              redoxer toolchain
            fi
            time redoxer build -- -q --profile src -Zbuild-std=std,panic_abort --target $target
            '
          done
          mv .cargo/config.toml .cargo/redox.toml
          mv .cargo/config.toml.bak .cargo/config.toml

          if [[ ! "$OCI" == "1" ]]; then
            tar --zstd -C "$REDOXER_TOOLCHAIN" -cf /tmp/redoxer-toolchain.tar.zst .
            oras push --disable-path-validation "${IMAGE}:redoxer-toolchain" "/tmp/redoxer-toolchain.tar.zst:application/vnd.wyvern.redoxer-toolchain.tar.zstd"
          fi

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Emscripten Cache
        uses: actions/cache@v6
        with:
          path: emsdk/
          key: emscripten
          restore-keys: emscripten

      - name: Build Hurd+Motor+Xous+Emscripten
        run: |
          cargo update
          set +e -x

          if [ ! -d emsdk ]; then
            git clone --depth 1 --single-branch https://github.com/emscripten-core/emsdk.git
            ./emsdk/emsdk install latest
            ./emsdk/emsdk activate latest
          fi
          source ./emsdk/emsdk_env.sh > /dev/null

          targets=(
            wasm32-unknown-emscripten
            x86_64-unknown-motor
            x86_64-unknown-hurd-gnu
            riscv32imac-unknown-xous-elf
          )

          for target in ${targets[@]}; do
            time cargo s $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
              x86_64-unknown-redox
              aarch64-unknown-redox
              riscv64gc-unknown-redox
              x86_64-unknown-motor
              x86_64-unknown-hurd-gnu
              riscv32imac-unknown-xous-elf
          )
          for target in "${targets[@]}"; do
            IFS='-' read -r arch vendor os abi rest <<< "$target"
            if [[ -n "$abi" ]]; then
                name="${os^}-${arch}-${abi}"
            else
                name="${os^}-${arch}"
            fi

            echo "Uploading $name..."
            for d in src redox; do
                if [ -d "target/$target/$d" ]; then
                  mv target/$target/$d/{img,$name}|| true
                  gh release upload Nightly target/$target/$d/$name --clobber || true
                  break
                fi
            done
          done

          echo "Uploading wasm32-emscripten..."
          tar -cJf wasm32-emscripten.tar.xz -C target/wasm32-unknown-emscripten/src img.wasm img.js
          gh release upload Nightly wasm32-emscripten.tar.xz --clobber
