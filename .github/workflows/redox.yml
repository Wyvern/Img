name: Redox

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"
  IMAGE: ghcr.io/${{ github.repository }}


jobs:
  Linux:
    name: Ubuntu-26.04
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: setup-oras
        uses: oras-project/setup-oras@v2

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Hurd-i686 cache
        run: |
          IMAGE="${IMAGE,,}"

          if docker manifest inspect "$IMAGE:haiku-cross" &>/dev/null; then
            docker pull "$IMAGE:haiku-cross" &>/dev/null &
          else
            mkdir hurd
            cd hurd

            cat > Dockerfile <<'EOF'
          FROM ubuntu:24.04

          ENV DEBIAN_FRONTEND=noninteractive
          ENV PATH="/cross-tools-i686/bin:${PATH}"

          RUN apt-get update && apt-get install -y --no-install-recommends \
              git sudo ca-certificates curl wget \
              build-essential make gcc g++ perl \
              texinfo autopoint pkg-config libtool \
              autotools-dev automake autoconf gettext \
              libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev \
              flex bison gawk m4 patch xz-utils bzip2 \
              file python3 \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /src/cross-hurd

          RUN git clone --depth=1 https://github.com/flavioc/cross-hurd.git . \
              && sed -i 's|^ZLIB_VERSION=1\.3\.1$|ZLIB_VERSION=1.3.2|' package-versions.sh \
              && sed -i 's|^ZLIB_URL=.*|ZLIB_URL=https:\/\/zlib.net\/fossils\/"$ZLIB_PKG"|' download-funcs.sh \
              && sed -i 's|^MAKE_URL=\$GNU_REPO/"\$MAKE_PKG"|MAKE_URL=$GNU_REPO/make/"$MAKE_PKG"|' download-funcs.sh \
              && sed -i '/apply_patch .*submitted-AF_LINK\.diff 1/c\    sed -i -e "s|^[[:space:]]*#define[[:space:]]*PF_LINK[[:space:]]*18.*|/* #define PF_LINK 18 Link layer interface. */|" -e "s|^[[:space:]]*#define[[:space:]]*AF_LINK[[:space:]]*PF_LINK|/* #define AF_LINK PF_LINK */|" sysdeps/mach/hurd/bits/socket.h &&' download-funcs.sh \
              && sed -i 's|^DMIDECODE_URL=http://|DMIDECODE_URL=https://|' download-funcs.sh \
              && sed -i 's|download\.savannah\.gnu\.org/releases/dmidecode/|download-mirror.savannah.gnu.org/releases/dmidecode/|' download-funcs.sh \
              && CPU=i686 bash -x download.sh \
              && CPU=i686 bash -x bootstrap.sh \
              && rm -rf /src/cross-hurd/src \
                        /src/cross-hurd/build-i686 \
                        /root/.cache/cross-hurd \
              && test -x /cross-tools-i686/bin/i686-gnu-gcc \
              && /cross-tools-i686/bin/i686-gnu-gcc -dumpmachine

          ENTRYPOINT ["/cross-tools-i686/bin/i686-gnu-gcc"]
          EOF

            docker build --platform linux/amd64 \
                --provenance=false \
                --load \
                --progress=quiet \
                -t ghcr.io/wyvern/img:hurd-i686 .

            docker push ghcr.io/wyvern/img:hurd-i686 &
          fi

      - name: Emscripten Cache
        run: |
          IMAGE="${IMAGE,,}"

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:emscripten"); then
            mkdir -p emsdk
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "emsdk" && touch ~/ems.finish &
          else
            git clone --depth 1 --single-branch https://github.com/emscripten-core/emsdk.git
            ./emsdk/emsdk install latest &>/dev/null
            ./emsdk/emsdk activate latest &>/dev/null
            touch ~/ems.finish
            tar --zstd -C emsdk/ -cf /tmp/emscripten.tar.zst .
            oras push --disable-path-validation "${IMAGE}:emscripten" "/tmp/emscripten.tar.zst:application/vnd.wyvern.emscripten.tar.zstd" &
          fi

      - name: Redox Cache
        run: |
          IMAGE="${IMAGE,,}"

          targets=(
            aarch64-unknown-redox
            riscv64gc-unknown-redox
            x86_64-unknown-redox
            i586-unknown-redox
          )

          mkdir -p "redox"

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:redox"); then
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "redox" && touch ~/redox.finish &
          else
            file=relibc-install.tar.gz
            url="https://static.redox-os.org/toolchain/x86_64-unknown-linux-gnu"
            for target in "${targets[@]}"; do
              mkdir -p "redox/$target"
              curl -fsSL "$url/$target/$file" | tar -xz -C "redox/$target" &
            done
            wait
            touch ~/redox.finish
            tar --zstd -C "redox/" -cf /tmp/redox.tar.zst .
            oras push --disable-path-validation "${IMAGE}:redox" "/tmp/redox.tar.zst:application/vnd.wyvern.redox.tar.zstd" &
          fi

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: C/C++ sccache wrappers
        run: |
          set -euo pipefail

          mkdir -p "sccache-bin"

          for compiler in clang clang++ gcc g++; do
            cat > "sccache-bin/$compiler" <<EOF
          #!/bin/bash
          exec sccache /usr/bin/$compiler "\$@"
          EOF
            chmod +x "sccache-bin/$compiler"
          done

          echo "$PWD/sccache-bin" >> "$GITHUB_PATH"

      - name: Build Release
        continue-on-error: true
        run: |
          cargo update
          set +e -x

          source ./emsdk/emsdk_env.sh &>/dev/null

          cat > i686-gnu-gcc <<'EOF'
          #!/bin/sh
          exec docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            ghcr.io/wyvern/img:hurd-i686 \
            "$@"
          EOF
          chmod +x i686-gnu-gcc
          time cargo s i686-unknown-hurd-gnu
          exit
          targets=(
            x86_64-unknown-motor
            riscv32imac-unknown-xous-elf
            x86_64-unknown-hurd-gnu
            i686-unknown-hurd-gnu
          )
          for target in ${targets[@]}; do
            time cargo s $target
          done

          (
            time {
              set +x
              while [[ ! -f ~/ems.finish ]]; do
                  sleep 1
              done
            }
            time cargo s wasm32-unknown-emscripten
          ) &

          time {
            set +x
            while [[ ! -f ~/redox.finish ]]; do
                sleep 1
            done
          }

          targets=(
              aarch64-unknown-redox
              riscv64gc-unknown-redox
              x86_64-unknown-redox
              i586-unknown-redox
          )

          for target in "${targets[@]}"; do
              time cargo s "$target" &
          done

          wait

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
              i586-unknown-redox
              x86_64-unknown-redox
              aarch64-unknown-redox
              riscv64gc-unknown-redox
              x86_64-unknown-motor
              x86_64-unknown-hurd-gnu
              i686-unknown-hurd-gnu
              riscv32imac-unknown-xous-elf
          )
          for target in "${targets[@]}"; do
            IFS='-' read -r arch vendor os abi rest <<< "$target"
            if [[ -n "$abi" ]]; then
                name="${os^}-${arch}-${abi}"
            else
                name="${os^}-${arch}"
            fi

            echo "Uploading $name..."
            for d in src redox; do
                if [ -d "target/$target/$d" ]; then
                  mv target/$target/$d/{img,$name}|| true
                  gh release upload Nightly target/$target/$d/$name --clobber || true
                  break
                fi
            done
          done

          echo "Uploading Wasm32-emscripten..."
          tar -cJf Wasm32-emscripten.tar.xz -C target/wasm32-unknown-emscripten/src img.wasm img.js
          gh release upload Nightly Wasm32-emscripten.tar.xz --clobber
