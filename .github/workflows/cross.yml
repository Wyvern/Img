name: BSD Unix

on:
  push:
    branches: ["stable"]
  pull_request:
    branches: ["stable"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Illumos:
    name: Solaris/Illumos
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-illumos,x86_64-pc-solaris,sparcv9-sun-solaris,aarch64-unknown-fuchsia,x86_64-unknown-fuchsia

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Cross-rs
        run: |
          # cargo install cross --git https://github.com/cross-rs/cross --branch main -q
          if [ ! -f ~/.cargo/bin/cross ]; then
            wget -qO- https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz | tar -xz
            sudo mv cross ~/.cargo/bin/
          fi
          cross --version

      - name: Cache Fuchsia
        uses: actions/cache@v5
        with:
          path: /home/runner/Fuchsia
          key: Fuchsia
          restore-keys: Fuchsia

      - name: Install LLVM
        run: |
          sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" -- 22
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 200
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-22 200

      - name: Build Release
        continue-on-error: true
        run: |
          cargo update
          set +e -x

          if [ ! -d /home/runner/Fuchsia ]; then
            curl -LsSf 'https://chrome-infra-packages.appspot.com/client?platform=linux-amd64&version=latest' -o cipd
            chmod +x cipd
            sudo mv cipd /usr/local/bin/
            mkdir -p /home/runner/Fuchsia
            cipd install fuchsia/sdk/core/linux-amd64 latest -root /home/runner/Fuchsia
          fi

          ln -sf /home/runner/Fuchsia fuchsia

          targets=(
            aarch64-unknown-fuchsia
            x86_64-unknown-fuchsia
          )
          for target in ${targets[@]}; do
            time cargo l $target
          done

          targets=(
            x86_64-unknown-illumos
            x86_64-pc-solaris
            sparcv9-sun-solaris
          )
          for target in ${targets[@]}; do
            export CROSS_IMAGE=ghcr.io/cross-rs/${target}:main
            time cross build -q --profile lto --target $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: Illumos-Fuchsia
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "x86_64-unknown-illumos Illumos-x86_64"
                  "x86_64-pc-solaris Solaris-x86_64"
                  "sparcv9-sun-solaris Solaris-sparcv9"
                  "aarch64-unknown-fuchsia Fuchsia-aarch64"
                  "x86_64-unknown-fuchsia Fuchsia-x86_64"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/lto/img target/$arch/lto/$name || true
            gh release upload Stable target/$arch/lto/$name --clobber || true
          done

  Unix:
    name: BSD Unix
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd,x86_64-unknown-netbsd

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Cache sysroot
        uses: actions/cache@v5
        with:
          path: /home/runner/unix
          key: Unix
          restore-keys: Unix

      - name: Install LLVM
        run: |
          sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" -- 22
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 200
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-22 200

      - name: Build Release
        run: |
          cargo update
          set +e -x

          mkdir -p /home/runner/unix;
          ln -sf /home/runner/unix sysroot

          freebsd=(amd64)
          for arch in "${freebsd[@]}"; do
            if [ ! -d sysroot/freebsd/$arch ]; then
                mkdir -p sysroot/freebsd/$arch
                curl -fsSL https://download.freebsd.org/ftp/releases/$arch/15.0-RELEASE/base.txz \
            | tar -xJf - -C sysroot/freebsd/$arch 2>/dev/null &
            fi
          done

          # ppc=(powerpc64 powerpc64le)
          # for arch in "${ppc[@]}"; do
          #   if [ ! -d sysroot/freebsd/$arch ]; then
          #     mkdir -p sysroot/freebsd/$arch
          #     curl -fsSL https://download.freebsd.org/ftp/releases/powerpc/$arch/15.0-RELEASE/base.txz \
          #       | tar -xJf - -C sysroot/freebsd/$arch 2>/dev/null &
          #   fi
          # done

          # openbsd=(amd64)
          # files=(base77 comp77)
          # for arch in "${openbsd[@]}"; do
          #   if [ ! -d sysroot/openbsd/$arch ]; then
          #     mkdir -p sysroot/openbsd/$arch
          #     for file in "${files[@]}"; do
          #       curl -fsSL https://cdn.openbsd.org/pub/OpenBSD/7.7/$arch/$file.tgz | tar -xzf - -C sysroot/openbsd/$arch 2>/dev/null &
          #     done
          #   fi
          # done

          netbsd=(amd64)
          files=(base comp etc)
          for arch in "${netbsd[@]}"; do
            if [ ! -d sysroot/netbsd/$arch ]; then
              mkdir -p sysroot/netbsd/$arch
              for file in "${files[@]}"; do
                curl -fsSL https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/$arch/binary/sets/$file.tar.xz | tar -xJf - -C sysroot/netbsd/$arch 2>/dev/null &
              done
            fi
          done

          wait
          chmod -R u+rwX sysroot

          targets=(
            x86_64-unknown-freebsd
            x86_64-unknown-netbsd
          )

          for target in ${targets[@]}; do
            time cargo l $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: Unix-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "x86_64-unknown-freebsd FreeBSD-x86_64"
                  "x86_64-unknown-netbsd NetBSD-x86_64"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/lto/img target/$arch/lto/$name || true
            gh release upload Stable target/$arch/lto/$name --clobber || true
          done
