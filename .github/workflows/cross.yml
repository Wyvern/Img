name: BSD Unix

on:
  push:
    branches: ["stable"]
  pull_request:
    branches: ["stable"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Illumos:
    name: Solaris/Illumos
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-illumos,x86_64-pc-solaris,sparcv9-sun-solaris

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Cross-rs
        run: |
          wget https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf cross-x86_64-unknown-linux-gnu.tar.gz
          sudo mv cross /usr/local/bin/

      - name: Build Release
        continue-on-error: true
        run: |
          cargo update
          set +e -x
          targets=(
            x86_64-unknown-illumos
            x86_64-pc-solaris
            sparcv9-sun-solaris
          )
          for target in ${targets[@]}; do
            time cross build -q --config 'build.rustc-wrapper=""' --profile lto --target $target
          done
          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m
      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "x86_64-unknown-illumos Illumos-x86_64"
                  "x86_64-pc-solaris Solaris-x86_64"
                  "sparcv9-sun-solaris Solaris-sparcv9"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/lto/Img target/$arch/lto/$name || true
            gh release upload Stable target/$arch/lto/$name --clobber || true
          done

  Unix:
    name: BSD Unix
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd,x86_64-unknown-netbsd

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Cache sysroot
        uses: actions/cache@v4
        with:
          path: /home/runner/sysroots
          key: BSD-${{ runner.os }}-${{ hashFiles('scripts/sysroot-files.txt') }}
          restore-keys: BSD-${{ runner.os }}-

      - name: Build Release
        run: |
          cargo update
          set +e -x

          SYSROOT="/home/runner/sysroots"
          ln -sfn "$SYSROOT" sysroot

          freebsd=(amd64)
          for arch in "${freebsd[@]}"; do
            if [ ! -d $SYSROOT/freebsd/$arch ]; then
                mkdir -p $SYSROOT/freebsd/$arch
                curl -fsSL https://download.freebsd.org/ftp/releases/$arch/14.3-RELEASE/base.txz \
            | tar -xJf - -C $SYSROOT/freebsd/$arch 2>/dev/null &
            fi
          done

          # ppc=(powerpc64 powerpc64le)
          # for arch in "${ppc[@]}"; do
          #   if [ ! -d $SYSROOT/freebsd/$arch ]; then
          #     mkdir -p $SYSROOT/freebsd/$arch
          #     curl -fsSL https://download.freebsd.org/ftp/releases/powerpc/$arch/14.3-RELEASE/base.txz \
          #       | tar -xJf - -C $SYSROOT/freebsd/$arch 2>/dev/null &
          #   fi
          # done

          # openbsd=(amd64)
          # files=(base77 comp77)
          # for arch in "${openbsd[@]}"; do
          #   if [ ! -d $SYSROOT/openbsd/$arch ]; then
          #     mkdir -p $SYSROOT/openbsd/$arch
          #     for file in "${files[@]}"; do
          #       curl -fsSL https://cdn.openbsd.org/pub/OpenBSD/7.7/$arch/$file.tgz | tar -xzf - -C $SYSROOT/openbsd/$arch 2>/dev/null &
          #     done
          #   fi
          # done

          netbsd=(amd64)
          files=(base comp etc)
          for arch in "${netbsd[@]}"; do
            if [ ! -d $SYSROOT/netbsd/$arch ]; then
              mkdir -p $SYSROOT/netbsd/$arch
              for file in "${files[@]}"; do
                curl -fsSL https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/$arch/binary/sets/$file.tar.xz | tar -xJf - -C $SYSROOT/netbsd/$arch 2>/dev/null &
              done
            fi
          done

          wait
          chmod -R u+rwX "$SYSROOT"

          targets=(
            x86_64-unknown-freebsd
            x86_64-unknown-netbsd
          )

          for target in ${targets[@]}; do
            time cargo l $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "x86_64-unknown-freebsd FreeBSD-x86_64"
                  "x86_64-unknown-netbsd NetBSD-x86_64"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/lto/Img target/$arch/lto/$name || true
            gh release upload Stable target/$arch/lto/$name --clobber || true
          done
