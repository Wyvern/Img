name: BSD Unix

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Building for {Free,Open,Net}BSD and Solaris/Illumos.
    runs-on: ubuntu-24.04

    steps:
      - name: Purge Ubuntu
        run: |
          sudo apt purge ufw rsyslog logrotate sysstat python3-problem-report sosreport apport
          sudo apt autoremove && sudo apt clean
          sudo systemctl disable --now systemd-journald.socket systemd-journald-dev-log.socket systemd-journald

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Cross-rs
        run: cargo install cross --git https://github.com/cross-rs/cross --branch main

      - name: Build Release
        run: |
          cargo update

          function cb() {
            local target="$1"
            time cross build -q --config 'build.rustc-wrapper=""' --profile src -Zbuild-std=std,proc_macro,panic_abort -Zbuild-std-features=panic_immediate_abort --target $target
          }

          set +e -x

          cb x86_64-unknown-freebsd
          cb x86_64-unknown-netbsd
          # cb x86_64-unknown-dragonfly
          # cb powerpc64-ibm-aix

          cb x86_64-unknown-illumos
          # cb aarch64-unknown-illumos

          cb x86_64-pc-solaris
          cb sparcv9-sun-solaris

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Upload Solaris-x86_64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-pc-solaris/src/Img
          asset_name: Solaris-x86_64
          tag: Nightly
          overwrite: true
          body: "Ubuntu Solaris-x86_64 binary executable."

      - name: Upload Solaris-sparcv9 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/sparcv9-sun-solaris/src/Img
          asset_name: Solaris-sparcv9
          tag: Nightly
          overwrite: true
          body: "Ubuntu Solaris-sparcv9 binary executable."

      - name: Upload Illumos-x86_64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-unknown-illumos/src/Img
          asset_name: Illumos-x86_64
          tag: Nightly
          overwrite: true
          body: "Ubuntu Illumos-x86_64 binary executable."

      - name: Upload Illumos-aarch64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-unknown-illumos/src/Img
          asset_name: Illumos-aarch64
          tag: Nightly
          overwrite: true
          body: "Ubuntu Illumos-aarch64 binary executable."

      - name: Upload Freebsd-x86_64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-unknown-freebsd/src/Img
          asset_name: Freebsd-x86_64
          tag: Nightly
          overwrite: true
          body: "Ubuntu Freebsd-x86_64 binary executable."

      - name: Upload Netbsd-x86_64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-unknown-netbsd/src/Img
          asset_name: Netbsd-x86_64
          tag: Nightly
          overwrite: true
          body: "Ubuntu Netbsd-x86_64 binary executable."

      - name: Upload Dragonfly-x86_64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-unknown-dragonfly/src/Img
          asset_name: Dragonfly-x86_64
          tag: Nightly
          overwrite: true
          body: "Ubuntu Dragonfly-x86_64 binary executable."
