name: BSD Unix

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Building for {Free,Open,Net}BSD and Solaris/Illumos.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - {
              arch: "x86_64-unknown-freebsd",
              name: "Freebsd-x86_64",
              desc: "Freebsd x86_64",
            }
          - {
              arch: "x86_64-unknown-netbsd",
              name: "Netbsd-x86_64",
              desc: "Netbsd x86_64",
            }
          - {
              arch: "x86_64-unknown-illumos",
              name: "Illumos-x86_64",
              desc: "Illumos x86_64",
            }
          - {
              arch: "x86_64-pc-solaris",
              name: "Solaris-x86_64",
              desc: "Solaris x86_64",
            }
          - {
              arch: "sparcv9-sun-solaris",
              name: "Solaris-sparcv9",
              desc: "Solaris sparcv9",
            }
    steps:
      - name: Purge Ubuntu
        run: |
          sudo apt purge -y ufw rsyslog logrotate sysstat python3-problem-report sosreport apport
          sudo apt autoremove -y && sudo apt clean
          sudo systemctl disable --now systemd-journald

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Cross-rs
        run: cargo install cross --git https://github.com/cross-rs/cross --branch main

      - name: Build Release
        run: |
          cargo update
          set +e -x

          # x86_64-unknown-dragonfly,
          # powerpc64-ibm-aix,
          # aarch64-unknown-illumos,

          targets=(
            x86_64-unknown-freebsd,
            x86_64-unknown-netbsd,
            x86_64-unknown-illumos,
            x86_64-pc-solaris,
            sparcv9-sun-solaris,
          )

          for target in "${targets[@]}"; do
            echo "Building for target: $target"
            time cross build -q --config 'build.rustc-wrapper=""' --profile src -Zbuild-std=std,proc_macro,panic_abort -Zbuild-std-features=panic_immediate_abort,optimize_for_size --target $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Upload ${{ matrix.target.name }} to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target.arch }}/src/Img
          asset_name: ${{ matrix.target.name }}
          tag: Nightly
          overwrite: true
          body: ${{ matrix.target.desc }} binary executable.
