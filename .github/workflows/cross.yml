name: BSD Unix

on:
  push:
    branches: ["stable"]
  pull_request:
    branches: ["stable"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"
  LLVM : "23"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  Illumos:
    name: Solaris/Illumos
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM
        run: |
          (if [ "$LLVM" = "23" ]; then
              wget https://apt.llvm.org/llvm.sh &>/dev/null
              chmod +x llvm.sh
              sudo ./llvm.sh $LLVM &>/dev/null
          fi
          for x in clang clang++ lld; do
            sudo update-alternatives --install "/usr/bin/$x" "$x" "/usr/bin/$x-$LLVM" 200
          done
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/lld-$LLVM 200
          touch ~/llvm.finish)&

      - name: setup-oras
        uses: oras-project/setup-oras@v2

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Fuchsia Cache
        run: |
          IMAGE="${IMAGE,,}"

          mkdir -p /home/runner/Fuchsia;
          ln -sf /home/runner/Fuchsia fuchsia

          if [ "$OCI" == "true" ]; then
            digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:fuchsia");
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "/home/runner/Fuchsia" && touch ~/.finish &
          else
            curl -LsSf 'https://chrome-infra-packages.appspot.com/client?platform=linux-amd64&version=latest' -o cipd
            chmod +x cipd
            sudo mv cipd /usr/local/bin/
            mkdir -p /home/runner/Fuchsia
            cipd install fuchsia/sdk/core/linux-amd64 latest -root /home/runner/Fuchsia
            tar --zstd -C /home/runner/Fuchsia -cf /tmp/Fuchsia.tar.zst .
            oras push --disable-path-validation "${IMAGE}:fuchsia" "/tmp/Fuchsia.tar.zst:application/vnd.wyvern.fuchsia.tar.zstd" &
          fi

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-illumos,x86_64-pc-solaris,sparcv9-sun-solaris,aarch64-unknown-fuchsia,x86_64-unknown-fuchsia

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Cross-rs
        run: |
          # cargo install cross --git https://github.com/cross-rs/cross --branch main -q
          if [ ! -f ~/.cargo/bin/cross ]; then
            wget -qO- https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz | tar -xz
            sudo mv cross ~/.cargo/bin/
          fi
          cross --version

      - name: Build Release
        continue-on-error: true
        run: |
          cargo update
          set +e -x

          targets=(
            x86_64-unknown-illumos
            x86_64-pc-solaris
            sparcv9-sun-solaris
          )
          for target in ${targets[@]}; do
            export CROSS_IMAGE=ghcr.io/cross-rs/${target}:main
            time cross build -q --profile lto --target $target
          done

          time (
              set +x
              while [[ ! -f ~/.finish || ! -f ~/llvm.finish ]]; do
                  sleep 1
              done
          )

          targets=(
            aarch64-unknown-fuchsia
            x86_64-unknown-fuchsia
          )
          for target in ${targets[@]}; do
            time cargo l $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: Illumos-Fuchsia
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "x86_64-unknown-illumos Illumos-x86_64"
                  "x86_64-pc-solaris Solaris-x86_64"
                  "sparcv9-sun-solaris Solaris-sparcv9"
                  "aarch64-unknown-fuchsia Fuchsia-aarch64"
                  "x86_64-unknown-fuchsia Fuchsia-x86_64"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/lto/img target/$arch/lto/$name || true
            gh release upload Stable target/$arch/lto/$name --clobber || true
          done

  Unix:
    name: BSD Unix
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM
        run: |
          (if [ "$LLVM" = "23" ]; then
              wget https://apt.llvm.org/llvm.sh &>/dev/null
              chmod +x llvm.sh
              sudo ./llvm.sh $LLVM &>/dev/null
          fi
          for x in clang clang++ lld; do
            sudo update-alternatives --install "/usr/bin/$x" "$x" "/usr/bin/$x-$LLVM" 200
          done
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/lld-$LLVM 200
          touch ~/llvm.finish)&

      - name: setup-oras
        uses: oras-project/setup-oras@v2

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Unix sysroot cache
        run: |
            IMAGE="${IMAGE,,}"

            mkdir -p /home/runner/unix;
            ln -sf /home/runner/unix sysroot

            if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:unix"); then
              oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "/home/runner/unix" && touch ~/unix.sysroot &
              # oras pull --allow-path-traversal "${IMAGE}:unix" -o /tmp/
              # tar --zstd -xf /tmp/unix.tar.zst -C /home/runner/unix
            else
              freebsd=(amd64 arm64 riscv)
              for arch in "${freebsd[@]}"; do
                if [ ! -d sysroot/freebsd/$arch ]; then
                    mkdir -p sysroot/freebsd/$arch
                    curl -fsSL https://download.freebsd.org/ftp/releases/$arch/${FREEBSD}-RELEASE/base.txz \
                | tar -xJf - -C sysroot/freebsd/$arch &>/dev/null &
                fi
              done

              if [ ! -d sysroot/freebsd/powerpc ]; then
                mkdir -p sysroot/freebsd/powerpc
                curl -fsSL https://download.freebsd.org/releases/powerpc/powerpc/14.5-RELEASE/base.txz | tar -xJf - -C sysroot/freebsd/powerpc &>/dev/null &
              fi

              ppc=(powerpc64 powerpc64le)
              for arch in "${ppc[@]}"; do
                if [ ! -d sysroot/freebsd/$arch ]; then
                  mkdir -p sysroot/freebsd/$arch
                  curl -fsSL https://download.freebsd.org/ftp/releases/powerpc/$arch/${FREEBSD}-RELEASE/base.txz \
                    | tar -xJf - -C sysroot/freebsd/$arch &>/dev/null &
                fi
              done

              openbsd=(amd64 arm64 riscv64 powerpc64)
              files=(base79 comp79)
              for arch in "${openbsd[@]}"; do
                if [ ! -d sysroot/openbsd/$arch ]; then
                  mkdir -p sysroot/openbsd/$arch
                  for file in "${files[@]}"; do
                    curl -fsSL https://cdn.openbsd.org/pub/OpenBSD/$OPENBSD/$arch/$file.tgz | tar -xzf - -C sysroot/openbsd/$arch &>/dev/null &
                  done
                fi
              done

              netbsd=(amd64 evbarm-aarch64 evbarm-aarch64eb riscv-riscv64)
              files=(base comp etc)
              for arch in "${netbsd[@]}"; do
                if [ ! -d sysroot/netbsd/$arch ]; then
                  mkdir -p sysroot/netbsd/$arch
                  for file in "${files[@]}"; do
                    for ext in tar.xz tgz; do
                            url="https://cdn.netbsd.org/pub/NetBSD/NetBSD-${NETBSD}/$arch/binary/sets/$file.$ext"
                            out="sysroot/netbsd/$arch"
                            if curl -fsSI "$url" &>/dev/null; then
                                echo "→ Fetching $file.$ext"
                                if [ "$ext" = "tar.xz" ]; then
                                    curl -fsSL "$url" | tar -xJf - -C "$out" &>/dev/null &
                                else
                                    curl -fsSL "$url" | tar -xzf - -C "$out" &>/dev/null &
                                fi
                            fi
                        done
                  done
                fi
              done

              if [ ! -f sysroot/dfly-x86_64-6.4.2_REL.iso ]; then
                curl -fsSL https://mirror-master.dragonflybsd.org/iso-images/dfly-x86_64-6.4.2_REL.iso.bz2 | bunzip2 -c > sysroot/dfly-x86_64-6.4.2_REL.iso &
                mkdir -p sysroot/dfly
              fi

              wait
              chmod -R u+rwX sysroot

              tar --zstd -C /home/runner/unix -cf /tmp/unix.tar.zst .
              oras push --disable-path-validation "${IMAGE}:unix" "/tmp/unix.tar.zst:application/vnd.wyvern.sysroot.tar.zstd" &
            fi

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd,x86_64-unknown-netbsd

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Build Release
        run: |
          cargo update
          set +e -x

          time (
              set +x
              while [[ ! -f ~/unix.sysroot || ! -f ~/llvm.finish ]]; do
                  sleep 1
              done
          )

          targets=(
            x86_64-unknown-freebsd
            aarch64-unknown-freebsd
            x86_64-unknown-netbsd
          )

          for target in ${targets[@]}; do
            time cargo l $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: Unix-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "x86_64-unknown-freebsd FreeBSD-x86_64"
                  "aarch64-unknown-freebsd FreeBSD-aarch64"
                  "x86_64-unknown-netbsd NetBSD-x86_64"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/lto/img target/$arch/lto/$name || true
            gh release upload Stable target/$arch/lto/$name --clobber || true
          done
