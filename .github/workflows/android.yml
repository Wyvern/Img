name: Android

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Android:
    name: Building on macOS
    runs-on: macos-14
    strategy:
      matrix:
        target:
          - {
              arch: "x86_64-linux-android",
              name: "Android-x86_64h",
              desc: "Android x86-64h",
            }
          - {
              arch: "aarch64-linux-android",
              name: "Android-aarch64",
              desc: "Android aarch64",
            }
          - {
              arch: "armv7-linux-androideabi",
              name: "Android-armv7",
              desc: "Android armv7",
            }

    steps:
      - name: Disable macos spotlight index
        run: |
          sudo mdutil -a -i off
          sudo mdutil -a -d
          sudo pmset -a powernap 0
          sudo pmset -a sleep 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Install cargo-ndk
        run: |
          # curl https://raw.githubusercontent.com/Wyvern/Rust/main/config.toml -o ~/.cargo/config.toml;
          cargo install --git https://github.com/bbqsrc/cargo-ndk cargo-ndk --branch main

      - name: Android NDK setup
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          link-to-sdk: true
          local-cache: true

      - name: Build Release
        run: |
          # brew install cargo-zigbuild

          cargo update

          # time cargo z riscv64-linux-android

          set +e -x

          time cargo ndk -t x86_64-linux-android -t aarch64-linux-android -t armv7-linux-androideabi b --profile src -Zbuild-std=std,proc_macro,panic_abort -Zbuild-std-features=panic_immediate_abort,optimize_for_size -q

          find ./target -iname img -type f | xargs ls -hl
          sw_vers
          hostinfo
          sysctl -a | grep brand

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload ${{ matrix.target.name }} to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target.arch }}/src/Img
          asset_name: ${{ matrix.target.name }}
          tag: Nightly
          overwrite: true
          body: ${{ matrix.target.desc }} binary executable.
