name: Android

on:
  push:
    branches: ["devx"]
  pull_request:
    branches: ["devx"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Android:
    name: Android
    runs-on: macos-15

    steps:
      - name: Disable macos spotlight index
        run: |
          sudo mdutil -a -i off
          sudo mdutil -a -d
          sudo pmset -a powernap 0
          sudo pmset -a sleep 0

      - name: Checkout
        uses: actions/checkout@v5

      - name: Get latest nightly date
        id: date
        run: |
          date=$(curl -s https://static.rust-lang.org/dist/channel-rust-nightly.toml | grep 'date =' | head -n1 | cut -d'"' -f2)
          echo "date=$date" >> $GITHUB_OUTPUT

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: ${{ runner.os }}-${{ runner.arch }}-nightly-${{ steps.date.outputs.date}}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nightly-

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Cargo-ndk
        run: |
          ver=v4.1.2
          curl -fsSLo cargo-ndk.tgz   https://github.com/bbqsrc/cargo-ndk/releases/download/$ver/cargo-ndk-aarch64-apple-darwin-$ver.tgz
          tar -xzf cargo-ndk.tgz --strip-components=1 -C ~/.cargo/bin
          chmod +x ~/.cargo/bin/cargo-ndk

      - name: Get latest Android NDK version
        id: ndk-ver
        run: |
          latest_ndk=$(curl -fsSL https://developer.android.com/ndk/downloads \
            | sed -n 's/.*Latest Stable Version (\([^)]*\)).*/\1/p')
          echo "NDK_VERSION=$latest_ndk" >> $GITHUB_ENV
          echo "Latest NDK: $latest_ndk"

      - name: Android NDK setup
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true
          local-cache: true

      - name: Build Release
        run: |
          cargo update

          # time cargo z riscv64-linux-android

          set +e -x

          targets=(
            x86_64-linux-android
            aarch64-linux-android
            armv7-linux-androideabi
          )
          for target in ${targets[@]}; do
            time cargo ndk -t $target b --profile src -Zbuild-std=std,proc_macro,panic_abort -Zbuild-std-features=panic_immediate_abort,optimize_for_size -q
          done

          find ./target -iname img -type f | xargs ls -hl
          sw_vers
          hostinfo
          sysctl -a | grep brand

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
                  "x86_64-linux-android Android-x86_64"
                  "aarch64-linux-android Android-aarch64"
                  "armv7-linux-androideabi Android-armv7"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            mv target/$arch/src/Img target/$arch/src/$name || true
            gh release upload Nightly target/$arch/src/$name --clobber || true
          done
