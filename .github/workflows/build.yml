  Windows-thumb:
    name: Windows-thumb
    if: ${{ vars.TEST != '1' || vars.thumb == '1'  }}
    runs-on: windows-2025

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Windows cleanup
        uses: ./.github/actions/windows-cleanup

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
            ccw: false

      - name: Install Windows ARM32 SDK libraries
        shell: pwsh
        run: |
          $version = '10.0.22621.3233'
          $root = Join-Path $env:RUNNER_TEMP 'windows-sdk-arm'
          $nupkg = Join-Path $env:RUNNER_TEMP "windows-sdk-arm.$version.zip"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.sdk.cpp.arm/$version/microsoft.windows.sdk.cpp.arm.$version.nupkg"

          Invoke-WebRequest -Uri $url -OutFile $nupkg
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Archive -Path $nupkg -DestinationPath $root -Force

          $kernel32 = Get-ChildItem $root -Filter kernel32.lib -Recurse |
            Where-Object { $_.FullName -match '\\um\\arm\\kernel32\.lib$' } |
            Select-Object -First 1

          if (-not $kernel32) {
            throw "The NuGet package did not contain ARM32 um\arm\kernel32.lib"
          }

          $sdkLibRoot = $kernel32.Directory.Parent.Parent.FullName
          $umArm = $kernel32.Directory.FullName
          $ucrtArm = Join-Path $sdkLibRoot 'ucrt\arm'

          Write-Host "ARM32 Windows SDK libraries: $sdkLibRoot"
          Write-Host "kernel32.lib: $($kernel32.FullName)"

          if (-not (Test-Path $ucrtArm)) {
            throw "ARM32 UCRT libraries not found: $ucrtArm"
          }

          $env:LIB = "$umArm;$ucrtArm;$env:LIB"
          "LIB=$env:LIB" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Link and Lib search config
        shell: pwsh
        run: |
          $vcBin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\*\bin\HostX86\arm\link.exe" |
          Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $vcBin) { throw "MSVC ARM32 linker not found" }
          $env:PATH = "$vcBin;$env:PATH"
          "$vcBin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

          $msvcRoot = "${env:ProgramFiles}\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC"

          $armCrt = Get-ChildItem "$msvcRoot\*\lib\arm\msvcrt.lib" -ErrorAction SilentlyContinue |
              Sort-Object { [version]$_.Directory.Parent.Parent.Name } -Descending |
              Select-Object -First 1

          if (-not $armCrt) {
              throw "MSVC ARM32 CRT libraries not found"
          }

          $armLib = $armCrt.Directory.FullName
          $env:LIB = "$armLib;$env:LIB"
          "LIB=$env:LIB" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Using MSVC ARM32 CRT: $($armCrt.FullName)"

      - name: Build release
        run: |
          cargo update

          $targets = @(
                  "thumbv7a-pc-windows-msvc",
                  "thumbv7a-uwp-windows-msvc"
                    )
          foreach ($target in $targets) {
              Write-Host "Building: $target"
              Measure-Command { cargo s $target }
          }

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |
            thumbv7a-pc-windows-msvc
            thumbv7a-uwp-windows-msvc

  Yocto:
    name: Yocto
    if: ${{ vars.TEST != '1' || vars.yocto == '1'  }}
    runs-on: ubuntu-26.04

    env:
      YOCTO: "6.0.3"

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Yocto downloads
        run: |
          IMAGE="${IMAGE,,}"
          url=https://downloads.yoctoproject.org/releases/yocto/yocto-${YOCTO}/toolchain/x86_64
          files=(
          poky-glibc-x86_64-core-image-sato-core2-64-genericx86-64-toolchain-${YOCTO}.sh
          poky-glibc-x86_64-core-image-sato-core2-32-genericx86-toolchain-${YOCTO}.sh
          poky-glibc-x86_64-core-image-sato-armv8a-genericarm64-toolchain-${YOCTO}.sh
          poky-glibc-x86_64-core-image-sato-cortexa8hf-neon-beaglebone-yocto-toolchain-${YOCTO}.sh
          poky-glibc-x86_64-core-image-sato-riscv64imafdc-qemuriscv64-toolchain-${YOCTO}.sh
          )
          set -o pipefail
          mkdir -p "/opt/poky/$YOCTO"
          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:yocto${YOCTO}"); then
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "/opt/poky/$YOCTO" && touch ~/yocto.finish &
          else
            mkdir -p yocto
            for file in "${files[@]}"; do
                path="yocto/$file"
                if [[ ! -f "$path" ]]; then
                    curl -LsSf "$url/$file" -o "$path" && chmod +x "$path" && echo | "$path" &
                fi
            done
            wait
            rm -rf yocto
            touch ~/yocto.finish
            sudo tar --zstd -C /opt/poky/$YOCTO -cf /tmp/yocto${YOCTO}.tar.zst .
            oras push --disable-path-validation "${IMAGE}:yocto${YOCTO}" "/tmp/yocto${YOCTO}.tar.zst:application/vnd.wyvern.yocto.tar.zstd" &
          fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
            "aarch64-oe-linux-gnu environment-setup-armv8a-poky-linux"
            "armv7-oe-linux-gnueabihf environment-setup-cortexa8hf-neon-poky-linux-gnueabi"
            "riscv64-oe-linux-gnu environment-setup-riscv64imafdc-poky-linux"
            "x86_64-oe-linux-gnu environment-setup-core2-64-poky-linux"
            # "i686-oe-linux-gnu environment-setup-core2-32-poky-linux"
          )

          sdk=/opt/poky/${YOCTO}
          ln -s $sdk/sysroots sysroots

          time {
              set +x
              while [[ ! -e ~/yocto.finish ]]; do
                  sleep 1
              done
          }

          for entry in "${targets[@]}"; do
            read -r target env <<< "$entry"
            (
            source $sdk/$env &>/dev/null
            unset RUST_TARGET_PATH
            for v in ${!CARGO_TARGET_@}; do
                unset "$v"
            done
            export PATH="$HOME/.cargo/bin:$PATH" &>/dev/null
            time cargo s $target
            )
          done

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |
            aarch64-oe-linux-gnu
            armv7-oe-linux-gnueabihf
            riscv64-oe-linux-gnu
            x86_64-oe-linux-gnu
            # i686-oe-linux-gnu

