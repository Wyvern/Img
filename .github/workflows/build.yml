  Linux-Mips:
    name: Linux-Mips
    if: ${{ vars.TEST != '1' || vars.mips == '1'  }}
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Ubuntu apt update and install
        run: |
           sudo apt install gcc-mips64-linux-gnuabi64 gcc-mips64el-linux-gnuabi64 gcc-mipsisa64r6el-linux-gnuabi64 gcc-mipsisa64r6-linux-gnuabi64 gcc-mipsisa32r6el-linux-gnu gcc-mipsisa32r6-linux-gnu gcc-mips-linux-gnu gcc-mipsel-linux-gnu musl-tools -qy &>/dev/null && touch ~/apt.finish &

      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain

      - name: Build Release
        run: |
          cargo update
          set +e -x

          time {
              set +x
              while [[ ! -e ~/apt.finish ]]; do
                  sleep 1
              done
          }

          targets=(
            mips64-unknown-linux-gnuabi64
            mips64-unknown-linux-muslabi64
            mips64el-unknown-linux-gnuabi64
            mips64el-unknown-linux-muslabi64
            mipsel-unknown-linux-musl
            mipsel-unknown-linux-gnu
            mipsel-unknown-linux-uclibc
            mips-unknown-linux-musl
            mips-unknown-linux-gnu
            mips-unknown-linux-uclibc
            # mipsisa64r6-unknown-linux-gnuabi64
            # mipsisa64r6el-unknown-linux-gnuabi64
            # mipsisa32r6-unknown-linux-gnu
            # mipsisa32r6el-unknown-linux-gnu
          )

          for target in "${targets[@]}"; do
            time cargo s $target &
          done
          wait

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |
            mips64-unknown-linux-gnuabi64
            mips64-unknown-linux-muslabi64
            mips64el-unknown-linux-gnuabi64
            mips64el-unknown-linux-muslabi64
            mipsel-unknown-linux-musl
            mipsel-unknown-linux-gnu
            mipsel-unknown-linux-uclibc
            mips-unknown-linux-musl
            mips-unknown-linux-gnu
            mips-unknown-linux-uclibc
            # mipsisa64r6-unknown-linux-gnuabi64
            # mipsisa64r6el-unknown-linux-gnuabi64
            # mipsisa32r6-unknown-linux-gnu
            # mipsisa32r6el-unknown-linux-gnu

  macOS:
    name: macOS
    if: ${{ vars.TEST != '1' || vars.macos == '1'  }}
    runs-on: xcode-27

    env:
      mingw: "20261006"

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: macOS cleanup
        uses: ./.github/actions/macos-cleanup

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: wasm32-wasip2,wasm32-wasip3

      - name: Cache llvm-mingw
        uses: actions/cache@v6
        with:
          path: llvm-mingw
          key: ${{ runner.os }}-${{env.mingw}}
          restore-keys: ${{ runner.os }}-llvm-${{env.mingw}}

      - name: llvm-mingw
        run: |
          if [ ! -d llvm-mingw ]; then
            mkdir llvm-mingw
            curl -LsSf https://github.com/mstorsjo/llvm-mingw/releases/download/${mingw}/llvm-mingw-${mingw}-ucrt-macos-universal.tar.xz | tar -xJf - -C llvm-mingw --strip-components=1
          fi
          echo "$PWD/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
            aarch64-apple-ios
            arm64e-apple-ios
            aarch64-apple-tvos
            arm64e-apple-tvos
            aarch64-apple-watchos
            arm64_32-apple-watchos
            aarch64-apple-visionos
            aarch64-apple-darwin
            arm64e-apple-darwin
            x86_64h-apple-darwin
            wasm32-wasip2
            wasm32-wasip3
            aarch64-pc-windows-gnullvm
            x86_64-pc-windows-gnullvm
            i686-pc-windows-gnullvm
          )

          for target in ${targets[@]}; do
            time cargo s $target &
          done
          wait
          lipo -create target/arm64e-apple-darwin/src/img target/x86_64h-apple-darwin/src/img -output Img-Universal

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |
              x86_64h-apple-darwin
              aarch64-apple-darwin
              arm64e-apple-darwin
              aarch64-apple-ios
              arm64e-apple-ios
              aarch64-apple-tvos
              arm64e-apple-tvos
              aarch64-apple-watchos
              arm64_32-apple-watchos
              aarch64-apple-visionos
              aarch64-pc-windows-gnullvm
              x86_64-pc-windows-gnullvm
              i686-pc-windows-gnullvm
              wasm32-wasip2
              wasm32-wasip3

  Redox:
    name: Redox
    if: ${{ vars.TEST != '1' || vars.redox == '1'  }}
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hurd-i686 cache
        run: |
          IMAGE="${IMAGE,,}"

          if docker manifest inspect "$IMAGE:hurd-i686" &>/dev/null; then
            docker pull "$IMAGE:hurd-i686" &>/dev/null && touch ~/hurd.finish &
          else
            mkdir hurd
            cd hurd

            cat > Dockerfile <<'EOF'
          FROM ubuntu:24.04

          ENV DEBIAN_FRONTEND=noninteractive
          ENV PATH="/cross-tools-i686/bin:${PATH}"

          RUN apt-get update && apt-get install -y --no-install-recommends \
              git sudo ca-certificates curl wget \
              build-essential perl \
              texinfo autopoint pkg-config libtool \
              autotools-dev automake autoconf gettext \
              libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev \
              flex bison gawk m4 patch xz-utils bzip2 \
              file python3 \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /src/cross-hurd

          RUN git clone --depth=1 https://github.com/flavioc/cross-hurd.git . \
              && sed -i 's|^ZLIB_VERSION=1\.3\.1$|ZLIB_VERSION=1.3.2|' package-versions.sh \
              && sed -i 's|^ZLIB_URL=.*|ZLIB_URL=https:\/\/zlib.net\/fossils\/"$ZLIB_PKG"|' download-funcs.sh \
              && sed -i 's|^MAKE_URL=\$GNU_REPO/"\$MAKE_PKG"|MAKE_URL=$GNU_REPO/make/"$MAKE_PKG"|' download-funcs.sh \
              && sed -i '/apply_patch .*submitted-AF_LINK\.diff 1/c\    sed -i -e "s|^[[:space:]]*#define[[:space:]]*PF_LINK[[:space:]]*18.*|/* #define PF_LINK 18 Link layer interface. */|" -e "s|^[[:space:]]*#define[[:space:]]*AF_LINK[[:space:]]*PF_LINK|/* #define AF_LINK PF_LINK */|" sysdeps/mach/hurd/bits/socket.h &&' download-funcs.sh \
              && sed -i 's|^DMIDECODE_URL=http://|DMIDECODE_URL=https://|' download-funcs.sh \
              && sed -i 's|download\.savannah\.gnu\.org/releases/dmidecode/|download-mirror.savannah.gnu.org/releases/dmidecode/|' download-funcs.sh \
              && sed -i '/--disable-libgomp \\/a\      --disable-libsanitizer \\' bootstrap-funcs.sh \
              && export CFLAGS="-O3 -pipe -g0" \
              && export CXXFLAGS="-O3 -pipe -g0" \
              && export LDFLAGS="-Wl,-O3" \
              && CPU=i686 bash -x download.sh \
              && DISABLE_ADA=1 CPU=i686 bash -x bootstrap.sh \
              && find /cross-tools-i686 -type d \
                    \( -name __pycache__ -o -name man -o -name doc -o -name docs \) \
                    -prune -exec rm -rf {} + \
              && rm -rf /src/cross-hurd/src \
                        /src/cross-hurd/build-i686 \
                        /root/.cache \
                        /tmp/* \
                        /var/tmp/* \
              && test -x /cross-tools-i686/bin/i686-gnu-gcc \
              && /cross-tools-i686/bin/i686-gnu-gcc -dumpmachine \
              && apt-get clean \
              && apt-get purge -y --auto-remove

          ENTRYPOINT ["/cross-tools-i686/bin/i686-gnu-gcc"]
          EOF

            docker build --platform linux/amd64 \
                --provenance=false \
                --load \
                --progress=plain \
                -t ghcr.io/wyvern/img:hurd-i686 .

            touch ~/hurd.finish

            docker push ghcr.io/wyvern/img:hurd-i686 &
          fi

      - name: Emscripten Cache
        run: |
          IMAGE="${IMAGE,,}"

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:emscripten"); then
            mkdir -p emsdk && oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "emsdk" && touch ~/ems.finish &
          else
            git clone --depth 1 --single-branch https://github.com/emscripten-core/emsdk.git
            ./emsdk/emsdk install latest &>/dev/null
            ./emsdk/emsdk activate latest &>/dev/null
            touch ~/ems.finish
            tar --zstd -C emsdk/ -cf /tmp/emscripten.tar.zst .
            oras push --disable-path-validation "${IMAGE}:emscripten" "/tmp/emscripten.tar.zst:application/vnd.wyvern.emscripten.tar.zstd" &
          fi

      - name: Redox Cache
        run: |
          IMAGE="${IMAGE,,}"

          targets=(
            aarch64-unknown-redox
            riscv64gc-unknown-redox
            x86_64-unknown-redox
            i586-unknown-redox
          )

          mkdir -p "redox"

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:redox"); then
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "redox" && touch ~/redox.finish &
          else
            file=relibc-install.tar.gz
            url="https://static.redox-os.org/toolchain/x86_64-unknown-linux-gnu"
            for target in "${targets[@]}"; do
              mkdir -p "redox/$target"
              curl -fsSL "$url/$target/$file" | tar -xz -C "redox/$target" &
            done
            wait
            touch ~/redox.finish
            tar --zstd -C "redox/" -cf /tmp/redox.tar.zst .
            oras push --disable-path-validation "${IMAGE}:redox" "/tmp/redox.tar.zst:application/vnd.wyvern.redox.tar.zstd" &
          fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain

      - name: Build Release
        continue-on-error: true
        run: |
          cargo update
          set +e -x

          targets=(
            x86_64-unknown-motor
            riscv32imac-unknown-xous-elf
            x86_64-unknown-hurd-gnu
          )
          for target in ${targets[@]}; do
            time cargo s $target &
          done

          (
            time {
              set +x
              while [[ ! -f ~/ems.finish ]]; do
                  sleep 1
              done
            }
            source ./emsdk/emsdk_env.sh &>/dev/null
            time cargo s wasm32-unknown-emscripten
          ) &

          (
            time {
              set +x
              while [[ ! -f ~/hurd.finish ]]; do
                  sleep 1
              done
            }
            cat > i686-gnu-gcc <<'EOF'
          #!/bin/sh
          exec docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            ghcr.io/wyvern/img:hurd-i686 \
            "$@"
          EOF
            chmod +x i686-gnu-gcc
            time cargo s i686-unknown-hurd-gnu
          ) &

          time {
            set +x
            while [[ ! -f ~/redox.finish ]]; do
                sleep 1
            done
          }

          targets=(
              aarch64-unknown-redox
              riscv64gc-unknown-redox
              x86_64-unknown-redox
              i586-unknown-redox
          )

          for target in "${targets[@]}"; do
              time cargo s "$target" &
          done

          wait

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |
              i586-unknown-redox
              x86_64-unknown-redox
              aarch64-unknown-redox
              riscv64gc-unknown-redox
              x86_64-unknown-motor
              x86_64-unknown-hurd-gnu
              i686-unknown-hurd-gnu
              riscv32imac-unknown-xous-elf
              wasm32-unknown-emscripten

  Solaris:
    name: Solaris
    if: ${{ vars.TEST != '1' || vars.solaris == '1'  }}
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write

    env:
      NETBSD_VERSION: "11.0"
      OPENBSD_VERSION: "7.9"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout rust-cross-toolchain
        uses: actions/checkout@v7
        with:
          repository: taiki-e/rust-cross-toolchain
          path: rust-cross-toolchain

      - name: Patch rust-cross-toolchain
        working-directory: rust-cross-toolchain
        run: |
            sed -i 's/\[1-8\]\.\*) ext=tgz ;;/[1-9].*|1[0-9].*) ext=tgz ;;/g' \
            docker/base/netbsd.Dockerfile

            df=(netbsd openbsd linux-gnu)
            for file in "${df[@]}"; do
              dockerfile="docker/$file.Dockerfile"
              if [[ "$file" == "linux-gnu" ]]; then
                sed -i '/^FROM ghcr.io\/taiki-e\/build-base:"${DISTRO}-${DISTRO_VERSION}" AS test-base$/,/^FROM "${DISTRO}":"${DISTRO_VERSION}" AS final$/{
                  /^FROM "${DISTRO}":"${DISTRO_VERSION}" AS final$/!d
                }' "$dockerfile"

                sed -i 's/COPY --from=test \//COPY --from=builder \//' "$dockerfile"
              fi
              sed -i '/RUN \/test\/test.sh/d' "$dockerfile"
              sed -i '/^RUN apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev clang ca-certificates && rm -rf \/var\/lib\/apt\/lists\/\*$/d' "$dockerfile"

              sed -i '/^FROM \(ubuntu:"${UBUNTU_VERSION}"\|"${DISTRO}":"${DISTRO_VERSION}"\) AS final$/a\
              RUN apt-get update \&\& apt-get install -y --no-install-recommends gcc libc6-dev clang ca-certificates \&\& rm -rf /var/lib/apt/lists/*
              ' "$dockerfile"
            done

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker cross-toolchain images
        working-directory: rust-cross-toolchain
        run: |
          IMAGE="${IMAGE,,}"

          if docker manifest inspect "$IMAGE:haiku-cross" &>/dev/null; then
              docker pull "$IMAGE:haiku-cross" &>/dev/null &
          else
              mkdir -p haiku

              curl -fsSL -o haiku/Dockerfile https://github.com/haiku/haiku/raw/refs/heads/master/3rdparty/docker/cross-compiler/Dockerfile \
              -o haiku/build-toolchain.sh https://github.com/haiku/haiku/raw/refs/heads/master/3rdparty/docker/cross-compiler/build-toolchain.sh

              printf '\nENTRYPOINT ["x86_64-unknown-haiku-gcc"]\n' >> haiku/Dockerfile
              sed -i '/^RUN apt-get install/ s/$/ \&\& rm -rf \/var\/lib\/apt\/lists\/* \/var\/cache\/apt\/archives\/*/' haiku/Dockerfile

              file="haiku/build-toolchain.sh"

              sed -i '/^git clone --depth=1 --branch \$BUILDTOOLS_REV https:\/\/review.haiku-os.org\/buildtools$/a\
              \
              # Patch Haiku source after cloning.\
              sed -i '\''/^#include "Data.h"$/a #include <cstddef>'\'' "$HAIKU/src/kits/storage/sniffer/RPattern.cpp"\ ' "$file"

              python3 - <<'PY'
          from pathlib import Path

          path = Path("haiku/build-toolchain.sh")
          script = path.read_text()

          anchor = "$HAIKU/configure $configureArgs"

          flags_marker = "# Optimize the x86_64 Haiku target."
          flags = '''# Optimize the x86_64 Haiku target.
          export CFLAGS="-O3 -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -fvisibility=hidden -pipe -g0"
          export CXXFLAGS="$CFLAGS -fno-exceptions -fno-rtti -fvisibility-inlines-hidden"
          '''

          if flags_marker in script:
              print("Optimization flags already present; skipping.")
          else:
              if anchor not in script:
                  raise SystemExit(f"ERROR: insertion point not found: {anchor}")
              script = script.replace(anchor, flags + anchor, 1)
              print("Added optimization flags.")

          path.write_text(script)
          print(f"Patched {path}")
          PY

              docker buildx build --tag "$IMAGE:haiku-cross" \
                --platform linux/amd64 \
                --provenance=false \
                --progress=quiet \
                --load ./haiku

              docker push "$IMAGE:haiku-cross" &
          fi

          targets=(
            csky-unknown-linux-gnuabiv2
            csky-unknown-linux-gnuabiv2hf
          )

          for target in "${targets[@]}"; do
            if docker manifest inspect "$IMAGE:$target" &>/dev/null; then
              docker pull "$IMAGE:$target" &>/dev/null &
            else
              docker buildx build \
                --platform linux/amd64 \
                --provenance=false \
                --load \
                --file docker/linux-gnu.Dockerfile \
                --build-arg RUST_TARGET="$target" \
                --build-arg HOST_ARCH=amd64 \
                --build-arg DISTRO_VERSION=24.04 \
                --progress=quiet \
                --tag "$IMAGE:$target" \
                docker
              docker push "$IMAGE:$target" &>/dev/null &
            fi
          done

          docker pull ghcr.io/apache/nuttx/apache-nuttx-ci-linux:latest &>/dev/null &

          targets=(
            x86_64-unknown-illumos
            sparcv9-sun-solaris
            x86_64-pc-solaris
          )

          for target in ${targets[@]}; do
            CROSS_IMAGE=ghcr.io/cross-rs/${target}:main
            docker pull $CROSS_IMAGE &>/dev/null &
          done

          if docker manifest inspect "$IMAGE:sparc64-unknown-netbsd${NETBSD_VERSION}" &>/dev/null; then
              docker pull "$IMAGE:sparc64-unknown-netbsd${NETBSD_VERSION}" &>/dev/null &
          else
              # NetBSD base image required by docker/netbsd.Dockerfile
              docker buildx build \
                --platform linux/amd64 \
                --provenance=false \
                --load \
                --progress=quiet \
                --file docker/base/netbsd.Dockerfile \
                --build-arg RUST_TARGET=sparc64-unknown-netbsd \
                --build-arg HOST_ARCH=amd64 \
                --build-arg UBUNTU_VERSION=24.04 \
                --build-arg NETBSD_VERSION="$NETBSD_VERSION" \
                --tag ghcr.io/taiki-e/rust-cross-toolchain:sparc64-unknown-netbsd${NETBSD_VERSION}-base-dev-amd64 \
                docker/base

              # NetBSD final image
              docker buildx build \
                --platform linux/amd64 \
                --provenance=false \
                --load \
                --progress=quiet \
                --file docker/netbsd.Dockerfile \
                --build-arg RUST_TARGET=sparc64-unknown-netbsd \
                --build-arg HOST_ARCH=amd64 \
                --build-arg UBUNTU_VERSION=24.04 \
                --build-arg NETBSD_VERSION="$NETBSD_VERSION" \
                --tag "$IMAGE:sparc64-unknown-netbsd${NETBSD_VERSION}" \
                docker
              docker push "$IMAGE:sparc64-unknown-netbsd${NETBSD_VERSION}" &>/dev/null &
          fi

          if docker manifest inspect "$IMAGE:sparc64-unknown-openbsd${OPENBSD_VERSION}" &>/dev/null; then
              docker pull "$IMAGE:sparc64-unknown-openbsd${OPENBSD_VERSION}" &>/dev/null &
          else
              # OpenBSD final image
              docker buildx build \
                --platform linux/amd64 \
                --provenance=false \
                --load \
                --progress=quiet \
                --file docker/openbsd.Dockerfile \
                --build-arg RUST_TARGET=sparc64-unknown-openbsd \
                --build-arg HOST_ARCH=amd64 \
                --build-arg UBUNTU_VERSION=24.04 \
                --build-arg OPENBSD_VERSION="$OPENBSD_VERSION" \
                --tag "$IMAGE:sparc64-unknown-openbsd${OPENBSD_VERSION}" \
                docker
              docker push "$IMAGE:sparc64-unknown-openbsd${OPENBSD_VERSION}" &>/dev/null &
          fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain

      - name: Cache cross-rs
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross
          restore-keys: ${{ runner.os }}-cross

      - name: Cross-rs
        run: |
          if [ ! -f ~/.cargo/bin/cross ]; then
            cargo install cross --git https://github.com/cross-rs/cross --branch main -q --force &>/dev/null
          fi
          # cross --version

      - name: Build Release
        run: |
          cargo update
          set +e -x

          cb=(cross build -q --profile src -Zbuild-std=std,panic_abort --target)

          targets=(
            aarch64-unknown-nuttx
            # riscv64gc-unknown-nuttx-elf
          )
          for target in ${targets[@]}; do
            time "${cb[@]}" $target
          done

          targets=(
            csky-unknown-linux-gnuabiv2
            csky-unknown-linux-gnuabiv2hf
            sparc64-unknown-netbsd
            sparc64-unknown-openbsd
            x86_64-unknown-illumos
            sparcv9-sun-solaris
            x86_64-pc-solaris
          )

          for target in ${targets[@]}; do
            time "${cb[@]}" $target &
          done

          cat > x86_64-unknown-haiku-gcc <<'EOF'
          #!/bin/sh
          exec docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            ghcr.io/wyvern/img:haiku-cross \
            "$@"
          EOF

          chmod +x x86_64-unknown-haiku-gcc
          time cargo s x86_64-unknown-haiku &

          wait

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |
            sparc64-unknown-netbsd
            sparc64-unknown-openbsd
            x86_64-unknown-illumos
            sparcv9-sun-solaris
            x86_64-pc-solaris
            x86_64-unknown-haiku
            csky-unknown-linux-gnuabiv2
            csky-unknown-linux-gnuabiv2hf

  Unix:
    name: Unix
    if: ${{ vars.TEST != '1' || vars.unix == '1'  }}
    runs-on: ubuntu-26.04-arm

    env:
      FREEBSD: "15.1"
      OPENBSD: "7.9"
      NETBSD: "11.0"
      DFLY: "6.4.2"

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: LLVM Setup
        uses: ./.github/actions/llvm

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unix sysroot cache
        run: |
            IMAGE="${IMAGE,,}"

            mkdir -p /home/runner/unix;
            ln -sf /home/runner/unix sysroot

            {
              curl -fsSL "https://download.freebsd.org/releases/arm/armv7/ISO-IMAGES/$FREEBSD/FreeBSD-${FREEBSD}-RELEASE-arm-armv7-GENERICSD.img.xz" | xz -d > armv7.img
              LOOP=$(sudo losetup --find --show --partscan armv7.img)
              sudo mkdir -p /mnt/freebsd
              sudo mount -t ufs -o ro,ufstype=ufs2 ${LOOP}p5 /mnt/freebsd
              mkdir freebsd
              ln -s /mnt/freebsd freebsd/armv7
            } &

            if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:unix"); then
              oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "/home/runner/unix" && touch ~/unix.sysroot &
            else
              freebsd=(amd64 arm64 riscv)
              for arch in "${freebsd[@]}"; do
                if [ ! -d sysroot/freebsd/$arch ]; then
                    mkdir -p sysroot/freebsd/$arch
                    curl -fsSL https://download.freebsd.org/ftp/releases/$arch/${FREEBSD}-RELEASE/base.txz \
                | tar -xJf - -C sysroot/freebsd/$arch &>/dev/null &
                fi
              done

              if [ ! -d sysroot/freebsd/powerpc ]; then
                mkdir -p sysroot/freebsd/powerpc
                curl -fsSL https://download.freebsd.org/releases/powerpc/powerpc/14.5-RELEASE/base.txz | tar -xJf - -C sysroot/freebsd/powerpc &>/dev/null &
              fi

              if [ ! -d sysroot/freebsd/i386 ]; then
                mkdir -p sysroot/freebsd/i386
                curl -fsSL https://download.freebsd.org/releases/i386/14.5-RELEASE/base.txz | tar -xJf - -C sysroot/freebsd/i386 &>/dev/null &
              fi

              ppc=(powerpc64 powerpc64le)
              for arch in "${ppc[@]}"; do
                if [ ! -d sysroot/freebsd/$arch ]; then
                  mkdir -p sysroot/freebsd/$arch
                  curl -fsSL https://download.freebsd.org/ftp/releases/powerpc/$arch/${FREEBSD}-RELEASE/base.txz \
                    | tar -xJf - -C sysroot/freebsd/$arch &>/dev/null &
                fi
              done

              openbsd=(amd64 arm64 riscv64 powerpc64)
              files=(base79 comp79)
              for arch in "${openbsd[@]}"; do
                if [ ! -d sysroot/openbsd/$arch ]; then
                  mkdir -p sysroot/openbsd/$arch
                  for file in "${files[@]}"; do
                    curl -fsSL https://cdn.openbsd.org/pub/OpenBSD/$OPENBSD/$arch/$file.tgz | tar -xzf - -C sysroot/openbsd/$arch &>/dev/null &
                  done
                fi
              done

              netbsd=(amd64 evbarm-aarch64 evbarm-aarch64eb riscv-riscv64)
              files=(base comp etc)
              for arch in "${netbsd[@]}"; do
                if [ ! -d sysroot/netbsd/$arch ]; then
                  mkdir -p sysroot/netbsd/$arch
                  for file in "${files[@]}"; do
                    for ext in tar.xz tgz; do
                            url="https://cdn.netbsd.org/pub/NetBSD/NetBSD-${NETBSD}/$arch/binary/sets/$file.$ext"
                            out="sysroot/netbsd/$arch"
                            if curl -fsSI "$url" &>/dev/null; then
                                if [ "$ext" = "tar.xz" ]; then
                                    curl -fsSL "$url" | tar -xJf - -C "$out" &>/dev/null &
                                else
                                    curl -fsSL "$url" | tar -xzf - -C "$out" &>/dev/null &
                                fi
                            fi
                        done
                  done
                fi
              done

              if [ ! -f sysroot/dfly-x86_64-${DFLY}_REL.iso ]; then
                curl -fsSL https://mirror-master.dragonflybsd.org/iso-images/dfly-x86_64-${DFLY}_REL.iso.bz2 | bunzip2 -c > sysroot/dfly-x86_64-${DFLY}_REL.iso &
                mkdir -p sysroot/dfly
              fi

              wait
              chmod -R u+rwX sysroot
              touch ~/unix.sysroot
              tar --zstd -C /home/runner/unix -cf /tmp/unix.tar.zst .
              oras push --disable-path-validation "${IMAGE}:unix" "/tmp/unix.tar.zst:application/vnd.wyvern.sysroot.tar.zstd" &
            fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain

      - name: Build Release
        run: |
          cargo update
          set +e -x

          time {
              set +x
              while [[ ! -f ~/unix.sysroot || ! -f ~/llvm.finish ]]; do
                  sleep 1
              done
          }

          sudo mount -o loop sysroot/dfly-x86_64-${DFLY}_REL.iso sysroot/dfly &>/dev/null

          targets=(
            x86_64-unknown-dragonfly
            x86_64-unknown-freebsd
            aarch64-unknown-freebsd
            riscv64gc-unknown-freebsd
            powerpc64-unknown-freebsd
            powerpc64le-unknown-freebsd
            powerpc-unknown-freebsd
            i686-unknown-freebsd
            armv7-unknown-freebsd
            x86_64-unknown-openbsd
            aarch64-unknown-openbsd
            riscv64gc-unknown-openbsd
            powerpc64-unknown-openbsd
            x86_64-unknown-netbsd
            aarch64-unknown-netbsd
            aarch64_be-unknown-netbsd
            riscv64gc-unknown-netbsd
          )

          for target in ${targets[@]}; do
            time cargo s $target &
          done
          wait

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |
            x86_64-unknown-dragonfly
            x86_64-unknown-freebsd
            aarch64-unknown-freebsd
            riscv64gc-unknown-freebsd
            powerpc64-unknown-freebsd
            powerpc64le-unknown-freebsd
            powerpc-unknown-freebsd
