name: Img

on:
  push:
    branches: ["stable"]
  pull_request:
    branches: ["stable"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  Android:
    name: Android
    if: ${{ vars.TEST != '1' || vars.android == '1'  }}
    runs-on: ubuntu-26.04

    env:
      ndk: "r30"

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Android NDK
        run: |
          IMAGE="${IMAGE,,}"

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:android-ndk-${ndk}"); then
            mkdir ~/android-ndk-${ndk} && oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C ~/android-ndk-${ndk} &
          fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: aarch64-unknown-linux-ohos,armv7-unknown-linux-ohos,x86_64-unknown-linux-ohos,aarch64-linux-android,armv7-linux-androideabi,arm-linux-androideabi,thumbv7neon-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@main
        with:
          version: "7.0"

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            aarch64-unknown-linux-ohos
            armv7-unknown-linux-ohos
            x86_64-unknown-linux-ohos
            aarch64-linux-android
            armv7-linux-androideabi
            arm-linux-androideabi
            thumbv7neon-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Build Release
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          export ANDROID_NDK_HOME=~/android-ndk-$ndk
          ln -sf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64" ndk

          ln -sf $OHOS_SDK_NATIVE/llvm ohos
          ln -sf $OHOS_SDK_NATIVE/sysroot ohos-root

          source .github/scripts/util.sh
          targets_from_env

          for target in "${targets[@]}"; do
            time cargo l $target
          done

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}

  Fuchsia:
    name: Hermit+Fuchsia
    if: ${{ vars.TEST != '1' || vars.fuchsia == '1'  }}
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: LLVM Setup
        uses: ./.github/actions/llvm

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fuchsia Cache
        run: |
          IMAGE="${IMAGE,,}"

          mkdir -p /home/runner/Fuchsia;
          ln -sf /home/runner/Fuchsia fuchsia

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:fuchsia"); then
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "/home/runner/Fuchsia" && touch ~/fuchsia.finish &
          fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: x86_64-fortanix-unknown-sgx,aarch64-unknown-fuchsia,x86_64-unknown-fuchsia

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            x86_64-fortanix-unknown-sgx
            aarch64-unknown-fuchsia
            x86_64-unknown-fuchsia

      - name: Build Release
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          source .github/scripts/util.sh
          targets_from_env

          time cargo l "${targets[0]}" &

          time waitfor ~/fuchsia.finish ~/llvm.finish

          for target in "${targets[@]:1}"; do
            time cargo l "$target" &
          done

          wait

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}

  Nix-Sparc:
    name: Linux-Nix-Sparc
    if: ${{ vars.TEST != '1' || vars.nix == '1'  }}
    runs-on: ubuntu-26.04

    env:
      openwrt: "25.12.6"
      aarch64be: "2026.08-1"
      hexagon: "22.1.8"
      riscv32: "20261007"

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nix Quick Install
        uses: nixbuild/nix-quick-install-action@v35

      - name: Ubuntu apt update and install
        run: |
          sudo apt install gcc-sparc64-linux-gnu libc6-dev-sparc-sparc64-cross gcc-multilib-sparc64-linux-gnu gcc-powerpc64-linux-gnu -qy >/dev/null && touch ~/apt.finish &

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nix build cache
        run: |
          IMAGE="${IMAGE,,}"
          mkdir ppc64
          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:ppc64"); then
            {
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C ppc64
            for variant in gnu musl; do
              archive="ppc64/ppc64-${variant}.nar.zst"
              root=$(cat "ppc64/ppc64-${variant}.root")
              zstd -dc "$archive" | nix-store --import
              ln -sfn "$root" "./ppc64-${variant}"
            done
            touch ~/ppc64gnu.finish ~/ppc64musl.finish
            } &
          fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: powerpc64-unknown-linux-musl,sparc64-unknown-linux-gnu,powerpc64-unknown-linux-gnu

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            powerpc64-unknown-linux-musl
            sparc64-unknown-linux-gnu
            powerpc64-unknown-linux-gnu

      - name: Build Release
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          source .github/scripts/util.sh
          targets_from_env

          time waitfor ~/ppc64musl.finish && time cargo l "${targets[0]}" &

          {
            time waitfor ~/apt.finish
            for target in "${targets[@]:1}"; do
              time cargo l "$target" &
            done
            wait
          } &

          wait

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}


  Linux-Arm:
    name: Linux-Arm
    if: ${{ vars.TEST != '1' || vars.arm == '1'  }}
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ubuntu apt update and install
        run: |
          sudo apt install gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf -qy &>/dev/null && touch ~/apt.finish  &

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: thumbv7neon-unknown-linux-gnueabihf,armv7-unknown-linux-gnueabi,armv7-unknown-linux-gnueabihf,armv5te-unknown-linux-gnueabi,arm-unknown-linux-gnueabi,arm-unknown-linux-gnueabihf

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            thumbv7neon-unknown-linux-gnueabihf
            armv7-unknown-linux-gnueabi
            armv7-unknown-linux-gnueabihf
            armv5te-unknown-linux-gnueabi
            arm-unknown-linux-gnueabi
            arm-unknown-linux-gnueabihf

      - name: Build Release
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          source .github/scripts/util.sh
          targets_from_env
          time waitfor ~/apt.finish

          for target in ${targets[@]}; do
            time cargo l $target &
          done
          wait

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}

  Linux-Gnu:
    name: Linux-Gnu
    if: ${{ vars.TEST != '1' || vars.gnu == '1'  }}
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Ubuntu apt update and install
        run: |
          sudo apt install gcc-x86-64-linux-gnu gcc-x86-64-linux-gnux32 gcc-riscv64-linux-gnu gcc-s390x-linux-gnu gcc-powerpc-linux-gnu gcc-powerpc64le-linux-gnu gcc-loongarch64-linux-gnu -qy >/dev/null && touch ~/apt.finish &

      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-gnux32,aarch64-unknown-linux-gnu,riscv64gc-unknown-linux-gnu,s390x-unknown-linux-gnu,powerpc64le-unknown-linux-gnu,powerpc-unknown-linux-gnu,sparc64-unknown-linux-gnu,loongarch64-unknown-linux-gnu

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            aarch64-unknown-linux-gnu
            x86_64-unknown-linux-gnu
            x86_64-unknown-linux-gnux32
            powerpc64le-unknown-linux-gnu
            powerpc-unknown-linux-gnu
            riscv64gc-unknown-linux-gnu
            riscv64a23-unknown-linux-gnu
            s390x-unknown-linux-gnu
            loongarch64-unknown-linux-gnu

      - name: Build Release
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          source .github/scripts/util.sh
          targets_from_env
          time waitfor ~/apt.finish

          for target in "${targets[@]}"; do
            time cargo l $target &
          done
          wait

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}

  macOS:
    name: macOS
    if: ${{ vars.TEST != '1' || vars.macos == '1'  }}
    runs-on: xcode-27

    env:
      mingw: "20261006"

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: macOS cleanup
        uses: ./.github/actions/macos-cleanup

      - name: Cache llvm-mingw
        uses: actions/cache@v6
        with:
          path: llvm-mingw
          key: ${{ runner.os }}-${{env.mingw}}
          restore-keys: ${{ runner.os }}-llvm-${{env.mingw}}

      - name: llvm-mingw
        run: |
          if [ ! -d llvm-mingw ]; then
            mkdir llvm-mingw
            curl -LsSf https://github.com/mstorsjo/llvm-mingw/releases/download/${mingw}/llvm-mingw-${mingw}-ucrt-macos-universal.tar.xz | tar -xJf - -C llvm-mingw --strip-components=1
          fi
          echo "$PWD/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-tvos,aarch64-apple-visionos,aarch64-apple-watchos,wasm32-wasip2,wasm32-wasip3,x86_64-pc-windows-gnullvm,aarch64-pc-windows-gnullvm,i686-pc-windows-gnullvm

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            aarch64-apple-ios
            aarch64-apple-tvos
            aarch64-apple-watchos
            aarch64-apple-visionos
            aarch64-apple-darwin
            x86_64h-apple-darwin
            wasm32-wasip2
            wasm32-wasip3
            aarch64-pc-windows-gnullvm
            x86_64-pc-windows-gnullvm
            i686-pc-windows-gnullvm

      - name: Build Release
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          source .github/scripts/util.sh
          targets_from_env

          for target in "${targets[@]}"; do
            time cargo l $target &
          done

          wait

          lipo -create target/arm64e-apple-darwin/lto/img target/x86_64h-apple-darwin/lto/img -output Img-Universal

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}

  Redox:
    name: Redox
    if: ${{ vars.TEST != '1' || vars.redox == '1'  }}
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Emscripten Cache
        run: |
          IMAGE="${IMAGE,,}"

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:emscripten"); then
            mkdir -p emsdk && oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "emsdk" && touch ~/ems.finish &
          fi

      - name: Redox Cache
        run: |
          IMAGE="${IMAGE,,}"

          mkdir -p "redox"

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:redox"); then
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "redox" && touch ~/redox.finish &
          fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: wasm32-unknown-emscripten,x86_64-unknown-redox

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            wasm32-unknown-emscripten
            x86_64-unknown-redox

      - name: Build Release
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          source .github/scripts/util.sh
          targets_from_env

          {
            time waitfor ~/ems.finish
            source ./emsdk/emsdk_env.sh &>/dev/null
            time cargo l ${targets[0]}
          } &

          time waitfor ~/redox.finish
          time cargo l ${targets[1]} &

          wait

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}

  Solaris:
    name: Solaris
    if: ${{ vars.TEST != '1' || vars.solaris == '1'  }}
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write

    env:
      NETBSD_VERSION: "11.0"
      OPENBSD_VERSION: "8.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout rust-cross-toolchain
        uses: actions/checkout@v7
        with:
          repository: taiki-e/rust-cross-toolchain
          path: rust-cross-toolchain

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker cross-toolchain images
        working-directory: rust-cross-toolchain
        run: |
          IMAGE="${IMAGE,,}"

          targets=(
            x86_64-unknown-illumos
            sparcv9-sun-solaris
            x86_64-pc-solaris
          )

          for target in ${targets[@]}; do
            CROSS_IMAGE=ghcr.io/cross-rs/${target}:main
            docker pull $CROSS_IMAGE &>/dev/null &
          done

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: x86_64-unknown-illumos,sparcv9-sun-solaris,x86_64-pc-solaris

      - name: Cache cross-rs
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross
          restore-keys: ${{ runner.os }}-cross

      - name: Cross-rs
        run: |
          if [ ! -f ~/.cargo/bin/cross ]; then
            cargo install cross --git https://github.com/cross-rs/cross --branch main -q --force &>/dev/null
          fi
          # cross --version

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            x86_64-unknown-illumos
            sparcv9-sun-solaris
            x86_64-pc-solaris

      - name: Build Release
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          source .github/scripts/util.sh
          targets_from_env

          for target in "${targets[@]}"; do
            time cr $target &
          done

          wait

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}

  Unix:
    name: Unix
    if: ${{ vars.TEST != '1' || vars.unix == '1'  }}
    runs-on: ubuntu-26.04-arm

    env:
      FREEBSD: "15.1"
      OPENBSD: "8.0"
      NETBSD: "11.0"
      DFLY: "6.4.2"

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: LLVM Setup
        uses: ./.github/actions/llvm

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unix sysroot cache
        run: |
            IMAGE="${IMAGE,,}"

            mkdir -p /home/runner/unix;
            ln -sf /home/runner/unix sysroot

            if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:unix"); then
              oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "/home/runner/unix" && touch ~/unix.sysroot &
            fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: aarch64-unknown-freebsd,x86_64-unknown-freebsd,x86_64-unknown-netbsd

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            x86_64-unknown-freebsd
            aarch64-unknown-freebsd
            x86_64-unknown-netbsd

      - name: Build Release
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          source .github/scripts/util.sh
          targets_from_env

          time waitfor ~/unix.sysroot ~/llvm.finish

          for target in "${targets[@]}"; do
            time cargo l $target &
          done
          wait

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}

  Windows-11-Arm:
    name: Windows-11-arm
    if: ${{ vars.TEST != '1' || vars.win11 == '1'  }}
    runs-on: windows-11-vs2026-arm

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Windows cleanup
        uses: ./.github/actions/windows-cleanup

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          ccw: false
          target: aarch64-pc-windows-msvc,arm64ec-pc-windows-msvc,x86_64-pc-windows-msvc,i686-pc-windows-msvc

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            aarch64-pc-windows-msvc
            arm64ec-pc-windows-msvc
            x86_64-pc-windows-msvc
            i686-pc-windows-msvc

      - name: Build release
        shell: bash
        continue-on-error: true
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          source .github/scripts/util.sh
          targets_from_env

          for target in "${targets[@]}"; do
            time cargo l $target &
          done

          wait

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}

  Gnu-uefi-wali:
    name: Gnu-uefi-wali
    if: ${{ vars.TEST != '1' || vars.uefi == '1'  }}
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ubuntu apt update and install
        run: |
          {
            sudo apt install gcc-i686-linux-gnu gcc-mingw-w64 gcc-mingw-w64-i686 && touch ~/apt.finish
          } >/dev/null &

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: i686-unknown-uefi,x86_64-unknown-uefi,aarch64-unknown-uefi,i586-unknown-linux-gnu,i686-unknown-linux-gnu,i686-pc-windows-gnu,x86_64-pc-windows-gnu

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            i686-unknown-uefi
            x86_64-unknown-uefi
            aarch64-unknown-uefi
            i586-unknown-linux-gnu
            i686-unknown-linux-gnu
            i686-pc-windows-gnu
            x86_64-pc-windows-gnu

      - name: Build Release
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          source .github/scripts/util.sh
          targets_from_env
          time waitfor ~/apt.finish

          for target in "${targets[@]:0:2}"; do
            time RUSTC_WRAPPER= cargo l $target &
          done

          for target in "${targets[@]:2}"; do
            time cargo l $target &
          done

          wait

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}

  Zig-Muslx64:
    name: Zig-Muslx64
    if: ${{ vars.TEST != '1' || vars.musl64 == '1'  }}
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          zig: true
          targets: x86_64-unknown-linux-musl,powerpc64le-unknown-linux-musl,riscv64gc-unknown-linux-musl,s390x-unknown-linux-musl,loongarch64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Set targets
        id: targets
        uses: ./.github/actions/targets
        with:
          targets: |
            x86_64-unknown-linux-musl x86_64-linux-musl
            powerpc64le-unknown-linux-musl powerpc64le-linux-musl
            riscv64gc-unknown-linux-musl riscv64-linux-musl
            s390x-unknown-linux-musl s390x-linux-musl
            loongarch64-unknown-linux-musl loongarch64-linux-musl
            aarch64-unknown-linux-musl aarch64-linux-musl

      - name: Build Release
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          cargo update
          set +e -x

          source .github/scripts/util.sh
          targets_from_env

          for entry in "${targets[@]}"; do
            read -r target zig <<< "$entry"
            time cargo l $target --config "target.${target%.json}.rustflags = ['-Clink-arg=--target=${zig}']" &
          done

          wait

      - name: Upload release binaries
        uses: ./.github/actions/upload
        with:
          targets: ${{ steps.targets.outputs.targets }}

  Zig-Muslx32:
      name: Zig-Muslx32
      if: ${{ vars.TEST != '1' || vars.musl32 == '1'  }}
      runs-on: ubuntu-26.04-arm

      permissions:
        contents: write
        packages: write

      steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Toolchain Setup
          uses: ./.github/actions/toolchain
          with:
            zig: true
            targets: i586-unknown-linux-musl,i686-unknown-linux-musl,armv5te-unknown-linux-musleabi,arm-unknown-linux-musleabi,arm-unknown-linux-musleabihf,armv7-unknown-linux-musleabi,armv7-unknown-linux-musleabihf

        - name: Set targets
          id: targets
          uses: ./.github/actions/targets
          with:
            targets: |
              i586-unknown-linux-musl x86-linux-musl
              i686-unknown-linux-musl x86-linux-musl
              armv5te-unknown-linux-musleabi arm-linux-musleabi
              arm-unknown-linux-musleabi arm-linux-musleabi
              arm-unknown-linux-musleabihf arm-linux-musleabihf
              armv7-unknown-linux-musleabi arm-linux-musleabi
              armv7-unknown-linux-musleabihf arm-linux-musleabihf

        - name: Build Release
          env:
            TARGETS: ${{ steps.targets.outputs.targets }}
          run: |
            cargo update
            set +e -x

            source .github/scripts/util.sh
            targets_from_env

            for entry in "${targets[@]}"; do
              read -r target zig <<< "$entry"
              time cargo l $target --config "target.${target%.json}.rustflags = ['-Clink-arg=--target=${zig}']" &
            done

            wait

        - name: Upload release binaries
          uses: ./.github/actions/upload
          with:
            targets: ${{ steps.targets.outputs.targets }}
