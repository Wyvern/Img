name: Img

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  TEST:
    name: Test
    if: ${{ vars.TEST == '1' }}
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # - name: GHCR Setup
      #   uses: ./.github/actions/ghcr
      #   with:
      #    token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ubuntu apt update and install
        run: |
          # sudo apt install gcc-mips-linux-gnu gcc-mipsel-linux-gnu musl-tools -qy &>/dev/null

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain

      - name: Build Release
        run: |
          cargo update
          set +e -x

          # mkdir -p l4re && curl -fsSL https://l4re.org/download/snapshots/toolchain/toolchain-l4re-arm64-gcc-15.tar.xz | tar -xJf - -C l4re --strip-components=1

          # mkdir -p l4re && curl -fsSL https://l4re.org/download/snapshots/toolchain/rust-l4re-toolchain.tar.xz | tar -xJf - -C l4re --strip-components=1

          targets=(
            # aarch64-unknown-l4re-uclibc
            # x86_64-unknown-l4re-uclibc
          )
          for target in ${targets[@]}; do
            time cargo s $target
          done

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |


  WALI:
    name: WALI
    if: false
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ubuntu apt update and install
        run: |
          # sudo apt install libgcc-s1 -qy >/dev/null

      - name: WALI cache
        run: |
          IMAGE="${IMAGE,,}"
          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:wali"); then
            mkdir -p WALI && oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "WALI" && touch ~/wali.finish &
          else
            export CFLAGS="-O3 -flto -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -pipe -g0 -fvisibility=hidden"
            export CXXFLAGS="$CFLAGS -fvisibility-inlines-hidden -fno-exceptions -fno-rtti"
            export LDFLAGS="-Wl,-O3 -Wl,--gc-sections -Wl,--strip-all"

            git clone --depth=1 https://github.com/Wasm-Thin-Kernel-Interfaces/WALI.git
            cd WALI
            ./install-deps.sh
            ./quick_setup.sh
            cd ..
            touch ~/wali.finish
            tar --zstd -C WALI -cf /tmp/WALI.tar.zst .
            oras push --disable-path-validation "${IMAGE}:wali" "/tmp/WALI.tar.zst:application/vnd.wyvern.wali.tar.zstd" &
          fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
             wasm32-wali-linux-musl
          )
          for target in ${targets[@]}; do
            time cargo s $target
          done

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries

  Android:
    name: Android
    if: ${{ vars.TEST != '1' || vars.android == '1'  }}
    runs-on: ubuntu-26.04

    env:
      ndk: "r30"

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Android NDK
        run: |
          IMAGE="${IMAGE,,}"

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:android-ndk-${ndk}"); then
            mkdir ~/android-ndk-${ndk} && oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C ~/android-ndk-${ndk} &
          else
            echo "Downloading Android NDK ${ndk} ..."
            curl -fsSLO https://dl.google.com/android/repository/android-ndk-${ndk}-linux.zip
            echo "UnZipping Android NDK ${ndk} ..."
            unzip -q android-ndk-${ndk}-linux.zip -d ~/
            file=android-ndk-${ndk}
            tar --zstd -C ./$file -cf /tmp/$file.tar.zst .
            oras push --disable-path-validation "${IMAGE}:$file" "/tmp/$file.tar.zst:application/vnd.wyvern.android.tar.zstd" &
          fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@main
        with:
          version: "7.0"

      - name: Build Release
        run: |
          cargo update
          set +e -x

          export ANDROID_NDK_HOME=~/android-ndk-$ndk
          ln -sf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64" ndk

          ln -sf $OHOS_SDK_NATIVE/llvm ohos
          ln -sf $OHOS_SDK_NATIVE/sysroot ohos-root

          targets=(
            aarch64-unknown-linux-ohos
            armv7-unknown-linux-ohos
            x86_64-unknown-linux-ohos
            riscv64-linux-android
            aarch64-linux-android
            armv7-linux-androideabi
            thumbv7neon-linux-androideabi
            x86_64-linux-android
          )

          for target in ${targets[@]}; do
            time cargo s $target
          done

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |
              riscv64-linux-android
              aarch64-linux-android
              armv7-linux-androideabi
              thumbv7neon-linux-androideabi
              x86_64-linux-android
              aarch64-unknown-linux-ohos
              armv7-unknown-linux-ohos
              x86_64-unknown-linux-ohos

  ESP-IDF:
    name: ESP-IDF
    if: ${{ vars.TEST != '1' || vars.espidf == '1'  }}
    runs-on: ubuntu-26.04-arm

    steps:
      # - name: Disable macos spotlight index
      #   run: |
      #     sudo mdutil -a -i off
      #     sudo mdutil -a -d
      #     sudo pmset -a powernap 0
      #     sudo pmset -a sleep 0

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ESP-IDF tools
        run: |
          {
          git clone -b v6.1 --depth=1 https://github.com/espressif/esp-idf.git espidf
          } &>/dev/null &

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain

      - name: Cache ldproxy
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/ldproxy
          key: ${{ runner.os }}-ldproxy
          restore-keys: ${{ runner.os }}-ldproxy

      - name: Install ldproxy
        run: |
          if [[ ! -f ~/.cargo/bin/ldproxy ]]; then
            cargo install ldproxy -q &
          fi

      - name: Rust Toolchain for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.7.0

      - name: Build Release
        run: |
          cargo update
          set +e -x

          time {
          espidf/install.sh all
          . espidf/export.sh
          } &>/dev/null

          targets=(
            riscv32imac-esp-espidf
            riscv32imafc-esp-espidf
            riscv32imc-esp-espidf
          )

          for target in "${targets[@]}"; do
            time cargo s $target -Fespidf &
          done

          sleep 1

          mv .cargo/config.toml .cargo/config.toml.bak
          targets=(
            xtensa-esp32-espidf
            xtensa-esp32s2-espidf
            xtensa-esp32s3-espidf
          )
          s=(b -q --profile src -Zbuild-std=std,panic_abort --target)
          for target in "${targets[@]}"; do
            time cargo +esp "${s[@]}" $target -Fespidf --config ".cargo/espidf.toml" &
          done
          unset s
          wait

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |
            riscv32imac-esp-espidf
            riscv32imafc-esp-espidf
            riscv32imc-esp-espidf
            xtensa-esp32-espidf
            xtensa-esp32s2-espidf
            xtensa-esp32s3-espidf

  Fuchsia:
    name: Hermit+Fuchsia
    if: ${{ vars.TEST != '1' || vars.fuchsia == '1'  }}
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: LLVM Setup
        uses: ./.github/actions/llvm

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fuchsia Cache
        run: |
          IMAGE="${IMAGE,,}"

          mkdir -p /home/runner/Fuchsia;
          ln -sf /home/runner/Fuchsia fuchsia

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:fuchsia"); then
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C "/home/runner/Fuchsia" && touch ~/fuchsia.finish &
          else
            curl -LsSf 'https://chrome-infra-packages.appspot.com/client?platform=linux-amd64&version=latest' -o cipd
            chmod +x cipd
            sudo mv cipd /usr/local/bin/
            mkdir -p /home/runner/Fuchsia
            cipd install fuchsia/sdk/core/linux-amd64 latest -root /home/runner/Fuchsia
            touch ~/fuchsia.finish
            tar --zstd -C /home/runner/Fuchsia -cf /tmp/Fuchsia.tar.zst .
            oras push --disable-path-validation "${IMAGE}:fuchsia" "/tmp/Fuchsia.tar.zst:application/vnd.wyvern.fuchsia.tar.zstd" &
          fi

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain
        with:
          targets: x86_64-fortanix-unknown-sgx

      - name: Build Release
        run: |
          cargo update
          set +e -x

          mv .cargo/config.toml .cargo/config.toml.bak
          targets=(
            aarch64-unknown-hermit
            aarch64_be-unknown-hermit
            riscv64gc-unknown-hermit
            x86_64-unknown-hermit
          )
          s=(b -q --profile src -Zbuild-std=std,panic_abort --target)
          for target in ${targets[@]}; do
            time cargo "${s[@]}" $target --config ".cargo/hermit.toml" &
          done
          unset s
          sleep 1
          mv .cargo/config.toml.bak .cargo/config.toml

          time cargo s x86_64-fortanix-unknown-sgx &

          time {
              set +x
              while [[ ! -f ~/fuchsia.finish || ! -f ~/llvm.finish ]]; do
                  sleep 1
              done
          }

          targets=(
            aarch64-unknown-fuchsia
            riscv64gc-unknown-fuchsia
            x86_64-unknown-fuchsia
          )

          for target in ${targets[@]}; do
            time cargo s $target &
          done
          wait

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |
            aarch64-unknown-hermit
            aarch64_be-unknown-hermit
            riscv64gc-unknown-hermit
            x86_64-unknown-hermit
            aarch64-unknown-fuchsia
            riscv64gc-unknown-fuchsia
            x86_64-unknown-fuchsia
            x86_64-fortanix-unknown-sgx

  PPC-Sparc:
    name: Linux-PPC-Sparc
    if: ${{ vars.TEST != '1' || vars.ppc == '1'  }}
    runs-on: ubuntu-26.04

    env:
      openwrt: "25.12.5"
      aarch64be: "2026.08-1"
      hexagon: "22.1.8"

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nix Quick Install
        uses: nixbuild/nix-quick-install-action@v35

      - name: Ubuntu apt update and install
        run: |
          sudo apt install gcc-powerpc-linux-gnu gcc-powerpc64-linux-gnu gcc-sparc64-linux-gnu libc6-dev-sparc-sparc64-cross gcc-multilib-sparc64-linux-gnu musl-tools -qy &>/dev/null && touch ~/apt.finish &
          nix build --quiet -o ppc64-gnu nixpkgs#pkgsCross.ppc64-elfv2.stdenv.cc &
          nix build --quiet -o ppc64-musl nixpkgs#pkgsCross.ppc64-musl.stdenv.cc &

      - name: GHCR Setup
        uses: ./.github/actions/ghcr
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache aarch64be
        run: |
          IMAGE="${IMAGE,,}"

          path=/home/runner/aarch64be
          mkdir -p $path

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:aarch64be-${aarch64be}"); then
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C $path &
            ln -sfn $path/glibc aarch64be-gnu
            ln -sfn $path/musl aarch64be-musl
          else
            for abi in glibc musl; do
              url=https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64be/tarballs/aarch64be--${abi}--stable-${aarch64be}.tar.xz
              mkdir -p "$path/$abi" && curl -LsSf $url | tar -xJ -C "$path/$abi" --strip-components=1 &
            done
              ln -sfn $path/glibc aarch64be-gnu
              ln -sfn $path/musl aarch64be-musl
            wait
            tar --zstd -C $path -cf /tmp/aarch64be-${aarch64be}.tar.zst .
            oras push --disable-path-validation "${IMAGE}:aarch64be-${aarch64be}" "/tmp/aarch64be-${aarch64be}.tar.zst:application/vnd.wyvern.aarch64be.tar.zstd" &
          fi

      - name: Cache hexagon
        run: |
          IMAGE="${IMAGE,,}"

          path=/home/runner/hexagon
          mkdir -p $path

          if digest=$(oras manifest fetch --format go-template --template '{{ (index .content.layers 0).digest }}' "${IMAGE}:hexagon-${hexagon}"); then
            oras blob fetch --output=- "${IMAGE}@${digest}" | tar --zstd -xf - -C $path &
          else
            echo "Downloading hexagon SDK ..."
            curl -LsSf https://artifacts.codelinaro.org/artifactory/codelinaro-toolchain-for-hexagon/${hexagon}________/clang+llvm-${hexagon}-cross-hexagon-unknown-linux-musl_x86_64-linux-gnu.tar.zst | tar --zstd -xf - -C $path
            tar --zstd -C $path -cf /tmp/hexagon-${hexagon}.tar.zst .
            oras push --disable-path-validation "${IMAGE}:hexagon-${hexagon}" "/tmp/hexagon-${hexagon}.tar.zst:application/vnd.wyvern.hexagon.tar.zstd" &
          fi

          ln -sf $path/clang+llvm-${hexagon}-cross-hexagon-unknown-linux-musl/x86_64-linux-gnu hexagon

      - name: Cache openwrt
        uses: actions/cache@v6
        with:
          path: /home/runner/openwrt
          key: openwrt-${{env.openwrt}}
          restore-keys: openwrt-${{env.openwrt}}

      - name: Openwrt Setup
        run: |
          if [ ! -d /home/runner/openwrt ]; then
            mkdir -p /home/runner/openwrt
            curl -LsSf https://downloads.openwrt.org/releases/${openwrt}/targets/octeon/generic/openwrt-toolchain-${openwrt}-octeon-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst | tar --zstd -xf - -C /home/runner/openwrt &
          fi
          ln -sf /home/runner/openwrt/openwrt-toolchain-${openwrt}-octeon-generic_gcc-14.3.0_musl.Linux-x86_64/toolchain-mips64_octeonplus_64_gcc-14.3.0_musl wrt

      # - name: Install Nix
      #   uses: DeterminateSystems/nix-installer-action@main

      # - name: Install Nix
      #   uses: cachix/install-nix-action@31

      - name: Toolchain Setup
        uses: ./.github/actions/toolchain

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
            powerpc64-unknown-linux-musl
            powerpc64-unknown-linux-gnuelfv2
            )
          for target in ${targets[@]}; do
            time cargo s $target
          done

          time {
              set +x
              while [[ ! -e ~/apt.finish ]]; do
                  sleep 1
              done
          }

          targets=(
            powerpc-unknown-linux-gnu
            powerpc-unknown-linux-musl
            powerpc64-unknown-linux-gnu
            aarch64_be-unknown-linux-gnu
            aarch64_be-unknown-linux-musl
            sparc64-unknown-linux-gnu
            sparc-unknown-linux-gnu
            # aarch64-unknown-l4re-uclibc
            # x86_64-unknown-l4re-uclibc
            hexagon-unknown-linux-musl
            mips64-openwrt-linux-musl
          )

          for target in ${targets[@]}; do
            time cargo s $target &
          done
          wait

      - name: Upload release binaries
        uses: ./.github/actions/release-binaries
        with:
          targets: |
              aarch64_be-unknown-linux-gnu
              aarch64_be-unknown-linux-musl
              hexagon-unknown-linux-musl
              # aarch64-unknown-l4re-uclibc
              # x86_64-unknown-l4re-uclibc
              sparc64-unknown-linux-gnu
              sparc-unknown-linux-gnu
              powerpc64-unknown-linux-gnu
              powerpc64-unknown-linux-gnuelfv2
              powerpc64-unknown-linux-musl
              powerpc-unknown-linux-gnu
              powerpc-unknown-linux-musl
              mips64-openwrt-linux-musl


