name: Stable

on:
  push:
    branches: ["stable"]
  pull_request:
    branches: ["stable"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Building on Ubuntu.
    runs-on: ubuntu-24.04

    steps:
      - name: Purge Ubuntu
        run: |
          sudo apt purge ufw rsyslog logrotate sysstat python3-problem-report sosreport apport
          sudo apt autoremove && sudo apt clean
          sudo systemctl disable --now systemd-journald

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,riscv64gc-unknown-linux-gnu,s390x-unknown-linux-gnu,powerpc64le-unknown-linux-gnu,powerpc64-unknown-linux-gnu,sparc64-unknown-linux-gnu,loongarch64-unknown-linux-gnu,loongarch64-unknown-linux-musl

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Ubuntu apt update and install
        continue-on-error: true
        run: |
          sudo apt update -q && sudo apt install -q gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu gcc-s390x-linux-gnu gcc-powerpc64le-linux-gnu gcc-powerpc64-linux-gnu gcc-sparc64-linux-gnu gcc-14-loongarch64-linux-gnu musl-tools -y

      - name: Build Release
        run: |
          cargo update

          set +e -x

          time cargo l --target sparc64-unknown-linux-gnu

          time cargo l --target powerpc64le-unknown-linux-gnu
          time cargo l --target powerpc64-unknown-linux-gnu

          time cargo l --target s390x-unknown-linux-gnu
          # time cargo l --target s390x-unknown-linux-musl

          time cargo l --target riscv64gc-unknown-linux-gnu
          # time cargo l --target riscv64gc-unknown-linux-musl

          time cargo l --target x86_64-unknown-linux-gnu
          time cargo l --target x86_64-unknown-linux-musl

          time cargo l --target aarch64-unknown-linux-gnu
          time cargo l --target aarch64-unknown-linux-musl

          time cargo l --target loongarch64-unknown-linux-gnu
          time cargo l --target loongarch64-unknown-linux-musl

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload Linux-sparc64-gnu to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/sparc64-unknown-linux-gnu/lto/Img
          asset_name: Linux-sparc64-gnu
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-sparc64-gnu binary executable."

      - name: Upload Linux-powerpc64le-gnu to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/powerpc64le-unknown-linux-gnu/lto/Img
          asset_name: Linux-powerpc64le-gnu
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-powerpc64le-gnu binary executable."

      - name: Upload Linux-powerpc64-gnu to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/powerpc64-unknown-linux-gnu/lto/Img
          asset_name: Linux-powerpc64-gnu
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-powerpc64-gnu binary executable."

      - name: Upload Linux-riscv64gc-gnu to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/riscv64gc-unknown-linux-gnu/lto/Img
          asset_name: Linux-riscv64gc-gnu
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-riscv64gc-gnu binary executable."

      - name: Upload Linux-riscv64gc-musl to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/riscv64gc-unknown-linux-musl/lto/Img
          asset_name: Linux-riscv64gc-musl
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-riscv64gc-musl binary executable."

      - name: Upload Linux-s390x-gnu to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/s390x-unknown-linux-gnu/lto/Img
          asset_name: Linux-s390x-gnu
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-s390x-gnu binary executable."

      - name: Upload Linux-x86_64-gnu to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-unknown-linux-gnu/lto/Img
          asset_name: Linux-x86_64-gnu
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-x86_64-gnu binary executable."

      - name: Upload Linux-x86_64-musl to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-unknown-linux-musl/lto/Img
          asset_name: Linux-x86_64-musl
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-x86_64-musl binary executable."

      - name: Upload Linux-aarch64-gnu to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-unknown-linux-gnu/lto/Img
          asset_name: Linux-aarch64-gnu
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-aarch64-gnu binary executable."

      - name: Upload Linux-aarch64-musl to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-unknown-linux-musl/lto/Img
          asset_name: Linux-aarch64-musl
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-aarch64-musl binary executable."

      - name: Upload Linux-loongarch64-gnu to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/loongarch64-unknown-linux-gnu/lto/Img
          asset_name: Linux-loongarch64-gnu
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-loongarch64-gnu binary executable."

      - name: Upload Linux-loongarch64-musl to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/loongarch64-unknown-linux-musl/lto/Img
          asset_name: Linux-loongarch64-musl
          tag: Stable
          overwrite: true
          body: "Ubuntu Linux-loongarch64-musl binary executable."

  macOS:
    name: Building on macOS.
    runs-on: macos-14

    steps:
      - name: Disable macos spotlight index
        run: |
          sudo mdutil -a -i off
          sudo mdutil -a -d
          sudo pmset -a powernap 0
          sudo pmset -a sleep 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-ios,x86_64-linux-android,aarch64-linux-android,armv7-linux-androideabi,wasm32-wasip2

      - name: Android NDK setup
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true
          local-cache: true

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Install cargo-ndk
        run: cargo install --git https://github.com/bbqsrc/cargo-ndk --tag v3.5.7

      - name: Build Release
        run: |
          # brew install cargo-zigbuild

          cargo update
          set +e -x
          time cargo l --target aarch64-apple-darwin
          time cargo l --target aarch64-apple-ios
          time cargo l --target x86_64-apple-darwin
          time cargo l --target wasm32-wasip2

          lipo -create target/aarch64-apple-darwin/lto/Img target/x86_64-apple-darwin/lto/Img -output Img-Universal

          time cargo ndk -t x86_64-linux-android -t aarch64-linux-android -t armv7-linux-androideabi b --profile lto -q

          find . \( -iname img -o -iname img.wasm -o -iname Img-Universal \) -type f | xargs ls -hl
          sw_vers
          hostinfo
          sysctl -a | grep brand

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload macOS x86-64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-apple-darwin/lto/Img
          asset_name: Apple-macOS-x86_64
          tag: Stable
          overwrite: true
          body: "macOS x86-64 binary executable."

      - name: Upload macOS-aarch64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-apple-darwin/lto/Img
          asset_name: Apple-macOS-aarch64
          tag: Stable
          overwrite: true
          body: "macOS aarch64 binary executable."

      - name: Upload iOS to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-apple-ios/lto/Img
          asset_name: Apple-iOS
          tag: Stable
          overwrite: true
          body: "iOS binary executable."

      - name: Upload Wasm32-wasip2 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/wasm32-wasip2/lto/Img.wasm
          asset_name: wasm32-wasip2.wasm
          tag: Stable
          overwrite: true
          body: "Wasm32-wasip2"

      - name: Upload macOS-universal to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Img-Universal
          asset_name: Apple-macOS-universal
          tag: Stable
          overwrite: true
          body: "macOS universal binary executable."

      - name: Upload Android-x86_64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-linux-android/lto/Img
          asset_name: Android-x86_64
          tag: Stable
          overwrite: true
          body: "Android-x86_64 binary executable."

      - name: Upload Android-aarch64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-linux-android/lto/Img
          asset_name: Android-aarch64
          tag: Stable
          overwrite: true
          body: "Android-aarch64 binary executable."

      - name: Upload Android-armv7 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/armv7-linux-androideabi/lto/Img
          asset_name: Android-armv7
          tag: Stable
          overwrite: true
          body: "Android-armv7 binary executable."

  Windows:
    name: Building on Windows.
    runs-on: windows-latest

    steps:
      - name: Disable and Stop windows services
        run: |
          $pattern = "tele|diag|exper|search|logs|assist|report|logg";
          $services = Get-Service -ErrorAction SilentlyContinue|? DisplayName -match $pattern

          $services | Set-Service -StartMode Disabled
          $services | Stop-Service

          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AdvertisingInfo" /v Enabled /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f

          schtasks /change /TN "\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser" /DISABLE
          schtasks /change /TN "\Microsoft\Windows\Application Experience\ProgramDataUpdater" /DISABLE
          schtasks /change /TN "\Microsoft\Windows\Customer Experience Improvement Program\Consolidator" /DISABLE
          schtasks /change /TN "\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector" /DISABLE

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,arm64ec-pc-windows-msvc
          # components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Build release
        run: |
          cargo update

          Write-Host "Building: x86_64-pc-windows-msvc"
          Measure-Command {cargo l --target x86_64-pc-windows-msvc}

          Write-Host "Building: aarch64-pc-windows-msvc"
          Measure-Command {cargo l --target aarch64-pc-windows-msvc}

          Write-Host "Building: arm64ec-pc-windows-msvc"
          Measure-Command {cargo l --target arm64ec-pc-windows-msvc}

          cmd /r dir /s target\Img.exe
          systeminfo

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload Windows-x64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-pc-windows-msvc/lto/Img.exe
          asset_name: Windows-x86_64.exe
          tag: Stable
          overwrite: true
          body: "Windows x64 binary executable."

      - name: Upload Windows-aarch64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-pc-windows-msvc/lto/Img.exe
          asset_name: Windows-aarch64.exe
          tag: Stable
          overwrite: true
          body: "Windows aarch64 binary executable."

      - name: Upload Windows-arm64ec to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/arm64ec-pc-windows-msvc/lto/Img.exe
          asset_name: Windows-arm64ec.exe
          tag: Stable
          overwrite: true
          body: "Windows arm64ec binary executable."
