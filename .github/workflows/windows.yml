name: Windows

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Windows:
    name: Building on Windows.
    runs-on: windows-2025
    strategy:
      matrix:
        target:
          - {
              arch: "aarch64-pc-windows-msvc",
              name: "Windows-aarch64",
              desc: "Windows aarch64",
            }
          - {
              arch: "aarch64-uwp-windows-msvc",
              name: "Windows-aarch64-uwp",
              desc: "Windows aarch64 uwp",
            }
          - {
              arch: "x86_64-pc-windows-msvc",
              name: "Windows-x86_64",
              desc: "Windows x86_64",
            }
          - {
              arch: "x86_64-uwp-windows-msvc",
              name: "Windows-x86_64-uwp",
              desc: "Windows x86_64 uwp",
            }
          - {
              arch: "arm64ec-pc-windows-msvc",
              name: "Windows-arm64ec",
              desc: "Windows arm64ec",
            }
    steps:
      - name: Disable and Stop windows services
        continue-on-error: true
        run: |
          $pattern = "maint|diag|exper|search|logs|assist|report|logg|defend";
          $services = Get-Service -ErrorAction SilentlyContinue|? DisplayName -match $pattern

          $services | Set-Service -StartMode Disabled -ErrorAction SilentlyContinue
          $services | Stop-Service -Force -ErrorAction SilentlyContinue

          $services | % {$_.DisplayName; $_.Status}

          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AdvertisingInfo" /v Enabled /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f

          schtasks /delete /tn * /f >NUL

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Build release
        run: |
          cargo update
          $targets = @(
                      aarch64-pc-windows-msvc
                      aarch64-uwp-windows-msvc
                      x86_64-pc-windows-msvc
                      x86_64-uwp-windows-msvc
                      arm64ec-pc-windows-msvc
                    )
          foreach ($target in $targets) {
                      Write-Host "Building: $target"
                      Measure-Command { cargo s --target $target }
                    }

          # cmd /c dir /s target\src\Img.exe
          Get-ChildItem -Path target\*\src\Img.exe -File
          systeminfo

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload ${{ matrix.target.name }} to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target.arch }}/src/Img
          asset_name: ${{ matrix.target.name }}
          tag: Nightly
          overwrite: true
          body: ${{ matrix.target.desc }} binary executable.
