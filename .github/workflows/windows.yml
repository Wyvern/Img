name: Windows

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Windows:
    name: Building on Windows.
    runs-on: windows-latest

    steps:
      - name: Disable and Stop windows services
        run: |
          $pattern = "tele|diag|exper|search|logs|assist|report|logg|task";
          $services = Get-Service -ErrorAction SilentlyContinue|? DisplayName -match $pattern

          $services | Set-Service -StartMode Disabled -ErrorAction SilentlyContinue
          $services | Stop-Service -Force -ErrorAction SilentlyContinue
          $services | ForEach-Object {$_.DisplayName}

          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AdvertisingInfo" /v Enabled /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Build release
        run: |
          cargo update

          Write-Host "Building: aarch64-pc-windows-msvc"
          Measure-Command {cargo s --target aarch64-pc-windows-msvc}

          Write-Host "Building: x86_64-pc-windows-msvc"
          Measure-Command {cargo s --target x86_64-pc-windows-msvc}

          Write-Host "Building: arm64ec-pc-windows-msvc"
          Measure-Command {cargo s --target arm64ec-pc-windows-msvc}

          cmd /c dir /s target\Img.exe
          systeminfo

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload Windows-x64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-pc-windows-msvc/src/Img.exe
          asset_name: Windows-x86_64.exe
          tag: Nightly
          overwrite: true
          body: "Windows x64 binary executable."

      - name: Upload Windows-aarch64 to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-pc-windows-msvc/src/Img.exe
          asset_name: Windows-aarch64.exe
          tag: Nightly
          overwrite: true
          body: "Windows aarch64 binary executable."

      - name: Upload Windows-arm64ec to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/arm64ec-pc-windows-msvc/src/Img.exe
          asset_name: Windows-arm64ec.exe
          tag: Nightly
          overwrite: true
          body: "Windows arm64ec binary executable."
