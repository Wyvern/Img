name: Sparc64

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Sparc64
    runs-on: ubuntu-26.04

    permissions:
          contents: read
          packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          # toolchain: nightly-2026-02-09

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Install LLVM
        run: |
          ver=23
          if [ "$ver" = "23" ]; then
              wget https://apt.llvm.org/llvm.sh
              chmod +x llvm.sh
              sudo ./llvm.sh $ver
          fi
          for x in clang clang++ lld; do
            sudo update-alternatives --install "/usr/bin/$x" "$x" "/usr/bin/$x-$ver" 200
          done
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/lld-$ver 200

      # - uses: taiki-e/setup-cross-toolchain-action@v1
      #   with:
      #     target: sparc64-unknown-netbsd@10

      # - uses: taiki-e/setup-cross-toolchain-action@v1
      #   with:
      #     target: sparc64-unknown-openbsd

      - name: Checkout rust-cross-toolchain
        uses: actions/checkout@v7
        with:
          repository: taiki-e/rust-cross-toolchain
          path: rust-cross-toolchain

      - name: Login to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build toolchain
        working-directory: rust-cross-toolchain
        env:
          NETBSD_VERSION: 11.0
          OPENBSD_VERSION: 7.9
        run: |
          ./tools/build-docker.sh sparc64-unknown-netbsd
          ./tools/build-docker.sh sparc64-unknown-openbsd

      - name: Publish toolchains
        env:
            REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          docker tag \
                  ghcr.io/taiki-e/rust-cross-toolchain:sparc64-unknown-netbsd11.0-dev-amd64 \
                  "$REGISTRY:sparc64-unknown-netbsd11.0"

          docker tag \
                  ghcr.io/taiki-e/rust-cross-toolchain:sparc64-unknown-openbsd7.9-dev-amd64 \
                  "$REGISTRY:sparc64-unknown-openbsd7.9"

          docker push "$REGISTRY:sparc64-unknown-netbsd11.0"
          docker push "$REGISTRY:sparc64-unknown-openbsd7.9"

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
            sparc64-unknown-netbsd
            sparc64-unknown-openbsd
          )

          for target in ${targets[@]}; do
            time cargo s $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            target/**/img*
            !target/**/*.d
          if-no-files-found: ignore

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
            sparc64-unknown-netbsd
            sparc64-unknown-openbsd
          )
          for target in "${targets[@]}"; do
            IFS='-' read -r arch vendor os abi <<< "$target"
            if [[ -n "$abi" ]]; then
                name="${os^}-${arch}-${abi}"
            else
                name="${os^}-${arch}"
            fi
            echo "Uploading $name..."
            mv target/$target/src/{img,$name} || true
            gh release upload Nightly --clobber target/$target/src/$name || true
          done
