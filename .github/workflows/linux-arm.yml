name: Linux-arm

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Building on Ubuntu.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        target:
          - {
              arch: "powerpc64le-unknown-linux-gnu",
              name: "Linux-powerpc64le-gnu",
              desc: "Linux-powerpc64le-gnu",
            }
          - {
              arch: "powerpc64le-unknown-linux-musl",
              name: "Linux-powerpc64le-musl",
              desc: "Linux-powerpc64le-musl",
            }
          - {
              arch: "sparc64-unknown-linux-gnu",
              name: "Linux-sparc64-gnu",
              desc: "Linux-sparc64-gnu",
            }
          - {
              arch: "mips64-unknown-linux-gnuabi64",
              name: "Linux-mips64-gnuabi64",
              desc: "Linux-mips64-gnuabi64",
            }
          - {
              arch: "mips64-unknown-linux-muslabi64",
              name: "Linux-mips64-muslabi64",
              desc: "Linux-mips64-muslabi64",
            }
          - {
              arch: "mips64el-unknown-linux-gnuabi64",
              name: "Linux-mips64el-gnuabi64",
              desc: "Linux-mips64el-gnuabi64",
            }
          - {
              arch: "mips64el-unknown-linux-muslabi64",
              name: "Linux-mips64el-muslabi64",
              desc: "Linux-mips64el-muslabi64",
            }
          - {
              arch: "s390x-unknown-linux-gnu",
              name: "Linux-s390x-gnu",
              desc: "Linux-s390x-gnu",
            }
          - {
              arch: "s390x-unknown-linux-musl",
              name: "Linux-s390x-musl",
              desc: "Linux-s390x-musl",
            }
          - {
              arch: "riscv64gc-unknown-linux-gnu",
              name: "Linux-riscv64gc-gnu",
              desc: "Linux-riscv64gc-gnu",
            }
          - {
              arch: "riscv64gc-unknown-linux-musl",
              name: "Linux-riscv64gc-musl",
              desc: "Linux-riscv64gc-musl",
            }
          - {
              arch: "x86_64-unknown-linux-gnu",
              name: "Linux-x86_64-gnu",
              desc: "Linux-x86_64-gnu",
            }
          - {
              arch: "x86_64-unknown-linux-musl",
              name: "Linux-x86_64-musl",
              desc: "Linux-x86_64-musl",
            }
          - {
              arch: "aarch64-unknown-linux-gnu",
              name: "Linux-aarch64-gnu",
              desc: "Linux-aarch64-gnu",
            }
          - {
              arch: "aarch64-unknown-linux-musl",
              name: "Linux-aarch64-musl",
              desc: "Linux-aarch64-musl",
            }
          - {
              arch: "loongarch64-unknown-linux-gnu",
              name: "Linux-loongarch64-gnu",
              desc: "Linux-loongarch64-gnu",
            }
          - {
              arch: "loongarch64-unknown-linux-musl",
              name: "Linux-loongarch64-musl",
              desc: "Linux-loongarch64-musl",
            }

    steps:
      - name: Purge Ubuntu
        run: |
          sudo apt purge -y ufw rsyslog logrotate sysstat python3-problem-report sosreport apport
          sudo apt autoremove -y && sudo apt clean
          sudo systemctl disable --now systemd-journald

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Ubuntu apt update and install
        run: |
          sudo apt update -q && sudo apt install -q gcc-x86-64-linux-gnu gcc-riscv64-linux-gnu gcc-s390x-linux-gnu gcc-powerpc64le-linux-gnu  gcc-sparc64-linux-gnu gcc-mips64-linux-gnuabi64 gcc-mips64el-linux-gnuabi64 gcc-14-loongarch64-linux-gnu musl-tools -y

      - name: Build Release
        run: |
          # sudo snap install zig --classic --beta
          # pipx install cargo-zigbuild

          cargo update
          set +e -x

          targets=(
            powerpc64le-unknown-linux-gnu,
            powerpc64le-unknown-linux-musl,
            sparc64-unknown-linux-gnu,
            mips64-unknown-linux-gnuabi64,
            mips64-unknown-linux-muslabi64,
            mips64el-unknown-linux-gnuabi64,
            mips64el-unknown-linux-muslabi64,
            s390x-unknown-linux-gnu,
            s390x-unknown-linux-musl,
            riscv64gc-unknown-linux-gnu,
            riscv64gc-unknown-linux-musl,
            x86_64-unknown-linux-gnu,
            x86_64-unknown-linux-musl,
            aarch64-unknown-linux-gnu,
            aarch64-unknown-linux-musl,
            loongarch64-unknown-linux-gnu,
            loongarch64-unknown-linux-musl,
          )
          # powerpc64-unknown-linux-gnu,
          # powerpc64-unknown-linux-musl,
          for target in "${targets[@]}"; do
            echo "Building for target: $target"
            time cargo s --target $target
          done

          find ./target -iname img -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload ${{ matrix.target.name }} to a GitHub release
        uses: svenstaro/upload-release-action@v2
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target.arch }}/src/Img
          asset_name: ${{ matrix.target.name }}
          tag: Nightly
          overwrite: true
          body: ${{ matrix.target.desc }} binary executable.
