name: Install MSYS2 Packages
description: Install MinGW GCC toolchains and Windows Store compatibility libraries

runs:
  using: composite
  steps:
    - name: Configure MSYS2 mirrors
      shell: pwsh
      run: |
        $dir = 'C:\msys64\etc\pacman.d'

        'Server = https://repo.msys2.org/mingw/$arch/' |
          Set-Content "$dir\mirrorlist.mingw" -Encoding ascii

        'Server = https://repo.msys2.org/msys/$arch/' |
          Set-Content "$dir\mirrorlist.msys" -Encoding ascii

    - name: Synchronize MSYS2 databases
      shell: pwsh
      run: |
        & C:\msys64\usr\bin\bash.exe -lc 'pacman -Syy --noconfirm'
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    - name: Install MSYS2 packages
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm mingw-w64-i686-gcc mingw-w64-x86_64-gcc mingw-w64-x86_64-winstorecompat mingw-w64-i686-winstorecompat'

        # & $bash -lc '
        #   curl -fsSL -o /tmp/winstorecompat.pkg.tar.zst \
        #     https://repo.msys2.org/mingw/mingw32/mingw-w64-i686-winstorecompat-14.0.0.r92.g818fa6510-1-any.pkg.tar.zst &&
