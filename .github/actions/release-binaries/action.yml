name: Upload binaries to a GitHub release
description: Rename and upload cross-compiled binaries to the Nightly release

inputs:
  targets:
    description: Newline-separated list of Rust target triples
    required: false
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: build-output

runs:
  using: composite
  steps:
    - name: Rust Versions
      shell: bash
      run: rustup -V; cargo -Vv; rustc -Vv

    - name: Set lowercase repository name
      shell: bash
      run: echo "PROJECT=$(printf '%s' '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

    - name: Detect Rust package name
      id: project
      shell: bash
      run: |
        echo "name=$(cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[0].name')" >> "$GITHUB_OUTPUT"

    - name: Show project name
      shell: bash
      run: echo "${{ steps.project.outputs.name }}"

    - name: Show build target binaries
      shell: bash
      run: |
        bin=${{ steps.project.outputs.name }}
        if [[ -d ./target ]]; then
          find ./target -type f \( -iname "$bin" -o -iname "$bin.*" \) ! -iname "$bin.d" -exec ls -hl {} +
        fi

    - name: Linux System Info
      if: runner.os == 'Linux'
      shell: bash
      run: |
        uname -a
        lscpu
        free -h

    - name: macOS System Info
      if: runner.os == 'macOS'
      shell: bash
      run: |
        sw_vers
        hostinfo
        sysctl -n machdep.cpu.brand_string

    - name: Windows System Info
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name
        Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          target/**/${{ env.PROJECT }}*
          !target/**/*.d
        if-no-files-found: ignore

    - name: Upload binaries to a GitHub release
      if: inputs.targets != ''
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TARGETS: ${{ inputs.targets }}
      run: |
        while IFS= read -r target; do
          [[ -z "$target" ]] && continue
          [[ "$target" =~ ^[[:space:]]*# ]] && continue

          IFS='-' read -r arch vendor os abi <<< "$target"

          cap() {
            if (( BASH_VERSINFO[0] >= 4 )); then
              printf '%s' "${1^}"
            else
              printf '%s%s' \
                "$(printf '%s' "${1:0:1}" | tr '[:lower:]' '[:upper:]')" \
                "${1:1}"
            fi
          }

          if [[ "$vendor" == "apple" ]]; then
            if [[ "$os" == "darwin" ]]; then
              os="macOS"
            elif [[ "$os" == *os ]]; then
              os="${os%os}OS"
            fi
            name=Apple-${os}-${arch}
          elif [[ -n "$abi" ]]; then
            if [[ "$vendor" == "openwrt" ]]; then
                name="$(cap $vendor)-${arch}-${abi}"
            elif [[ "$vendor" == "oe" ]]; then
                name="OpenEmbedded-${arch}-${abi}"
            elif [[ "$vendor" == "pc" ]]; then
                if [[ "$abi" == "msvc" ]]; then
                  name="$(cap $os)-${arch}"
                else
                  name="$(cap $os)-${arch}-${abi}"
                fi
            elif [[ "$os" == "unknown" ]]; then
                  name="$(cap $vendor)-${abi}"
            else
              if [[ "$abi" == "ohos" ]]; then
                  name="Android-${arch}-${abi}"
              elif [[ "$abi" == "msvc" ]]; then
                  name="$(cap $os)-${arch}-${vendor}"
              else
                  name="$(cap $os)-${arch}-${abi}-${vendor}"
              fi
            fi
          else
            if [[ "$os" == "androideabi" ]]; then
                name="Android-${arch}"
            elif [[ "$arch" == "xtensa" ]]; then
                name="$(cap $os)-${vendor}"
            elif [[ "$os" == "threads" ]]; then
                name="$(cap $arch)-${vendor}-${os}"
            elif [[ "$os" == "unknown" ]]; then
                name="$(cap $arch)-${os}"
            elif [[ -z "$os" ]]; then
                name="$(cap $arch)-${vendor}"
            else
                name="$(cap $os)-${arch}"
            fi
          fi

          # PROJECT=${{ env.PROJECT }}
          PROJECT=${{ steps.project.outputs.name }}

          echo -e "\033[32m::Uploading:: \033[93m $name \033[0m"

          if [[ "$os" == "windows" ]]; then
            mv target/$target/src/{$PROJECT.exe,$name.exe} || true
            gh release upload Nightly "target/$target/src/$name.exe" --clobber || true
          elif [[ "$target" == wasm* ]]; then
            mv target/$target/src/{$PROJECT.wasm,$name.wasm} || true
            gh release upload Nightly "target/$target/src/$name.wasm" --clobber || true
          elif [[ "$os" == "espidf" ]]; then
            mv espidf/target/$target/src/{$PROJECT,$name} || true
            gh release upload Nightly "espidf/target/$target/src/$name" --clobber || true
          elif [[ "$os" == "emscripten" ]]; then
            tar -cJf Wasm32-emscripten.tar.xz -C target/$target/src $PROJECT.wasm $PROJECT.js || true
            gh release upload Nightly Wasm32-emscripten.tar.xz --clobber || true
          else
            mv target/$target/src/{$PROJECT,$name} || true
            gh release upload Nightly "target/$target/src/$name" --clobber || true
          fi
        done <<< "$TARGETS"

        if [[ -f Img-Universal ]]; then
          echo -e "\033[32m::Uploading:: \033[93m Apple-macOS-universal \033[0m"
          gh release upload Nightly Img-Universal#Apple-macOS-universal --clobber || true
        fi
