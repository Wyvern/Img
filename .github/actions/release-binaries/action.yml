name: Upload binaries to a GitHub release
description: Rename and upload cross-compiled binaries to the Nightly release

inputs:
  targets:
    description: Newline-separated list of Rust target triples
    required: false
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: build-output

runs:
  using: composite
  steps:
    - name: Rust Versions
      shell: bash
      run: rustup -V; cargo -Vv; rustc -Vv

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          target/**/${{ github.event.repository.name }}*
          !target/**/*.d
        if-no-files-found: ignore

    - name: Upload binaries to a GitHub release
      if: inputs.targets != ""
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PROJECT: ${{ github.event.repository.name }}
        TARGETS: ${{ inputs.targets }}
      run: |
        while IFS= read -r target; do
          [[ -z "$target" ]] && continue

          IFS='-' read -r arch vendor os abi <<< "$target"

          if [[ "$vendor" == "win7" ]]; then
            name="${os^}-${arch}-${abi}-${vendor}"
          elif [[ -n "$abi" ]]; then
            if [[ "$vendor" == "openwrt" ]]; then
                name="${vendor^}-${arch}-${abi}"
            elif [[ "$vendor" == "oe" ]]; then
                name="OpenEmbedded-${arch}-${abi}"
            elif [[ "$os" == "unknown" ]]; then
                name="${vendor^}-${abi}"
            else
              if [[ "$abi" == "ohos" ]]; then
                  name="Android-${arch}-${abi}"
              else
                  name="${os^}-${arch}-${abi}"
              fi
            fi
          else
            if [[ "$os" == "androideabi" ]]; then
                name="Android-${arch}"
            elif [[ "$arch" == "xtensa" ]]; then
                name="${os^}-${vendor}"
            else
                name="${os^}-${arch}"
            fi
          fi

          echo "Uploading $name..."
          if [[ "$os" == "windows" ]]; then
            mv target/$target/src/{$PROJECT.exe,$name.exe} || true
            gh release upload Nightly "target/$target/src/$name.exe" --clobber || true
          elif [[ "$os" == "espidf" ]]; then
            mv espidf/target/$target/src/{$PROJECT,$name} || true
            gh release upload Nightly "espidf/target/$target/src/$name" --clobber || true
          elif [[ "$os" == "emscripten" ]]; then
            echo "Uploading Wasm32-emscripten..."
            tar -cJf Wasm32-emscripten.tar.xz -C target/$target/src img.wasm img.js
            gh release upload Nightly Wasm32-emscripten.tar.xz --clobber
          else
            mv target/$target/src/{$PROJECT,$name} || true
            gh release upload Nightly "target/$target/src/$name" --clobber || true
          fi
        done <<< "$TARGETS"
