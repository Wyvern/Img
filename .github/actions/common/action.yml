name: Common setup
description: Checkout repository, install ORAS, and log in to GHCR

inputs:
  token:
    description: GitHub token for GHCR authentication
    required: false
  ghcr:
    description: Whether to install ghcr support
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Validate GHCR token
      if: inputs.ghcr == 'true' && inputs.token == ''
      shell: bash
      run: |
        echo "::error:: The token input is required when ghcr is true."
        exit 1

    - name: setup-oras
      if: inputs.ghcr == 'true'
      uses: oras-project/setup-oras@v2

    - name: Login to GHCR
      if: inputs.ghcr == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
