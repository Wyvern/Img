name: GHCR setup
description: Install ORAS, and log in to GHCR

inputs:
  token:
    description: GitHub token for GHCR authentication
    required: true

runs:
  using: composite
  steps:
    - name: setup-oras
      uses: oras-project/setup-oras@v2

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
