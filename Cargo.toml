[package]
name = "Img"
version = "1.0.0"
edition = "2024"

[features]
default = ["curl"]
curl = []
download = []
infer = ["dep:infer"]
embed = ["dep:base64"]

[[example]]
name = "color"
path = "src/color.rs"

[dependencies]
arcdom = { path = "arcdom" }
serde_json = "*"
percent-encoding = "*"
serde_cbor_2 = "*"

base64 = { version = "*", default-features = false, optional = true }
infer = { version = "*", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
termion = "*"

[build-dependencies]
serde_json = "*"
serde_cbor_2 = "*"

[dev-dependencies]
# file-format = { version = "*", features = ["reader-xml"] }

[workspace]
members = ["arcdom"]
