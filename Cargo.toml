[package]
name = "img"
version = "1.0.0"
edition = "2024"

[features]
default = []
download = []
infer = ["dep:file-format","dep:fork"]
embed = ["dep:base64"]

[[example]]
name = "color"
path = "src/color.rs"

[dependencies]
arcdom = { path = "arcdom" }
serde_json = "*"
percent-encoding = "*"
cbor4ii = { version = "*", features = ["use_std", "serde1"] }

base64 = { version = "*", default-features = false, optional = true }
file-format = { version = "*", optional = true }

[target.'cfg(unix)'.dependencies]
termion = "*"
fork = { version = "*", optional = true }

[build-dependencies]
serde_json = "*"
cbor4ii = { version = "*", features = ["use_std", "serde1"] }

[dev-dependencies]
# file-format = { version = "*", features = ["reader-xml"] }

[workspace]
members = ["arcdom"]
