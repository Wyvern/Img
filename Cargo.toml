[package]
name = "img"
version = "1.0.0"
edition = "2024"

[features]
default = []
download = []
embed = ["dep:base64"]

[[example]]
name = "color"
path = "src/color.rs"
test = false

[dependencies]
arcdom = { path = "arcdom" }
serde_json = "*"
percent-encoding = "*"
cbor4ii = { version = "*", features = ["use_std", "serde1"] }
base64 = { version = "*", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
termion = "*"
fork = "*"
file-format = "*"

[target.'cfg(target_os = "hermit")'.dependencies]
hermit = "*"

[build-dependencies]
serde_json = "*"
cbor4ii = { version = "*", features = ["use_std", "serde1"] }

[dev-dependencies]
# file-format = { version = "*", features = ["reader-xml"] }

[workspace]
members = ["arcdom"]
